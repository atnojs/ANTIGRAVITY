<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>midiendo</title>
<style>html,body{margin:0;background:#05070c;color:#cfe}iframe{border:0;width:900px;height:400px}
pre{position:fixed;left:0;bottom:0;width:100%;max-height:70%;overflow:auto;background:#000d;color:#9fe;font-size:11px}</style>
</head><body>
<iframe id="f" src="/app/index.html"></iframe>
<pre id="out">midiendo...</pre>
<script>
const BASE = new URLSearchParams(location.search).get('base') || '/app';
const f = document.getElementById('f'), out = document.getElementById('out');
const sleep = ms => new Promise(r => setTimeout(r, ms));
function cargar(u) { return new Promise(res => { f.onload = res; f.src = u; setTimeout(res, 20000); }); }
(async () => {
  try {
    await cargar(BASE + '/index.html?' + Date.now());
    await sleep(12000);
    const win = f.contentWindow, ls = win.localStorage;
    const carpetas = JSON.parse(ls.getItem('trickvault_folders') || '[]');
    const datos = JSON.parse(ls.getItem('trickvault_data') || '[]');
    const cuenta = {};
    for (const t of datos) cuenta[t.category || '(sin carpeta)'] = (cuenta[t.category || '(sin carpeta)'] || 0) + 1;
    out.textContent = carpetas.map(c => (c.id + ' | ' + c.label + ' | tarjetas=' + (cuenta[c.id] || 0))).join('\n')
      + '\n\n--- categorias que NO estan en la lista de carpetas ---\n'
      + Object.keys(cuenta).filter(k => !carpetas.some(c => c.id === k)).map(k => k + ' (' + cuenta[k] + ')').join('\n');
    out.textContent += '\n\n--- tarjetas en xl-carteles (' + (cuenta['xl-carteles'] || 0) + ') ---\n'
      + datos.filter(t => t.category === 'xl-carteles').map(t => t.codeSnippet).join(' ');
    out.textContent += '\n\n--- tarjetas en la carpeta f_mv73ghs02h22sxpzp ---\n'
      + datos.filter(t => t.category === 'f_mv73ghs02h22sxpzp').map(t => t.codeSnippet).join(' ');
    const mirar = ['/banner', '/crosssection', '/invitation', '/museumplaque', '/securitycam'];
    out.textContent += '\n\n--- donde estan las 5 que faltan ---\n'
      + mirar.map(c => { const t = datos.find(x => x.codeSnippet === c); return c + ' -> ' + (t ? t.category + ' (id ' + t.id + ')' : 'NO EXISTE'); }).join('\n');
    document.title = 'carpetas=' + carpetas.length + ' moda=' + (cuenta['xl-moda'] || 0)
      + ' comida=' + (cuenta['xl-comidamoda'] || 0) + ' carteles=' + (cuenta['xl-carteles'] || 0);
  } catch (e) { out.textContent = 'ERROR ' + (e && e.message || e); document.title = 'ERROR'; }
})();
</script>
</body></html>
