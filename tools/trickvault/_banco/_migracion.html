<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>midiendo</title>
<style>html,body{margin:0;background:#05070c;color:#cfe}iframe{border:0;width:900px;height:400px}
pre{position:fixed;left:0;bottom:0;width:100%;max-height:70%;overflow:auto;background:#000d;color:#9fe;font-size:11px}</style>
</head><body>
<iframe id="f" src="/app/index.html"></iframe>
<pre id="out">midiendo...</pre>
<script>
// Simula el navegador de Antonio ANTES del cambio: lista de carpetas sin xl-moda,
// «Comida y moda» como nombre, esquema 5, y las 25 tarjetas de moda guardadas en
// la carpeta vieja. Tras recargar deben quedar 25 en Moda y 26 en Comida, con los
// nombres nuevos.
const f = document.getElementById('f'), out = document.getElementById('out');
const sleep = ms => new Promise(r => setTimeout(r, ms));
function cargar(u) { return new Promise(res => { f.onload = res; f.src = u; setTimeout(res, 20000); }); }
(async () => {
  try {
    await cargar('/app/index.html?' + Date.now());
    await sleep(12000);
    const win = f.contentWindow, ls = win.localStorage;
    const datos = JSON.parse(ls.getItem('trickvault_data') || '[]');
    let movidas = 0;
    for (const t of datos) if (t.category === 'xl-moda') { t.category = 'xl-comidamoda'; movidas++; }
    ls.setItem('trickvault_data', JSON.stringify(datos));
    const carpetas = JSON.parse(ls.getItem('trickvault_folders') || '[]')
      .filter(c => c.id !== 'xl-moda')
      .map(c => c.id === 'xl-comidamoda' ? { ...c, label: 'Comida y moda', bgIcon: '👗' } : c);
    ls.setItem('trickvault_folders', JSON.stringify(carpetas));
    ls.setItem('trickvault_folders_schema', '5');
    await cargar('/app/index.html?r=' + Date.now());
    await sleep(13000);
    const w2 = f.contentWindow, ls2 = w2.localStorage;
    const d2 = JSON.parse(ls2.getItem('trickvault_data') || '[]');
    const c2 = JSON.parse(ls2.getItem('trickvault_folders') || '[]');
    const moda = d2.filter(t => t.category === 'xl-moda').length;
    const comida = d2.filter(t => t.category === 'xl-comidamoda').length;
    const etiquetas = c2.filter(x => ['xl-moda', 'xl-comidamoda'].includes(x.id)).map(x => x.id + '=' + x.label);
    out.textContent = JSON.stringify({
      tarjetas_que_estaban_en_comida: movidas,
      carpetas_antes: carpetas.length, carpetas_despues: c2.length,
      etiquetas, moda, comida,
      esquema: ls2.getItem('trickvault_folders_schema'),
    }, null, 1);
    document.title = 'moda=' + moda + ' comida=' + comida + ' carpetas=' + c2.length
      + ' etiquetas=' + etiquetas.join(',');
  } catch (e) { out.textContent = 'ERROR ' + (e && e.message || e); document.title = 'ERROR'; }
})();
</script>
</body></html>
