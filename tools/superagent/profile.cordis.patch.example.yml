# Configuración de máquina del perfil `superagent` (DSH).
# Copiar a %USERPROFILE%\.dsh\profiles\superagent\cordis.patch.yml y revisar las rutas.
# El perfil se crea antes con: dsh superagent --from-default-profile web --dump-config
# Referencia: docs/006-deployment.md del plugin. Guía: tools/superagent/INSTALAR.md
- id: webserver
  config:
    host: 127.0.0.1
    port: 3082
- id: dsh-superagent
  config:
    # OJO: el esquema del plugin exige que stateDir empiece por "/" (regex ^\/).
    # Una ruta `C:\...` se rechaza y el plugin no activa. En Windows, "/Users/..." se
    # resuelve contra la UNIDAD DEL DIRECTORIO DE TRABAJO: por eso hay que arrancar
    # siempre con `cd /d C:\` (queda C:\Users\atnoj\.dsh\state\superagent).
    # Ahí viven base de datos, lock, shims (worker-bin), config git del agente y tickets.
    # Fuera del repo público y con copia de seguridad antes de actualizar.
    stateDir: /Users/atnoj/.dsh/state/superagent
    # Límites opcionales: el panel los edita en Settings → Deployment y aplican sin reinicio.
    # Son valores de partida, no los predeterminados del plugin.
    # promptMaxChars: 40000
    # admissionContextMaxPages: 3
    # admissionContextTimeoutMs: 60000
# Feishu es opcional: descomentar solo si hay bot y lark-cli propio del bot.
# - id: dsh-superagent-feishu
#   disabled: false
