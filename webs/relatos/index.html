<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Biblioteca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Electrolize&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand" onclick="location.hash=''">
        <span>Biblioteca<span class="dot">.</span></span>
        <small>colección privada</small>
      </div>
      <div class="header-search">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="search" placeholder="Buscar por título, tema, personaje…" autocomplete="off" aria-label="Buscar relatos">
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema" title="Cambiar tema">🌙</button>
    </div>
  </header>

  <main class="wrap">
    <!-- HOME -->
    <section class="view active" id="view-home">
      <div class="hero">
        <h1>Tu colección de <span class="accent">relatos</span></h1>
        <p>Historias privadas, organizadas por categorías. Elige un tema y disfruta.</p>
        <div class="hero-stats">
          <div><b id="stat-relatos">0</b> relatos</div>
          <div><b id="stat-cats">0</b> categorías</div>
        </div>
      </div>

      <div class="section-title">
        <h2>Últimos añadidos</h2>
        <div class="line"></div>
      </div>
      <div class="story-grid" id="recentGrid"></div>

      <div class="section-title">
        <h2>Categorías</h2>
        <div class="line"></div>
      </div>
      <div class="cat-grid" id="catGrid"></div>
    </section>

    <!-- CATEGORY / LISTING -->
    <section class="view" id="view-list">
      <div class="section-title">
        <h2 id="listTitle">Categoría</h2>
        <div class="line"></div>
        <div class="count" id="listCount"></div>
      </div>
      <div class="filters" id="listFilters"></div>
      <div class="story-grid" id="listGrid"></div>
    </section>

    <!-- READER -->
    <section class="view" id="view-reader">
      <div class="reader">
        <div class="reader-back" onclick="history.back()">← Volver</div>
        <div id="readerContent"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">Colección privada · uso personal</div>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
