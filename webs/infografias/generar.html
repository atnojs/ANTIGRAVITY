<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar Infografía</title>
    <script src="https://cdn.tailwindcss.com/3.4.4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="icon" href="/Páginas/No_textil/Botellas/logo.ico?v=1" type="image/x-icon">
    <link rel="shortcut" href="/Páginas/No_textil/Botellas/logo.ico?v=1" type="image/x-icon">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#FF6B6B',
                        secondary: '#4ECDC4',
                        darkBg: '#0f172a',
                        darkText: '#e5e7eb'
                    },
                    borderRadius: { 
                        'button': '14px' 
                    },
                    fontFamily: {
                        'pacifico': ['Pacifico', 'cursive'],
                        'montserrat': ['Montserrat', 'sans-serif'],
                        'poppins': ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
    /* === TEMA "GLASS + GRADIENT" === */
    :root{
      --bg1:#0f172a;
      --bg2:#1e293b;
      --acc:#22d3ee;
      --acc2:#a78bfa;
      --text:#e5e7eb;
      --muted:#94a3b8;
      --card: rgba(11, 16, 34, 0.2);
      --border:#1f2a44;
    }

    html,body{height:100%}
    body{
      margin:0;
      font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,"Noto Sans",sans-serif;
      color:var(--text);
      background:
        radial-gradient(1100px 700px at 20% 10%, var(--acc2) 0%, transparent 60%),
        radial-gradient(900px 600px at 85% 100%, var(--acc) 0%, transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      overflow-x:hidden;
      min-height: 100vh;
    }

    .sticky-header{
      background: var(--card) !important;
      border-bottom:1px solid var(--border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow:0 10px 30px rgba(0,0,0,.25);
    }
    .sticky-header a{ color:#cbd5e1; }
    .sticky-header a:hover{ color:#ffffff; }

    .bg-primary, #generate-button{
      background:linear-gradient(135deg,var(--acc),var(--acc2)) !important;
      box-shadow:0 10px 20px rgba(34,211,238,.25), 0 6px 14px rgba(167,139,250,.18);
      transition:transform .12s ease, box-shadow .12s ease;
    }
    .bg-primary:hover, #generate-button:hover { transform:translateY(-1px); }
    .bg-secondary, #back-button{
      background:linear-gradient(135deg,var(--acc2),var(--acc)) !important;
      box-shadow:0 10px 20px rgba(167,139,250,.25), 0 6px 14px rgba(34,211,238,.18);
      transition:transform .12s ease, box-shadow .12s ease;
    }
    .bg-secondary:hover, #back-button:hover { transform:translateY(-1px); }

    .section-card{
      position:relative;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:24px;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      margin:40px auto;
      width:clamp(280px, 96%, 800px);
      padding: 2rem;
    }

    input, textarea{
      background:rgba(2,6,23,.55) !important;
      border:1px solid #334155 !important;
      color:#e5e7eb !important;
      border-radius:12px !important;
    }
    input::placeholder{ color:#94a3b8 !important; }
    input:focus, textarea:focus{
      outline:none; border-color: var(--acc2) !important;
      box-shadow:0 0 0 3px rgba(167,139,250,.25) !important;
    }

    .style-preview {
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(0,0,0,.3);
    }
    .style-preview::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, var(--acc2), var(--acc));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      z-index: 2;
      pointer-events: none;
    }

    #loading-spinner {
      border: 3px solid rgba(255,255,255,.1);
      border-top: 3px solid var(--acc);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #result-image {
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
      cursor: pointer;
      transition: transform .15s;
    }
    #result-image:hover {
      transform: scale(1.02);
    }

    .download-btn {
      background: linear-gradient(135deg, #10b981, #059669) !important;
      box-shadow: 0 8px 16px rgba(16,185,129,.3);
    }
    </style>
</head>
<body>
    <div class="sticky top-0 z-50 w-full sticky-header text-center py-4">
        <h1 class="text-4xl md:text-5xl font-pacifico text-white">Estilos de Infografías</h1>
    </div>

    <main class="px-4">
        <!-- Loading state -->
        <div id="loading-state" class="section-card text-center py-12">
            <div id="loading-spinner" class="mx-auto mb-4"></div>
            <p class="text-gray-400">Cargando estilo...</p>
        </div>

        <!-- Error state -->
        <div id="error-state" class="section-card text-center py-12 hidden">
            <i class="ri-error-warning-line text-5xl text-red-400 mb-4 block"></i>
            <h2 id="error-message" class="text-xl font-bold mb-4">Estilo no encontrado</h2>
            <p class="text-gray-400 mb-6">No se pudo cargar el estilo de infografía solicitado.</p>
            <a href="index.html" class="bg-secondary text-white px-6 py-3 rounded-button font-medium inline-block">← Volver a Estilos</a>
        </div>

        <!-- Main content -->
        <div id="main-content" class="section-card hidden">
            <a href="index.html" class="inline-flex items-center gap-1 text-gray-400 hover:text-white transition-colors text-sm mb-4">
                <i class="ri-arrow-left-line"></i> Volver
            </a>

            <!-- Style preview image -->
            <div class="style-preview mb-8 max-w-sm mx-auto">
                <img id="style-preview-img" src="" alt="Vista previa del estilo" class="w-full h-auto block object-contain" style="max-height:250px;">
            </div>

            <!-- Input section -->
            <div class="max-w-md mx-auto">
                <label for="topic-input" class="block text-sm font-medium text-gray-300 mb-2">
                    ¿Sobre qué tema quieres la infografía?
                </label>
                <input type="text" id="topic-input" 
                       placeholder="Ej: Cambio climático, Marketing digital, Historia del arte..." 
                       class="w-full px-4 py-3 text-lg rounded-xl mb-6"
                       autocomplete="off">

                <button id="generate-button" 
                        class="w-full text-white px-6 py-4 rounded-button font-bold text-lg shadow-md flex items-center justify-center gap-2">
                    <i class="ri-magic-line ri-lg"></i> Generar Infografía
                </button>
            </div>

            <!-- Result section -->
            <div id="result-section" class="hidden mt-8 pt-8 border-t border-gray-700/50">
                <div id="loading-result" class="text-center py-8 hidden">
                    <div id="loading-spinner" class="mx-auto mb-4"></div>
                    <p class="text-gray-400">Generando infografía con IA...</p>
                    <p class="text-xs text-gray-500 mt-2">Esto puede tardar hasta 60 segundos</p>
                </div>
                
                <div id="result-content" class="hidden">
                    <h3 class="text-lg font-bold text-center mb-4">✨ Infografía Generada</h3>
                    <div class="max-w-3xl mx-auto">
                        <img id="result-image" src="" alt="Infografía generada" class="w-full h-auto">
                    </div>
                    <div class="flex justify-center gap-3 mt-3">
                        <a id="download-button" href="#" download="infografia.png" 
                           class="download-btn text-white px-6 py-3 rounded-button font-medium flex items-center gap-2">
                            <i class="ri-download-line"></i> Descargar
                        </a>
                    </div>
                </div>

                <div id="result-error" class="hidden text-center py-8">
                    <i class="ri-close-circle-line text-5xl text-red-400 mb-4 block"></i>
                    <p id="result-error-message" class="text-red-300 mb-4"></p>
                    <button id="retry-button"
                            class="bg-secondary text-white px-6 py-3 rounded-button font-medium">
                        Intentar de nuevo
                    </button>
                </div>
            </div>

            <!-- Botones de acción (siempre visibles) -->
            <div class="flex justify-center gap-3 mt-6 pt-6 border-t border-gray-700/50">
                <button id="btn-nueva" class="bg-secondary text-white px-5 py-2 rounded-button font-medium flex items-center gap-2">
                    <i class="ri-refresh-line"></i> Nueva Infografía
                </button>
            </div>
        </div>
    </main>

    <div id="status-message" class="fixed top-5 left-1/2 -translate-x-1/2 px-6 py-3 rounded-lg text-white font-semibold z-[110] shadow-md hidden transition-opacity duration-300"></div>

    <!-- Lightbox for generated infographic -->
    <div id="lightbox-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-[200] flex items-center justify-center p-4 transition-opacity duration-300">
        <div class="relative rounded-3xl shadow-2xl" style="background:var(--card); border:1px solid var(--border);">
            <img id="lightbox-image" src="" alt="Infografía ampliada" class="max-w-[95vw] md:max-w-[85vw] max-h-[90vh] object-contain block rounded-2xl p-1">
        </div>
        <button id="lightbox-close" class="absolute top-4 right-4 text-white text-5xl leading-none z-[210] hover:opacity-80 transition-opacity">&times;</button>
    </div>

    <script>
        (function() {
            // --- DOM refs ---
            const loadingState = document.getElementById('loading-state');
            const errorState = document.getElementById('error-state');
            const errorMessage = document.getElementById('error-message');
            const mainContent = document.getElementById('main-content');
            const stylePreviewImg = document.getElementById('style-preview-img');
            const topicInput = document.getElementById('topic-input');
            const generateButton = document.getElementById('generate-button');
            const resultSection = document.getElementById('result-section');
            const loadingResult = document.getElementById('loading-result');
            const resultContent = document.getElementById('result-content');
            const resultImage = document.getElementById('result-image');
            const resultError = document.getElementById('result-error');
            const resultErrorMessage = document.getElementById('result-error-message');
            const downloadButton = document.getElementById('download-button');
            const statusMessage = document.getElementById('status-message');

            const PROXY_URL = 'proxy.php';
            const LOAD_URL = 'load_gallery.php';
            let styleData = null;
            let styleId = null;

            function showStatus(message, isError = false, duration = 4000) {
                statusMessage.textContent = message;
                statusMessage.classList.remove('hidden', 'bg-green-500', 'bg-red-500', 'opacity-0');
                statusMessage.classList.add(isError ? 'bg-red-500' : 'bg-green-500');
                setTimeout(() => {
                    statusMessage.classList.add('opacity-0');
                    setTimeout(() => statusMessage.classList.add('hidden'), 300);
                }, duration);
            }

            // Get style ID from URL
            const params = new URLSearchParams(window.location.search);
            styleId = params.get('id');

            if (!styleId) {
                showError('No se especificó un estilo de infografía.');
                return;
            }

            // Load style data
            async function loadStyle() {
                try {
                    const res = await fetch(`${LOAD_URL}?t=${Date.now()}`, { cache: 'no-store' });
                    if (!res.ok) throw new Error('Error del servidor');
                    const txt = await res.text();
                    if (!txt.trim() || txt === '{}') throw new Error('No hay estilos disponibles');
                    
                    const data = JSON.parse(txt);
                    
                    // Find matching style
                    if (!data[styleId]) {
                        throw new Error('El estilo solicitado no existe.');
                    }

                    styleData = {
                        id: styleId,
                        imageSrc: data[styleId] || '',
                        fit: data[`${styleId}-fit`] || 'contain',
                        name: data[`${styleId}-text`] || 'Estilo de Infografía',
                        prompt: data[`${styleId}-prompt`] || 'Crea una infografía profesional sobre [tema] con diseño atractivo.'
                    };

                    // Render
                    loadingState.classList.add('hidden');
                    mainContent.classList.remove('hidden');
                    stylePreviewImg.src = styleData.imageSrc || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="250"><rect width="400" height="250" fill="%231e293b"/><text x="200" y="125" text-anchor="middle" fill="%2394a3b8" font-size="18">Sin vista previa</text></svg>';
                    
                    // Focus input
                    setTimeout(() => topicInput.focus(), 300);
                } catch (e) {
                    showError(e.message);
                }
            }

            function showError(msg) {
                loadingState.classList.add('hidden');
                errorState.classList.remove('hidden');
                errorMessage.textContent = msg;
            }

            // Generate infographic
            async function generateInfographic() {
                const topic = topicInput.value.trim();
                if (!topic) {
                    showStatus('Por favor, escribe un tema para la infografía.', true);
                    topicInput.focus();
                    return;
                }

                if (!styleData || !styleData.prompt) {
                    showStatus('Error: no hay prompt configurado para este estilo.', true);
                    return;
                }

                // Build the final prompt — reemplaza cualquier placeholder entre corchetes
                const finalPrompt = styleData.prompt.replace(/\[.*?\]/g, topic);
                
                // Show result section with loading
                resultSection.classList.remove('hidden');
                resultContent.classList.add('hidden');
                resultError.classList.add('hidden');
                loadingResult.classList.remove('hidden');
                generateButton.disabled = true;
                generateButton.innerHTML = '<i class="ri-loader-4-line ri-lg animate-spin"></i> Generando...';

                try {
                    const res = await fetch(PROXY_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: finalPrompt })
                    });

                    if (!res.ok) {
                        const errData = await res.json().catch(() => ({}));
                        const errMsg = typeof errData.error === 'object' 
                            ? (errData.error.message || JSON.stringify(errData.error))
                            : (errData.error || `Error HTTP ${res.status}`);
                        throw new Error(errMsg);
                    }

                    const geminiResponse = await res.json();
                    
                    // Parse Gemini response to extract image
                    let imageBase64 = null;
                    let imageMime = 'image/png';

                    if (geminiResponse.candidates && geminiResponse.candidates.length > 0) {
                        const parts = geminiResponse.candidates[0].content?.parts || [];
                        for (const part of parts) {
                            if (part.inlineData && part.inlineData.data) {
                                imageBase64 = part.inlineData.data;
                                imageMime = part.inlineData.mimeType || 'image/png';
                                break;
                            }
                        }
                    }

                    if (!imageBase64) {
                        throw new Error('La API no devolvió una imagen. Intenta con otro tema o estilo.');
                    }

                    // Display result
                    const dataUrl = `data:${imageMime};base64,${imageBase64}`;
                    resultImage.src = dataUrl;
                    downloadButton.href = dataUrl;
                    downloadButton.download = `infografia-${topic.replace(/\s+/g, '-').toLowerCase()}.png`;
                    
                    loadingResult.classList.add('hidden');
                    resultContent.classList.remove('hidden');
                    showStatus('¡Infografía generada con éxito!');
                } catch (e) {
                    loadingResult.classList.add('hidden');
                    resultError.classList.remove('hidden');
                    const msg = typeof e.message === 'string' ? e.message : String(e);
                    resultErrorMessage.textContent = msg || 'Error al generar la infografía.';
                    showStatus('Error al generar: ' + msg, true);
                } finally {
                    generateButton.disabled = false;
                    generateButton.innerHTML = '<i class="ri-magic-line ri-lg"></i> Generar Infografía';
                }
            }

            // Event listeners
            generateButton.addEventListener('click', generateInfographic);
            topicInput.addEventListener('keydown', e => {
                if (e.key === 'Enter') generateInfographic();
            });

            document.getElementById('retry-button')?.addEventListener('click', () => {
                resultSection.classList.add('hidden');
                generateInfographic();
            });

            // Event listener for Nueva Infografía button
            document.getElementById('btn-nueva').addEventListener('click', () => {
                resultSection.classList.add('hidden');
                topicInput.value = '';
                topicInput.focus();
            });

            // Load style on page load
            loadStyle();

            // --- LIGHTBOX (delegated click) ---
            const lightboxModal = document.getElementById('lightbox-modal');
            const lightboxImage = document.getElementById('lightbox-image');
            const lightboxClose = document.getElementById('lightbox-close');

            document.addEventListener('click', (e) => {
                const img = e.target.closest('#result-image');
                if (!img) return;
                const src = img.getAttribute('src');
                if (src && src.startsWith('data:')) {
                    e.preventDefault();
                    e.stopPropagation();
                    lightboxImage.src = src;
                    lightboxModal.classList.remove('hidden');
                    document.body.style.overflow = 'hidden';
                }
            });

            function closeLightbox() {
                lightboxModal.classList.add('hidden');
                lightboxImage.src = '';
                document.body.style.overflow = '';
            }

            lightboxClose.addEventListener('click', (e) => {
                e.stopPropagation();
                closeLightbox();
            });

            lightboxModal.addEventListener('click', (e) => {
                if (e.target === lightboxModal) closeLightbox();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !lightboxModal.classList.contains('hidden')) {
                    closeLightbox();
                }
            });
        })();
    </script>
</body>
</html>
