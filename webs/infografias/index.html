<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilos de Infografía</title>
    <script src="https://cdn.tailwindcss.com/3.4.4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Audiowide&family=Bangers&family=Bebas+Neue&family=Bungee&family=Caveat&family=Cinzel&family=Cormorant+Garamond&family=Creepster&family=Dancing+Script&family=Eater&family=Josefin+Sans&family=Lobster&family=Monoton&family=Nosifer&family=Oswald&family=Permanent+Marker&family=Playfair+Display&family=Roboto:wght@900&family=Rock+Salt&family=Sacramento&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="icon" href="/Páginas/No_textil/Botellas/logo.ico?v=1" type="image/x-icon">
    <link rel="shortcut" href="/Páginas/No_textil/Botellas/logo.ico?v=1" type="image/x-icon">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#FF6B6B',
                        secondary: '#4ECDC4',
                        darkBg: '#0f172a',
                        darkText: '#e5e7eb'
                    },
                    borderRadius: { 
                        'button': '14px' 
                    },
                    fontFamily: {
                        'pacifico': ['Pacifico', 'cursive'],
                        'montserrat': ['Montserrat', 'sans-serif'],
                        'poppins': ['Poppins', 'sans-serif'],
                        'inter': ['Inter', 'sans-serif'],
                        'rubik-doodle-shadow': ['"Rubik Doodle Shadow"', 'cursive'],
                        'open-sans': ['"Open Sans"', 'sans-serif'],
                        'roboto': ['Roboto', 'sans-serif'],
                        'merriweather': ['Merriweather', 'serif'],
                        'orbitron': ['Orbitron', 'sans-serif'],
                        'lato': ['Lato', 'sans-serif'],
                        'nunito': ['Nunito', 'sans-serif'],
                        'dancing-script': ['"Dancing Script"', 'cursive'],
                        'great-vibes': ['"Great Vibes"', 'cursive'],
                    }
                }
            }
        }
    </script>

    <style>
    /* === TEMA "GLASS + GRADIENT" === */
    :root{
      --bg1:#0f172a;        /* slate-900 */
      --bg2:#1e293b;        /* slate-800 */
      --acc:#22d3ee;        /* cyan-400 */
      --acc2:#a78bfa;       /* violet-400 */
      --text:#e5e7eb;       /* gray-200 */
      --muted:#94a3b8;      /* slate-400 */
      --card: rgba(11, 16, 34, 0.2); /* glass card */
      --border:#1f2a44;     /* card border */
    }

    html,body{height:100%}
    body{
      margin:0;
      font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,"Noto Sans",sans-serif;
      color:var(--text);
      background:
        radial-gradient(1100px 700px at 20% 10%, var(--acc2) 0%, transparent 60%),
        radial-gradient(900px 600px at 85% 100%, var(--acc) 0%, transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      overflow-x:hidden;
    }
    
    h1,h2,h3,h4,h5,h6{ font-family:'Montserrat',sans-serif; }

    /* Cabecera pegajosa en vidrio */
    .sticky-header{
      background: var(--card) !important;
      border-bottom:1px solid var(--border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow:0 10px 30px rgba(0,0,0,.25);
    }
    .sticky-header a{ color:#cbd5e1; }
    .sticky-header a:hover{ color:#ffffff; }

    /* Botones con gradiente del tema */
    .bg-primary, #apply-style-btn{
      background:linear-gradient(135deg,var(--acc),var(--acc2)) !important;
      box-shadow:0 10px 20px rgba(34,211,238,.25), 0 6px 14px rgba(167,139,250,.18);
      transition:transform .12s ease, box-shadow .12s ease;
    }
    .bg-primary:hover, #apply-style-btn:hover { transform:translateY(-1px); }
    .bg-secondary, #add-image-button, #save-button{
      background:linear-gradient(135deg,var(--acc2),var(--acc)) !important;
      box-shadow:0 10px 20px rgba(167,139,250,.25), 0 6px 14px rgba(34,211,238,.18);
      transition:transform .12s ease, box-shadow .12s ease;
    }
    .bg-secondary:hover, #add-image-button:hover, #save-button:hover { transform:translateY(-1px); }

    /* Secciones como "tarjetas" de vidrio */
    .section-card{
      position:relative;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:24px;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      margin:40px auto;
      width:clamp(280px, 96%, 1300px);
      padding: 2rem;
    }
    
    /* Estilo para los items de la galería */
    .gallery-item {
      position: relative;
      background: rgba(15, 23, 42, 0.8) !important; 
      border-radius: 30px !important;
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.35);
      padding: 1rem;
      z-index: 1;
      overflow: hidden;
      border: none;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .gallery-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.45);
    }

    /* Borde gradiente redondeado */
    .gallery-item::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, var(--acc2), var(--acc));
      -webkit-mask:
         linear-gradient(#fff 0 0) content-box, 
         linear-gradient(#fff 0 0);
      mask: 
         linear-gradient(#fff 0 0) content-box, 
         linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      z-index: -1;
    }

    /* Lightbox */
    #lightbox-modal > div {
        position: relative;
        overflow: hidden;
        z-index: 1;
        border: none;
    }
    #lightbox-modal > div::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(135deg, var(--acc2), var(--acc));
        -webkit-mask:
           linear-gradient(#fff 0 0) content-box, 
           linear-gradient(#fff 0 0);
        mask:
           linear-gradient(#fff 0 0) content-box, 
           linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        z-index: -1;
    }

    /* Inputs/Selects en vidrio */
    input:not([type="checkbox"]), select, textarea{
      background:rgba(2,6,23,.55) !important;
      border:1px solid #334155 !important;
      color:#e5e7eb !important;
      border-radius:12px !important;
    }
    input::placeholder, textarea::placeholder{ color:#94a3b8 !important; }
    input:focus, select:focus, textarea:focus{
      outline:none; border-color: var(--acc2) !important;
      box-shadow:0 0 0 3px rgba(167,139,250,.25) !important;
    }
    
    /* Estilos del editor */
    .edit-mode .editable-content, .edit-mode .editable-text {
        outline: 2px dashed var(--acc);
        background: rgba(34,211,238,.08);
        cursor: text;
        border-radius: 4px;
    }
    .image-item.dragging {
        opacity: 0.5;
        transform: scale(0.98);
    }
    .edit-mode .editable-image-container:has(img[src=""])::before,
    .edit-mode .editable-image-container:has(img:not([src]))::before,
    .edit-mode .editable-image-container:has(img[src*="data:image/svg+xml"])::before {
        content: "Añadir Imagen";
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        display: flex;
        align-items: center; justify-content: center;
        background: rgba(15,23,42,.6); color: var(--muted);
        font-size: .9rem; font-weight: 500;
        border: 2px dashed var(--border);
        border-radius: inherit; z-index: 5;
    }
    .edit-mode .editable-text-wrapper:hover .edit-style-btn,
    .edit-mode .editable-content-wrapper:hover .edit-style-btn {
        display: flex;
    }
    .edit-mode .editable-image-container:hover .image-edit-controls {
        display: flex;
    }

    /* Prompt template field - hidden by default, shown in edit mode */
    .prompt-template-field {
        display: none;
        margin-top: 0.5rem;
    }
    .edit-mode .prompt-template-field {
        display: block;
    }
    .prompt-template-field textarea {
        width: 100%;
        min-height: 60px;
        font-size: 0.8rem;
        resize: vertical;
    }

    /* Badge de "clic para generar" en vista normal */
    .generate-badge {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        background: linear-gradient(135deg, var(--acc), var(--acc2));
        color: white;
        font-size: 0.7rem;
        font-weight: 600;
        padding: 0.25rem 0.6rem;
        border-radius: 20px;
        z-index: 5;
        opacity: 0;
        transition: opacity .2s;
        pointer-events: none;
    }
    .gallery-item:hover .generate-badge {
        opacity: 1;
    }
    .edit-mode .generate-badge {
        display: none;
    }
    .edit-mode .ampliar-btn {
        display: none !important;
    }
    </style>
</head>
<body>
    <div class="sticky top-0 z-50 w-full sticky-header text-center py-4">
        <h1 class="text-4xl md:text-5xl font-pacifico text-white">Estilos de Infografías</h1>
    </div>

    <button id="edit-mode-button" title="Activar/Desactivar Modo Edición" class="fixed bottom-5 right-5 w-12 h-12 bg-white/10 hover:bg-white/20 backdrop-blur-sm border border-white/20 text-white rounded-full flex items-center justify-center z-[100] text-xl transition-all transform hover:scale-110 shadow-lg">
        <i class="ri-pencil-line"></i>
    </button>
    <input type="file" id="hidden-file-input" class="hidden" accept="image/*">
    
    <main>
        <section class="section-card">
            <div id="image-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8"></div>
        </section>
    </main>

    <div id="edit-controls" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[100] p-3 rounded-xl shadow-lg flex-wrap gap-2 justify-center hidden" style="background:var(--card); border:1px solid var(--border); backdrop-filter:blur(8px);">
        <button id="add-image-button" class="text-white px-4 py-2 rounded-button font-medium shadow-md">Añadir Estilo</button>
        <button id="save-button" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-button font-medium shadow-md">Guardar Cambios</button>
    </div>

    <div id="status-message" class="fixed top-5 left-1/2 -translate-x-1/2 px-6 py-3 rounded-lg text-white font-semibold z-[110] shadow-md hidden transition-opacity duration-300"></div>

    <div id="style-editor-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[105] flex items-center justify-center p-4">
        <div class="p-6 rounded-lg shadow-xl w-full max-w-md m-4" style="background:var(--card); border:1px solid var(--border);">
            <h3 class="text-xl font-bold mb-6 text-center">Editar Estilo de Texto</h3>
            <input type="hidden" id="target-element-id">
            <div class="space-y-4">
                <div>
                    <label for="font-family-select" class="block text-sm font-medium text-gray-300 mb-1">Fuente</label>
                    <select id="font-family-select" class="w-full rounded-md px-3 py-2"></select>
                </div>
                <div>
                    <label for="font-size-input" class="block text-sm font-medium text-gray-300 mb-1">Tamaño (ej: 16px, 1.2rem)</label>
                    <input type="text" id="font-size-input" placeholder="Tamaño de fuente" class="w-full rounded-md px-3 py-2">
                </div>
                <div>
                    <label for="font-color-input" class="block text-sm font-medium text-gray-300 mb-1">Color (ej: #FF6B6B, red)</label>
                    <input type="text" id="font-color-input" placeholder="Color de fuente" class="w-full rounded-md px-3 py-2">
                </div>
                <div>
                    <label for="text-align-select" class="block text-sm font-medium text-gray-300 mb-1">Alineación</label>
                    <select id="text-align-select" class="w-full rounded-md px-3 py-2">
                        <option value="left">Izquierda</option>
                        <option value="center">Centro</option>
                        <option value="right">Derecha</option>
                        <option value="justify">Justificado</option>
                    </select>
                </div>
            </div>
            
            <div class="flex justify-end gap-4 mt-8">
                <button id="cancel-style-btn" class="px-5 py-2 rounded-button bg-gray-600 text-gray-200 font-semibold hover:bg-gray-500 transition">Cancelar</button>
                <button id="apply-style-btn" class="px-5 py-2 rounded-button text-white font-semibold transition">Aplicar</button>
            </div>
        </div>
    </div>

    <div id="lightbox-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[200] flex items-center justify-center p-4 transition-opacity duration-300">
        <div class="relative p-2 rounded-3xl shadow-2xl" style="background:var(--card);">
            <img id="lightbox-image" src="" alt="Vista ampliada" class="max-w-[90vw] md:max-w-[60vw] max-h-[85vh] object-contain block rounded-2xl">
        </div>
        <button id="lightbox-close" class="absolute top-4 right-4 text-white text-5xl leading-none z-[210] hover:opacity-80 transition-opacity">&times;</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // --- DARK THEME ---
            document.body.classList.add('dark');


            // --- GALLERY EDITOR ---
            const body = document.body,
                editModeButton = document.getElementById('edit-mode-button'),
                saveButton = document.getElementById('save-button'),
                addImageButton = document.getElementById('add-image-button'),
                editControls = document.getElementById('edit-controls'),
                statusMessage = document.getElementById('status-message'),
                mainContent = document.querySelector('main'),
                imageGrid = document.getElementById('image-grid'),
                hiddenFileInput = document.getElementById('hidden-file-input'),
                styleEditorModal = document.getElementById('style-editor-modal'),
                fontFamilySelect = document.getElementById('font-family-select'),
                fontSizeInput = document.getElementById('font-size-input'),
                fontColorInput = document.getElementById('font-color-input'),
                textAlignSelect = document.getElementById('text-align-select'),
                targetElementIdInput = document.getElementById('target-element-id'),
                applyStyleButton = document.getElementById('apply-style-btn'),
                cancelStyleButton = document.getElementById('cancel-style-btn');

            const VALIDATE_PASS_URL = 'validar_password.php',
                LOAD_CONTENT_URL = 'load_gallery.php',
                SAVE_CONTENT_URL = 'save_gallery.php';
            let isEditMode = false,
                currentTargetImageId = null,
                hasUnsavedChanges = false,
                savedSelectionRange = null;
            
            const availableFonts = {
                'Inter': "'Inter', sans-serif",
                'Rubik Doodle Shadow': "'Rubik Doodle Shadow', cursive",
                'Open Sans': "'Open Sans', sans-serif",
                'Roboto': "'Roboto', sans-serif",
                'Merriweather': "'Merriweather', serif",
                'Montserrat': "'Montserrat', sans-serif",
                'Orbitron': "'Orbitron', sans-serif",
                'Lato': "'Lato', sans-serif",
                'Poppins': "'Poppins', sans-serif",
                'Nunito': "'Nunito', sans-serif",
                'Dancing Script': "'Dancing Script', cursive",
                'Pacifico': "'Pacifico', cursive",
                'Great Vibes': "'Great Vibes', cursive",
            };

            const PLACEHOLDER_ERROR_URL = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="rgba(239,68,68,0.5)"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"></path></svg>';
            
            function showStatus(message, isError = false, duration = 4000) {
                statusMessage.textContent = message;
                statusMessage.classList.remove('hidden', 'bg-green-500', 'bg-red-500', 'opacity-0');
                statusMessage.classList.add(isError ? 'bg-red-500' : 'bg-green-500');
                setTimeout(() => {
                    statusMessage.classList.add('opacity-0');
                    setTimeout(() => statusMessage.classList.add('hidden'), 300);
                }, duration);
            }

            async function checkPassword(input) {
                try {
                    const res = await fetch(`${VALIDATE_PASS_URL}?t=${Date.now()}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                            'Cache-Control': 'no-cache'
                        },
                        body: new URLSearchParams({ 'password': input })
                    });
                    if (!res.ok) throw new Error(res.status);
                    return (await res.json()).success === true;
                } catch (e) {
                    showStatus('Error al contactar servidor: ' + e.message, true);
                    return false;
                }
            }

            function createAndAppendImageBlock(id, src = '', fit = 'contain', alt = 'Estilo de infografía', link = '', textContent = '', promptTemplate = '') {
                const itemWrapper = document.createElement('div');
                itemWrapper.className = 'image-item gallery-item flex flex-col gap-2';
                itemWrapper.dataset.id = id;
                itemWrapper.dataset.prompt = promptTemplate;

                // Generate badge for view mode
                const badge = document.createElement('div');
                badge.className = 'generate-badge';
                badge.textContent = 'Generar →';

                // Text wrapper
                const textWrapper = document.createElement('div');
                textWrapper.className = 'editable-text-wrapper relative text-center';

                const textElement = document.createElement('div');
                textElement.id = `${id}-text`;
                textElement.className = 'editable-text px-1 py-0.5 font-semibold text-gray-200';
                textElement.innerHTML = textContent || 'Nuevo Estilo';

                const styleButton = document.createElement('button');
                styleButton.className = 'edit-style-btn hidden absolute -top-1 -right-1 bg-amber-400 text-amber-900 w-6 h-6 rounded-full items-center justify-center text-sm shadow-md z-10 hover:scale-110 transition-transform';
                styleButton.dataset.targetElement = `${id}-text`;
                styleButton.title = 'Editar Estilo Texto';
                styleButton.innerHTML = '🎨';
                
                textWrapper.appendChild(textElement);
                textWrapper.appendChild(styleButton);
                
                // Image container
                const container = document.createElement('div');
                container.className = 'editable-image-container group relative aspect-square rounded-3xl overflow-hidden';
                
                const img = document.createElement('img');
                img.id = id;
                img.alt = alt;
                img.className = 'w-full h-full block object-cover rounded-2xl';
                img.style.objectFit = fit;
                img.dataset.imageLink = link;
                img.loading = 'lazy';
                
                img.onerror = () => {
                    img.onerror = null;
                    img.src = PLACEHOLDER_ERROR_URL;
                };
                img.src = src;
                
                // Edit controls (only in edit mode)
                const controls = document.createElement('div');
                controls.className = 'image-edit-controls absolute bottom-0 left-0 right-0 bg-black/70 p-1.5 flex-wrap gap-1 justify-center hidden opacity-0 group-hover:opacity-100 transition-opacity z-10';
                controls.innerHTML = `
                    <button class="image-edit-button text-xs bg-gray-600 hover:bg-gray-500 text-white font-bold py-1 px-2 rounded" data-action="url" title="Cambiar URL">URL</button>
                    <button class="image-edit-button text-xs bg-gray-600 hover:bg-gray-500 text-white font-bold py-1 px-2 rounded" data-action="upload" title="Subir desde PC">Subir PC</button>
                    <button class="image-edit-button text-xs bg-gray-600 hover:bg-gray-500 text-white font-bold py-1 px-2 rounded" data-action="fit" title="Ajustar (Contain)">Ajustar</button>
                    <button class="image-edit-button text-xs bg-gray-600 hover:bg-gray-500 text-white font-bold py-1 px-2 rounded" data-action="cover" title="Cubrir (Cover)">Cubrir</button>
                    <button class="image-edit-button text-xs link-btn bg-gray-600 hover:bg-gray-500 text-white font-bold py-1 px-2 rounded ${link ? 'has-link' : ''}" data-action="link" title="Enlazar imagen">Enlace</button>
                    <button class="image-edit-button text-xs delete-btn bg-red-500 hover:bg-red-600 text-white font-bold py-1 px-2 rounded" data-action="delete" title="Eliminar">Eliminar</button>
                `;

                // Ampliar button (only in view mode)
                const ampliarBtn = document.createElement('button');
                ampliarBtn.className = 'ampliar-btn absolute bottom-2 right-2 bg-white/20 hover:bg-white/40 backdrop-blur-sm text-white px-3 py-1.5 rounded-full text-xs font-semibold items-center gap-1 z-10 transition-all opacity-0 group-hover:opacity-100';
                ampliarBtn.innerHTML = '<i class="ri-zoom-in-line"></i> Ampliar';
                ampliarBtn.title = 'Ver imagen en grande';
                ampliarBtn.onclick = function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    const imgEl = document.getElementById(id);
                    const lb = document.getElementById('lightbox-modal');
                    const lbImg = document.getElementById('lightbox-image');
                    if (imgEl && lb && lbImg && imgEl.src && !imgEl.src.includes('data:image/svg+xml')) {
                        lbImg.src = imgEl.src;
                        lb.classList.remove('hidden');
                        document.body.style.overflow = 'hidden';
                    }
                };
                
                container.appendChild(img);
                container.appendChild(controls);
                container.appendChild(ampliarBtn);
                container.appendChild(badge);

                // Prompt template field (only in edit mode)
                const promptField = document.createElement('div');
                promptField.className = 'prompt-template-field';
                promptField.innerHTML = `
                    <label class="text-xs text-gray-400 mb-1 block">Prompt Template (usa [tema] como placeholder):</label>
                    <textarea class="prompt-textarea" data-id="${id}" rows="3" placeholder="Ej: Crea una infografía sobre [tema] con estilo corporativo...">${escapeHtml(promptTemplate)}</textarea>
                `;

                itemWrapper.appendChild(textWrapper);
                itemWrapper.appendChild(container);
                itemWrapper.appendChild(promptField);

                return itemWrapper;
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function applyImageLinks() {
                document.querySelectorAll('#image-grid .editable-image-container img[id]').forEach(img => {
                    const url = img.dataset.imageLink;
                    const src = img.getAttribute('src');
                    const isPlaceholder = !src || src === PLACEHOLDER_ERROR_URL;
                    const container = img.closest('.editable-image-container');
                    let anchor = container.querySelector('a');

                    if (url && !isPlaceholder && !isEditMode) {
                        if (!anchor) {
                            anchor = document.createElement('a');
                            anchor.target = '_blank';
                            anchor.rel = 'noopener noreferrer';
                            container.insertBefore(anchor, img);
                            anchor.appendChild(img);
                        }
                        anchor.href = url;
                    } else if (anchor) {
                         container.insertBefore(img, anchor);
                         anchor.remove();
                    }
                    
                    const linkBtn = container.querySelector('.link-btn');
                    if(linkBtn) {
                      linkBtn.classList.toggle('!bg-blue-500', !!url && !isPlaceholder);
                    }
                });
            }

            function handleDeleteImage(id) {
                const item = document.querySelector(`.image-item[data-id="${id}"]`);
                if (item) {
                    item.remove();
                    hasUnsavedChanges = true;
                    showStatus('Elemento eliminado. Guarda los cambios.');
                }
            }

            function handleImageAction(id, action) {
                const img = document.getElementById(id);
                if (!img) return;

                switch(action) {
                    case 'url':
                        const currentUrl = img.src === PLACEHOLDER_ERROR_URL ? '' : img.src;
                        const newUrl = prompt('Introduce la nueva URL de la imagen:', currentUrl);
                        if (newUrl !== null) {
                            img.src = newUrl.trim() || PLACEHOLDER_ERROR_URL;
                            hasUnsavedChanges = true;
                            showStatus('URL actualizada. Guarda los cambios.');
                        }
                        break;
                    case 'upload':
                        currentTargetImageId = id;
                        hiddenFileInput.click();
                        break;
                    case 'fit':
                        img.style.objectFit = 'contain';
                        hasUnsavedChanges = true;
                        showStatus('Ajuste "Contain" aplicado. Guarda los cambios.');
                        break;
                    case 'cover':
                        img.style.objectFit = 'cover';
                        hasUnsavedChanges = true;
                        showStatus('Ajuste "Cover" aplicado. Guarda los cambios.');
                        break;
                    case 'link':
                        const currentLink = img.dataset.imageLink || '';
                        const newLink = prompt('Introduce la URL de destino (dejar vacío para quitar):', currentLink);
                        if (newLink !== null) {
                            img.dataset.imageLink = newLink.trim();
                            hasUnsavedChanges = true;
                            showStatus(newLink.trim() ? 'Enlace actualizado.' : 'Enlace eliminado.');
                            applyImageLinks();
                        }
                        break;
                    case 'delete':
                        handleDeleteImage(id);
                        break;
                }
            }

            function handleFileSelected(e) {
                const file = e.target.files[0];
                if (!file || !file.type.startsWith('image/')) {
                    if (file) showStatus('El archivo debe ser una imagen.', true);
                    return;
                }
                const reader = new FileReader();
                reader.onload = ev => {
                    const result = ev.target.result;
                    if (currentTargetImageId) {
                        const img = document.getElementById(currentTargetImageId);
                        if (img) {
                            img.src = result;
                            hasUnsavedChanges = true;
                            showStatus('Imagen subida. Guarda los cambios.');
                        }
                    }
                    currentTargetImageId = null;
                };
                reader.onerror = () => {
                    showStatus('Error al leer el archivo.', true);
                    currentTargetImageId = null;
                };
                reader.readAsDataURL(file);
            }
            
            function openStyleEditor(id) {
                const el = document.getElementById(id);
                if (!el) { showStatus('Elemento no encontrado.', true); return; }

                savedSelectionRange = null;
                const selection = window.getSelection();
                if (selection && selection.rangeCount > 0 && !selection.isCollapsed) {
                    const range = selection.getRangeAt(0);
                    if (el.contains(range.commonAncestorContainer)) {
                        savedSelectionRange = range.cloneRange();
                    }
                }

                let styleSourceNode = el;
                if (savedSelectionRange) {
                    const container = savedSelectionRange.commonAncestorContainer;
                    styleSourceNode = (container.nodeType === Node.ELEMENT_NODE ? container : container.parentElement);
                }

                targetElementIdInput.value = id;
                const cs = getComputedStyle(styleSourceNode);

                let currentFont = cs.fontFamily.split(',')[0].replace(/['"]/g, '').trim();
                const matchingFont = Object.entries(availableFonts).find(([name, value]) => value.includes(currentFont));
                fontFamilySelect.value = matchingFont ? matchingFont[1] : availableFonts['Inter'];

                fontSizeInput.value = cs.fontSize;
                fontColorInput.value = cs.color;
                textAlignSelect.value = cs.textAlign;
                styleEditorModal.classList.remove('hidden');
            }

            function applyStyles() {
                const id = targetElementIdInput.value;
                const el = document.getElementById(id);
                if (!el) {
                    showStatus('Error al aplicar estilos.', true);
                    styleEditorModal.classList.add('hidden');
                    return;
                }

                if (savedSelectionRange && !savedSelectionRange.collapsed) {
                    const selection = window.getSelection();
                    if (selection) {
                        selection.removeAllRanges();
                        selection.addRange(savedSelectionRange);
                    }
                    
                    const span = document.createElement('span');
                    span.style.fontFamily = fontFamilySelect.value;
                    span.style.fontSize = fontSizeInput.value;
                    span.style.color = fontColorInput.value;
                    
                    try {
                        savedSelectionRange.surroundContents(span);
                    } catch (e) {
                        showStatus("No se pudo aplicar el estilo a una selección compleja.", true);
                    }
                } else {
                    el.style.fontFamily = fontFamilySelect.value;
                    el.style.fontSize = fontSizeInput.value;
                    el.style.color = fontColorInput.value;
                    el.style.textAlign = textAlignSelect.value;
                }

                hasUnsavedChanges = true;
                showStatus('Estilo aplicado. Guarda los cambios.');
                styleEditorModal.classList.add('hidden');
                savedSelectionRange = null;
            }

            function addNewImagePlaceholder() {
                if (!isEditMode) return;
                const id = `image-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`;
                const defaultPrompt = 'Crea una infografía profesional sobre [tema] con un diseño visual atractivo, colores vibrantes, y estructura clara. Incluye datos relevantes y elementos gráficos.';
                const newItem = createAndAppendImageBlock(id, '', 'contain', 'Nuevo estilo', '', 'Nuevo Estilo', defaultPrompt);
                const textEl = newItem.querySelector('.editable-text');
                if(textEl) {
                    textEl.style.fontFamily = "'Poppins', sans-serif";
                }
                imageGrid.prepend(newItem);
                updateEditableStates();
                hasUnsavedChanges = true;
                showStatus('Nuevo estilo añadido. Guarda los cambios.');
                newItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            async function enterEditMode() {
                if (isEditMode) return;
                const pwd = prompt('Contraseña para modo edición:');
                if (pwd === null) return;

                editModeButton.disabled = true;
                const ok = await checkPassword(pwd);
                editModeButton.disabled = false;

                if (ok) {
                    isEditMode = true;
                    body.classList.add('edit-mode');
                    editControls.classList.remove('hidden');
                    editControls.classList.add('flex');
                    editModeButton.innerHTML = '<i class="ri-close-line ri-lg"></i>';
                    applyImageLinks();
                    updateEditableStates();
                    showStatus('Modo edición activado.');
                } else {
                    showStatus('Contraseña incorrecta.', true);
                }
            }

            function exitEditMode() {
                if (!isEditMode) return;
                if (hasUnsavedChanges && !confirm('Tienes cambios sin guardar. ¿Quieres salir de todas formas?')) {
                    return;
                }
                isEditMode = false;
                body.classList.remove('edit-mode');
                editControls.classList.add('hidden');
                editControls.classList.remove('flex');
                editModeButton.innerHTML = '<i class="ri-pencil-line ri-lg"></i>';
                hasUnsavedChanges = false;
                applyImageLinks();
                updateEditableStates();
                showStatus('Modo edición desactivado.');
            }
            
            function updateEditableStates() {
                document.querySelectorAll('.editable-content, .editable-text').forEach(el => {
                    el.contentEditable = isEditMode;
                    if(isEditMode) {
                        el.addEventListener('input', () => hasUnsavedChanges = true);
                    }
                });
                document.querySelectorAll('.image-item').forEach(item => {
                    item.draggable = isEditMode;
                    item.classList.toggle('cursor-grab', isEditMode);
                    const img = item.querySelector('img');
                    if (img) {
                        img.classList.toggle('cursor-pointer', !isEditMode);
                    }
                });
            }

            async function saveContent() {
                if (!isEditMode) return;

                saveButton.disabled = true;
                saveButton.textContent = 'Guardando...';

                const data = {};
                const imageItems = Array.from(imageGrid.querySelectorAll('.image-item'));

                data['image-order'] = imageItems.map(item => item.querySelector('img[id]').id);

                imageItems.forEach(item => {
                    const img = item.querySelector('img[id]');
                    if (img) {
                        const id = img.id;
                        data[id] = img.getAttribute('src') || '';
                        data[`${id}-fit`] = img.style.objectFit || 'cover';
                        data[`${id}-link`] = img.dataset.imageLink || '';
                        
                        const textEl = item.querySelector(`#${id}-text`);
                        if (textEl) {
                            data[`${id}-text`] = textEl.innerHTML;
                            data[`${id}-text-fontFamily`] = textEl.style.fontFamily || '';
                            data[`${id}-text-fontSize`] = textEl.style.fontSize || '';
                            data[`${id}-text-color`] = textEl.style.color || '';
                            data[`${id}-text-textAlign`] = textEl.style.textAlign || '';
                        }

                        // Save prompt template
                        const promptTextarea = item.querySelector(`.prompt-textarea[data-id="${id}"]`);
                        if (promptTextarea) {
                            data[`${id}-prompt`] = promptTextarea.value || '';
                        }
                    }
                });
                
                document.querySelectorAll('.editable-content[id]').forEach(el => {
                    data[el.id] = el.innerHTML;
                    data[`${el.id}-fontFamily`] = el.style.fontFamily || '';
                    data[`${el.id}-fontSize`] = el.style.fontSize || '';
                    data[`${el.id}-color`] = el.style.color || '';
                    data[`${el.id}-textAlign`] = el.style.textAlign || '';
                });

                try {
                    const res = await fetch(SAVE_CONTENT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ content: data })
                    });
                    const r = await res.json();
                    if (!res.ok) throw new Error(r.error || res.statusText);
                    if (r.success) {
                        hasUnsavedChanges = false;
                        showStatus('¡Guardado con éxito!');
                    } else {
                        throw new Error(r.error || 'Error del servidor');
                    }
                } catch (e) {
                    showStatus('Error al guardar: ' + e.message, true);
                } finally {
                    saveButton.disabled = false;
                    saveButton.textContent = 'Guardar Cambios';
                }
            }

            async function loadContent() {
                imageGrid.innerHTML = '';
                hasUnsavedChanges = false;
                try {
                    const res = await fetch(`${LOAD_CONTENT_URL}?t=${Date.now()}`, { cache: 'no-store' });
                    if (!res.ok) throw new Error(res.statusText);
                    const txt = await res.text();
                    if (!txt.trim() || txt === '{}') {
                        return;
                    }
                    const d = JSON.parse(txt);
                    
                    const order = Array.isArray(d['image-order']) ? d['image-order'] : Object.keys(d).filter(k => !k.includes('-') && k.startsWith('image-'));

                    order.forEach(id => {
                        if (d[id] !== undefined) {
                            const promptTpl = d[`${id}-prompt`] || '';
                            const newItem = createAndAppendImageBlock(id, d[id], d[`${id}-fit`], 'Estilo de infografía', d[`${id}-link`], d[`${id}-text`], promptTpl);
                            imageGrid.appendChild(newItem);

                            const textEl = newItem.querySelector(`#${id}-text`);
                            if (textEl) {
                                textEl.style.fontFamily = d[`${id}-text-fontFamily`] || '';
                                textEl.style.fontSize = d[`${id}-text-fontSize`] || '';
                                textEl.style.color = d[`${id}-text-color`] || '';
                                textEl.style.textAlign = d[`${id}-text-textAlign`] || '';
                            }
                        }
                    });

                    document.querySelectorAll('.editable-content[id]').forEach(el => {
                        if (d[el.id] !== undefined) {
                            el.innerHTML = d[el.id];
                            el.style.fontFamily = d[`${el.id}-fontFamily`] || '';
                            el.style.fontSize = d[`${el.id}-fontSize`] || '';
                            el.style.color = d[`${el.id}-color`] || '';
                            el.style.textAlign = d[`${el.id}-textAlign`] || '';
                        }
                    });

                    applyImageLinks();
                    updateEditableStates();
                } catch (e) {
                    console.error("Error cargando contenido:", e);
                    showStatus('Error al cargar la galería: ' + e.message, true);
                }
            }
            
            // --- INICIALIZACIÓN Y EVENTOS ---
            Object.keys(availableFonts).forEach(name => {
                const option = document.createElement('option');
                option.value = availableFonts[name];
                option.textContent = name;
                option.style.fontFamily = availableFonts[name];
                fontFamilySelect.appendChild(option);
            });
            loadContent();

            editModeButton.addEventListener('click', () => isEditMode ? exitEditMode() : enterEditMode());
            saveButton.addEventListener('click', saveContent);
            addImageButton.addEventListener('click', addNewImagePlaceholder);
            hiddenFileInput.addEventListener('change', handleFileSelected);
            applyStyleButton.addEventListener('click', applyStyles);
            cancelStyleButton.addEventListener('click', () => styleEditorModal.classList.add('hidden'));

            // Click handler for image grid
            imageGrid.addEventListener('click', e => {
                // In view mode: navigate to generator
                if (!isEditMode) {
                    if (e.target.closest('a')) return;
                    
                    const item = e.target.closest('.image-item');
                    if (item) {
                        const id = item.dataset.id;
                        const img = item.querySelector('img');
                        const isPlaceholder = !img || !img.src || img.src.includes('data:image/svg+xml');
                        if (!isPlaceholder) {
                            // Navigate to generar.html with style ID
                            window.location.href = `generar.html?id=${encodeURIComponent(id)}`;
                            return;
                        }
                    }
                    return;
                }

                // In edit mode: handle edit buttons
                const editBtn = e.target.closest('.image-edit-button');
                if (editBtn) {
                    e.stopPropagation();
                    const id = editBtn.closest('.image-item')?.dataset.id;
                    const action = editBtn.dataset.action;
                    if(id && action) handleImageAction(id, action);
                }
                
                const styleBtn = e.target.closest('.edit-style-btn');
                if (styleBtn) {
                    e.stopPropagation();
                    openStyleEditor(styleBtn.dataset.targetElement);
                }
            });

            // Also handle prompt textarea clicks in edit mode
            mainContent.addEventListener('click', e => {
                if (!isEditMode) return;
                // Prevent click on textarea from triggering navigation
                if (e.target.closest('.prompt-template-field')) {
                    e.stopPropagation();
                }
            });
            
            // --- DRAG AND DROP ---
            let draggingElement = null;

            imageGrid.addEventListener('dragstart', e => {
                if (!isEditMode) return;
                const target = e.target.closest('.image-item');
                if (target) {
                    draggingElement = target;
                    e.dataTransfer.effectAllowed = 'move';
                    setTimeout(() => draggingElement.classList.add('dragging'), 0);
                }
            });

            imageGrid.addEventListener('dragend', () => {
                if (draggingElement) {
                    draggingElement.classList.remove('dragging');
                    draggingElement = null;
                }
            });
            
            imageGrid.addEventListener('dragover', e => {
                e.preventDefault();
                if (!isEditMode || !draggingElement) return;
                e.dataTransfer.dropEffect = 'move';
                
                const target = e.target.closest('.image-item');
                if (target && target !== draggingElement) {
                    const rect = target.getBoundingClientRect();
                    const isAfter = (e.clientX - rect.left) > rect.width / 2;
                    
                    if (isAfter) {
                        target.parentNode.insertBefore(draggingElement, target.nextSibling);
                    } else {
                        target.parentNode.insertBefore(draggingElement, target);
                    }
                }
            });
            
            imageGrid.addEventListener('drop', e => {
                e.preventDefault();
                if (draggingElement) {
                    hasUnsavedChanges = true;
                    showStatus('Orden cambiado. Guarda los cambios.');
                }
            });

            window.addEventListener('beforeunload', e => {
                if (isEditMode && hasUnsavedChanges) {
                    e.preventDefault();
                    e.returnValue = 'Tienes cambios sin guardar. ¿Estás seguro de que quieres salir?';
                }
            });

            // --- LIGHTBOX (kept for potential use) ---
            const lightboxModal = document.getElementById('lightbox-modal');
            const lightboxImage = document.getElementById('lightbox-image');
            const lightboxClose = document.getElementById('lightbox-close');

            function openLightbox(src) {
                if (!lightboxModal || !lightboxImage) return;
                lightboxImage.src = src;
                lightboxModal.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            }

            function closeLightbox() {
                if (!lightboxModal) return;
                lightboxModal.classList.add('hidden');
                lightboxImage.src = '';
                document.body.style.overflow = '';
            }

            if (lightboxClose) {
                lightboxClose.addEventListener('click', e => {
                    e.stopPropagation();
                    closeLightbox();
                });
            }

            if (lightboxModal) {
                lightboxModal.addEventListener('click', (e) => {
                    if (e.target === lightboxModal) closeLightbox();
                });
            }

            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && lightboxModal && !lightboxModal.classList.contains('hidden')) {
                    closeLightbox();
                }
            });
        });
    </script>
</body>
</html>
