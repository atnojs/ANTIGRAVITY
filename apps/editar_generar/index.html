<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Studio Pro | Premium Edition</title>
    <link rel="icon" href="https://atnojs.es/iconos/favicon1.ico" type="image/x-icon">

    <!-- Fuentes premium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React 18 UMD -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel standalone -->
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Sistema de Diseño Premium -->
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="app.css">

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fffbeb',
                            100: '#fef3c7',
                            200: '#fde68a',
                            300: '#fcd34d',
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                            700: '#b45309',
                            800: '#92400e',
                            900: '#78350f',
                        }
                    }
                }
            }
        }
    </script>

    <script>
        window.onerror = function (msg, url, line, col, error) {
            document.body.innerHTML = '<div style="max-width:500px;margin:80px auto;background:#18181B;border:1px solid #27272A;border-radius:24px;padding:40px;color:#fff;font-family:Inter,sans-serif;text-align:center;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5)">' +
                '<div style="font-size:48px;margin-bottom:16px">⚠️</div>' +
                '<h1 style="font-size:1.5rem;font-weight:700;margin-bottom:8px">Error de Interfaz</h1>' +
                '<p style="color:#A1A1AA;margin-bottom:16px">' + msg + '</p>' +
                '<p style="font-size:0.75rem;color:#52525B">Line: ' + line + ':' + col + '</p>' +
                '<pre style="text-align:left;font-size:0.7rem;color:#71717A;margin-top:16px;overflow:auto">' + (error ? error.stack : '') + '</pre>' +
                '</div>';
        };
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="text/babel" src="app.js"></script>
</body>

</html>
