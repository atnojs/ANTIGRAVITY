<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Pasatiempos Inteligentes</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
    .loading-overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;background:radial-gradient(circle at 0% 0%,rgba(56,189,248,0.3),transparent 55%),radial-gradient(circle at 100% 100%,rgba(15,23,42,0.95),rgba(15,23,42,1));backdrop-filter:blur(32px) saturate(1.8);-webkit-backdrop-filter:blur(32px) saturate(1.8)}
    .loading-overlay.hidden{display:none}
    .spinner-triple{position:relative;width:80px;height:80px}
    .spinner-triple .ring{position:absolute;border-radius:50%;border:3px solid transparent}
    .spinner-triple .ring-1{inset:0;border-top-color:#22d3ee;animation:spin 1.2s linear infinite;box-shadow:0 0 20px rgba(34,211,238,0.4)}
    .spinner-triple .ring-2{inset:10px;border-right-color:#a78bfa;animation:spin-reverse 1s linear infinite;box-shadow:0 0 15px rgba(167,139,250,0.4)}
    .spinner-triple .ring-3{inset:20px;border-bottom-color:#f472b6;animation:spin 0.8s linear infinite;box-shadow:0 0 10px rgba(244,114,182,0.4)}
    .loading-text{color:#e5e7eb;font-size:1.125rem;font-weight:500;text-align:center}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes spin-reverse{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
    </style>
    <!-- Custom Styles -->
    <link href="styles.css" rel="stylesheet">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5', // Indigo 600
                        secondary: '#64748b', // Slate 500
                        background: '#f8fafc', // Slate 50
                        surface: '#ffffff',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-slate-800 font-sans antialiased min-h-screen flex flex-col">
    <header class="bg-surface shadow-sm sticky top-0 z-10 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="if(window.app && window.app.goHome) window.app.goHome()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <h1 class="text-xl font-bold text-slate-900 tracking-tight">Centro de Pasatiempos</h1>
            </div>
            <nav class="hidden md:flex space-x-4">
                <button onclick="if(window.app && window.app.goHome) window.app.goHome()" class="text-sm font-medium text-slate-600 hover:text-primary transition-colors">Inicio</button>
            </nav>
        </div>
    </header>

    <main id="app-content" class="flex-grow flex flex-col">
        <!-- El contenido se inyectará aquí dinámicamente -->
        <div class="flex items-center justify-center h-64">
            <div class="spinner"></div>
        </div>
    </main>

    <footer class="bg-surface border-t border-slate-200 mt-auto no-print">
        <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
            <p class="text-center text-sm text-slate-400">
                &copy; 2025 Atnojs Pasatiempos Inteligentes.
            </p>
        </div>
    </footer>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay hidden" style="display:none">
        <div class="spinner-triple">
            <div class="ring ring-1"></div><div class="ring ring-2"></div><div class="ring ring-3"></div>
        </div>
        <p class="loading-text">IA Generando Obra Maestra...</p>
    </div>
    <script>(function(){var o=document.getElementById('loading-overlay');if(o){o.className='loading-overlay hidden';o.style.display='none';}})();</script>

    <!-- Aplicación Principal -->
    <script src="history-manager.js"></script>
    <script src="app.js"></script>
</body>
</html>
