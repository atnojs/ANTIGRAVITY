<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversor multimedia local</title>
<meta name="description" content="Convierte imágenes, vídeos y audios directamente en tu navegador, sin subir tus archivos a ningún servidor.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>🔄</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --pink:#e91e63;
  --pink-light:rgba(233,30,99,0.08);
  --pink-glow:rgba(233,30,99,0.25);
  --bg:#fafafa;
  --card-bg:#fff;
  --border:#e0e0e0;
  --text:#222;
  --text-dim:#777;
  --green:#2e7d32;
  --radius:8px;
  --radius-sm:6px;
  --font:'Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'Cascadia Code','JetBrains Mono','Consolas',monospace
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.4}
body{padding:16px;max-width:1100px;margin:0 auto}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#eee}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}

/* Header */
.app-header{text-align:center;padding:8px 0 14px}
.app-header h1{font-size:20px;color:var(--text);letter-spacing:-0.3px}
.app-header p{font-size:11px;color:var(--text-dim);margin-top:1px}

/* Top buttons */
.top-buttons{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.top-btn{flex:1;min-width:140px;padding:12px 16px;border:2px solid var(--pink);border-radius:var(--radius);background:var(--card-bg);color:var(--text);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;transition:.2s;text-align:center}
.top-btn:hover{background:var(--pink-light)}
.top-btn.active{background:var(--pink);color:#fff}

/* Cards */
.card{background:var(--card-bg);border:2px solid var(--pink);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.card-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin-bottom:10px;text-align:center}

/* Upload zone */
.upload-zone{border:2px dashed var(--pink);border-radius:var(--radius);padding:24px 16px;text-align:center;cursor:pointer;transition:.2s;background:var(--card-bg)}
.upload-zone:hover,.upload-zone.dragover{background:var(--pink-light);border-style:solid}
.upload-zone-icon{font-size:28px;margin-bottom:4px}
.upload-zone-text{font-size:13px;color:var(--text-dim)}
.upload-zone-text strong{color:var(--pink)}

/* Two columns */
.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media(max-width:700px){.columns{grid-template-columns:1fr}}

/* Format bar */
.format-bar{display:flex;align-items:center;gap:8px;background:var(--bg);border:2px solid var(--pink);border-radius:var(--radius);padding:6px 10px;margin-bottom:10px}
.format-bar select{border:none;background:transparent;font-weight:700;font-size:13px;color:var(--pink);outline:none;cursor:pointer;padding:4px}
.format-bar input[type=range]{flex:1;min-width:60px;border:none;outline:none}
.format-bar .bar-pct{font-size:11px;color:var(--text-dim);min-width:32px;text-align:right;font-weight:600}
.format-bar .bar-btn{background:var(--pink);color:#fff;border:none;padding:6px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.2s}
.format-bar .bar-btn:hover{background:#c2185b;box-shadow:0 2px 8px var(--pink-glow)}

/* Image grids */
.img-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(max-width:400px){.img-grid{grid-template-columns:1fr}}
.img-grid-item{border:2px solid var(--pink);border-radius:var(--radius-sm);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;background:var(--bg);overflow:hidden;position:relative}
.img-grid-item img{width:100%;height:100%;object-fit:contain}
.img-grid-item .grid-placeholder{color:var(--text-dim);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px}

/* Below grid image: actions */
.img-grid-actions{display:flex;gap:4px;margin-top:4px;justify-content:center}
.img-grid-actions .btn-xs{padding:4px 10px;font-size:11px;border-radius:var(--radius-sm);cursor:pointer;font-weight:600;border:1px solid var(--pink);transition:.2s}
.img-grid-actions .btn-xs.dl-btn{background:var(--pink);color:#fff}
.img-grid-actions .btn-xs.dl-btn:hover{background:#c2185b}
.img-grid-actions .btn-xs.compress-btn{background:var(--card-bg);color:var(--pink)}
.img-grid-actions .btn-xs.compress-btn:hover{background:var(--pink-light)}

.img-grid-item.compressed{border-color:#4caf50;box-shadow:0 0 8px rgba(76,175,80,.2)}

/* Editor (above columns) */
.editor-row{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.editor-preview{flex:1;min-width:280px;text-align:center;position:relative}
.editor-preview .resize-container{position:relative;display:inline-block;line-height:0}
.editor-preview img{max-width:100%;max-height:35vh;border-radius:var(--radius-sm);box-shadow:0 2px 12px rgba(0,0,0,.08);display:block;user-select:none;-webkit-user-drag:none;border:2px solid var(--border)}
.editor-preview .resize-handle{position:absolute;width:14px;height:14px;background:var(--pink);border:2px solid #fff;border-radius:50%;box-shadow:0 0 8px var(--pink-glow);z-index:10;transition:transform .15s}
.editor-preview .resize-handle:hover{transform:scale(1.3)}
.editor-preview .resize-handle[data-corner=se]{bottom:-7px;right:-7px;cursor:nwse-resize}
.editor-preview .resize-handle[data-corner=sw]{bottom:-7px;left:-7px;cursor:nesw-resize}
.editor-preview .resize-handle[data-corner=ne]{top:-7px;right:-7px;cursor:nesw-resize}
.editor-preview .resize-handle[data-corner=nw]{top:-7px;left:-7px;cursor:nwse-resize}

/* Info bar */
.info-bar{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;padding:6px 10px;background:var(--bg);border-radius:var(--radius-sm);font-family:var(--mono);font-size:11px;margin-top:4px}
.info-bar .info-item{display:flex;align-items:center;gap:3px}
.info-bar .info-label{color:var(--text-dim)}
.info-bar .info-value{color:var(--pink);font-weight:600}

/* Quick actions */
.quick-actions{display:flex;flex-wrap:wrap;gap:5px;padding:4px 0;justify-content:center}
.quick-actions .btn-sm{padding:5px 12px;font-size:11px;font-weight:600;border-radius:var(--radius-sm);cursor:pointer;transition:.2s;border:1px solid var(--pink);background:var(--card-bg);color:var(--pink)}
.quick-actions .btn-sm:hover{background:var(--pink-light)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 16px;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;transition:.2s;text-decoration:none}
.btn-primary{background:var(--pink);color:#fff}
.btn-primary:hover{background:#c2185b;box-shadow:0 2px 8px var(--pink-glow)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn-sm{padding:5px 12px;font-size:12px}

/* Video/audio card */
.media-card{background:var(--card-bg);border:2px solid var(--pink);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.media-card .preview-area video{max-width:100%;max-height:40vh;border-radius:var(--radius-sm);border:2px solid var(--border)}
.media-card .controls-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0}

/* progress */
.progress-bar{width:100%;height:4px;background:#eee;border-radius:2px;overflow:hidden;margin-top:6px}
.progress-bar-fill{height:100%;background:var(--pink);border-radius:2px;transition:width .2s;width:0%}
.progress-text{font-size:10px;color:var(--text-dim);margin-top:2px;text-align:center}

/* toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--pink);border-radius:var(--radius);padding:10px 20px;font-size:13px;z-index:999;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.toast.show{opacity:1}
.toast.success{border-color:#4caf50}
.toast.error{border-color:#f44336}

.spinner{display:inline-block;width:14px;height:14px;border:2px solid #eee;border-top-color:var(--pink);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600}
.badge.loading{background:rgba(255,152,0,.1);color:#e65100}
.badge.ready{background:rgba(76,175,80,.1);color:var(--green)}
.badge.error{background:rgba(244,67,54,.1);color:#c62828}

.section-divider{border:none;border-top:1px solid var(--border);margin:10px 0}

/* Sistema visual Hoola/Relatos */
@font-face{font-family:'Electrolize';src:url('./vendor/electrolize.ttf') format('truetype');font-display:swap}
:root{--cyan:#00d0d0;--green:#26c626;--ink:#001018;--panel:rgba(23,79,122,.42);--border-cyan:rgba(0,208,208,.45);--text:#f4ffff;--text-dim:#b9d3dc;--bg:#001018;--card-bg:var(--panel);--pink:var(--cyan);--pink-light:rgba(0,208,208,.12);--pink-glow:rgba(0,208,208,.3);--radius:14px;--radius-sm:9px;--font:'Electrolize','Segoe UI',system-ui,sans-serif;--red:#ff6b6b}
html,body{background:linear-gradient(180deg,#001018 0%,#062f43 60%,#0e5368 100%) fixed;color:var(--text)}
body{max-width:1800px;padding:16px;background-image:radial-gradient(circle at 50% -10%,rgba(0,208,208,.26),transparent 34%),radial-gradient(circle at 100% 55%,rgba(38,198,38,.16),transparent 35%),linear-gradient(rgba(0,208,208,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(0,208,208,.18) 1px,transparent 1px);background-size:auto,auto,46px 46px,46px 46px;background-attachment:fixed}
.app-header{padding:12px 0 18px}.app-header h1{color:var(--cyan);font-family:var(--font);font-size:clamp(1.25rem,2.4vw,1.75rem);letter-spacing:.08em;text-transform:uppercase;text-shadow:0 0 14px rgba(0,208,208,.55)}.app-header p{color:var(--text-dim);font-size:.8rem;margin-top:6px}
.top-btn,.card,.media-card{background:var(--panel);border-color:var(--border-cyan);box-shadow:inset 0 0 20px rgba(0,208,208,.08),0 0 16px rgba(0,208,208,.12);backdrop-filter:blur(12px)}
.top-btn{color:var(--cyan)}.top-btn:hover,.top-btn:focus-visible{background:rgba(255,255,255,.08);border-color:var(--cyan);box-shadow:0 0 16px rgba(0,208,208,.35)}.top-btn.active,.btn-primary,.format-bar .bar-btn{background:linear-gradient(135deg,var(--cyan),var(--green));color:#001018;border-color:transparent}
.card-title{color:var(--cyan)}.upload-zone,.format-bar{background:rgba(0,16,24,.5);border-color:var(--border-cyan)}.upload-zone-text,.info-bar .info-label,.progress-text{color:var(--text-dim)}.upload-zone-text strong,.info-bar .info-value{color:var(--cyan)}
.format-bar select,.media-card select{background:rgba(0,16,24,.72)!important;color:var(--cyan)!important;border-color:var(--border-cyan)!important;font-family:var(--font)}
.img-grid-item{background:rgba(0,16,24,.5);border-color:var(--border-cyan)}.quick-actions .btn-sm,.img-grid-actions .btn-xs.compress-btn{background:rgba(0,16,24,.58);border-color:var(--border-cyan);color:var(--cyan)}.img-grid-actions .btn-xs.dl-btn{background:linear-gradient(135deg,var(--cyan),var(--green));color:#001018}.btn-primary:hover,.format-bar .bar-btn:hover{background:linear-gradient(135deg,#1cf2f2,#41e541);color:#001018}.toast{background:#062f43;color:#fff;border-color:var(--cyan);box-shadow:0 0 18px rgba(0,208,208,.35)}.progress-bar{background:rgba(255,255,255,.12)}.progress-bar-fill{background:linear-gradient(90deg,var(--cyan),var(--green))}.badge.loading{background:rgba(0,208,208,.12);color:var(--cyan)}.badge.ready{background:rgba(38,198,38,.13);color:#82f782}.badge.error{background:rgba(255,105,105,.15);color:#ffb6b6}
.batch-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 10px;padding:9px 11px;border:1px solid var(--border-cyan);border-radius:var(--radius-sm);background:rgba(0,16,24,.5)}.batch-select-all,.batch-actions{display:flex;align-items:center;gap:7px}.batch-select-all{color:var(--cyan);font-weight:700;cursor:pointer}.batch-actions{justify-content:flex-end;flex-wrap:wrap}.batch-select-all input,.audio-check{width:18px;height:18px;accent-color:var(--green);cursor:pointer}.batch-delete-btn{background:rgba(255,107,107,.14);color:#ffd7d7;border:1px solid #ff7b7b}.batch-delete-btn:hover:not(:disabled){background:var(--red);color:#001018}.batch-delete-btn:disabled{opacity:.45;cursor:not-allowed}.audio-row.is-checked{background:rgba(0,208,208,.1)!important}.audio-row.has-error{border-color:#ff7b7b!important;background:rgba(180,35,35,.2)!important}.audio-error{color:#ffd0d0;font-size:11px;line-height:1.25;flex:1 1 100%;padding-left:26px}.audio-check{flex:0 0 auto}#audio-selection-count{color:var(--text-dim);font-size:12px}button:focus-visible,select:focus-visible,input:focus-visible,.upload-zone:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="app-header">
  <h1>Conversor multimedia</h1>
  <p>Convierte y comprime tus archivos de forma privada · todo ocurre en tu navegador</p>
</div>

<main id="main-content">
<!-- Top buttons -->
<div class="top-buttons">
  <button type="button" class="top-btn active" id="mode-images" aria-controls="mode-images-pane" aria-selected="true">SUBIR IMÁGENES</button>
  <button type="button" class="top-btn" id="mode-video" aria-controls="mode-video-pane" aria-selected="false">SUBIR VÍDEOS</button>
  <button type="button" class="top-btn" id="mode-audio" aria-controls="mode-audio-pane" aria-selected="false">SUBIR AUDIOS</button>
</div>

<!-- Upload zone -->
<div class="card" id="upload-card">
  <div class="upload-zone" id="main-upload-zone" role="button" tabindex="0" aria-label="Seleccionar archivos">
    <div class="upload-zone-icon">📁</div>
    <div class="upload-zone-text">Arrastra archivos aquí o <strong>haz clic</strong></div>
  </div>
  <input type="file" id="img-input" multiple accept="image/*" hidden>
  <input type="file" id="video-input" accept="video/*" hidden>
  <input type="file" id="audio-input" accept="audio/*" multiple hidden>
</div>

<!-- ====== IMAGES MODE ====== -->
<div id="mode-images-pane">

  <!-- Two columns -->
  <div class="columns">
    <!-- LEFT: Convertir Formato -->
    <div class="card">
      <div class="card-title">Convertir formato</div>
      <div class="format-bar">
        <select id="convert-img-format" aria-label="Formato de imagen de salida">
          <option value="image/webp" selected>Webp</option>
          <option value="image/png">PNG</option>
          <option value="image/jpeg">JPEG</option>
          <option value="image/bmp">BMP</option>
          <option value="image/gif">GIF</option>
        </select>
        <input type="range" id="convert-img-quality" min="10" max="100" value="90" aria-label="Calidad de imagen">
        <span class="bar-pct" id="convert-quality-label">90%</span>
        <button class="bar-btn" id="convert-img-btn">Convertir</button>
      </div>
      <div class="img-grid" id="uploaded-img-grid"></div>
    </div>

    <!-- RIGHT: Imágenes Generadas -->
    <div class="card">
      <div class="card-title">Imágenes generadas</div>
      <div class="img-grid" id="convert-results-grid" aria-live="polite"></div>
      <div id="convert-results-actions" style="display:none"></div>
    </div>
  </div>
</div>

<!-- ====== VIDEO MODE ====== -->
<div id="mode-video-pane" style="display:none">
  <div class="media-card">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span id="ff-video-status" class="badge loading" role="status" aria-live="polite">⏳ Preparando motor local…</span>
    </div>
    <div class="preview-area"><video id="video-preview" controls></video></div>
    <div class="controls-row">
      <label style="font-size:12px;color:var(--text-dim);font-weight:600">Convertir a:</label>
      <select id="convert-video-format" aria-label="Formato de vídeo de salida" style="border:1px solid var(--pink);border-radius:var(--radius-sm);padding:5px 10px">
        <option value="mp4">MP4</option><option value="webm">WebM</option>
        <option value="avi">AVI</option><option value="mov">MOV</option><option value="gif">GIF</option>
      </select>
      <button class="btn btn-primary btn-sm" id="convert-video-btn" disabled>Convertir</button>
    </div>
    <div id="video-progress" style="display:none">
      <div class="progress-bar"><div class="progress-bar-fill" id="video-progress-fill"></div></div>
      <div class="progress-text" id="video-progress-text">0%</div>
    </div>
    <div id="video-result" style="margin-top:8px" aria-live="polite"></div>
  </div>
</div>

<!-- ====== AUDIO MODE ====== -->
<div id="mode-audio-pane" style="display:none">
  <div class="media-card">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span id="ff-audio-status" class="badge loading" role="status" aria-live="polite">⏳ Preparando motor local…</span>
    </div>
    <div style="margin-bottom:8px"><span style="font-size:13px;color:var(--text-dim)" id="audio-file-info">Sin archivos</span></div>
    <div class="batch-toolbar">
      <label class="batch-select-all"><input type="checkbox" id="audio-select-all"> <span>Seleccionar todo</span></label>
      <div class="batch-actions">
        <span id="audio-selection-count" aria-live="polite">0 seleccionados</span>
        <button type="button" class="btn btn-sm batch-delete-btn" id="delete-selected-audio-btn" disabled aria-disabled="true">Eliminar seleccionados</button>
      </div>
    </div>
    <!-- Lista de audios subidos -->
    <div id="audio-list" style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px"></div>
    <div class="controls-row">
      <label style="font-size:12px;color:var(--text-dim);font-weight:600">A:</label>
      <select id="convert-audio-format" aria-label="Formato de audio de salida" style="border:1px solid var(--pink);border-radius:var(--radius-sm);padding:5px 10px">
        <option value="mp3">MP3</option><option value="wav">WAV</option>
        <option value="ogg">OGG</option><option value="m4a">M4A</option><option value="flac">FLAC</option>
      </select>
      <label style="font-size:12px;color:var(--text-dim);font-weight:600;margin-left:4px">Calidad:</label>
      <select id="convert-audio-quality" aria-label="Calidad de audio" style="border:1px solid var(--pink);border-radius:var(--radius-sm);padding:5px 10px">
        <option value="128k">128k</option><option value="192k" selected>192k</option>
        <option value="256k">256k</option><option value="320k">320k</option>
      </select>
      <button class="btn btn-primary btn-sm" id="convert-audio-btn" disabled>Convertir</button>
    </div>
    <div id="audio-progress" style="display:none">
      <div class="progress-bar"><div class="progress-bar-fill" id="audio-progress-fill"></div></div>
      <div class="progress-text" id="audio-progress-text">0%</div>
    </div>
    <div id="audio-result" style="margin-top:8px" aria-live="polite"></div>
  </div>
</div>

</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));

function toast(msg, type='success') {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show '+type;
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 3000);
}
function fmtSize(bytes) {
  if (!bytes || bytes === 0) return '—';
  if (bytes < 1024) return bytes+' B';
  if (bytes < 1048576) return (bytes/1024).toFixed(1)+' KB';
  return (bytes/1048576).toFixed(2)+' MB';
}
function extFromMime(mime) {
  return ({'image/png':'png','image/jpeg':'jpg','image/webp':'webp',
    'image/bmp':'bmp','image/gif':'gif','image/avif':'avif'}[mime] || 'bin');
}
function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = reject;
    r.readAsDataURL(file);
  });
}

const procCanvas = document.createElement('canvas');
const procCtx = procCanvas.getContext('2d');

/* ============================================================ */
/*  MODE SWITCHING                                               */
/* ============================================================ */
let currentMode = 'images';
const modes = ['images','video','audio'];

$$('.top-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('.top-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected','false'); });
    btn.classList.add('active');
    btn.setAttribute('aria-selected','true');
    const mode = btn.id.replace('mode-','');
    currentMode = mode;
    modes.forEach(m => {
      const pane = $(`#mode-${m}-pane`);
      if (pane) pane.style.display = m === mode ? '' : 'none';
    });
    // Update file input accept
    if (mode === 'images') {
      $('#img-input').accept = 'image/*';
      $('#main-upload-zone').querySelector('.upload-zone-text').innerHTML = 'Arrastra imágenes aquí o <strong>haz clic</strong>';
    } else if (mode === 'video') {

let ffmpeg = null, ffLoaded = false, ffLoadingPromise = null;

async function loadFFmpeg() {
  if (ffLoaded) return true;
  if (ffLoadingPromise) return ffLoadingPromise;
  setFFStatus('loading','⏳ Preparando motor local…');
  ffLoadingPromise = (async () => {
    try {
      const { FFmpeg } = await import('./vendor/ffmpeg/index.js');
      ffmpeg = new FFmpeg();
      await ffmpeg.load({
        coreURL: new URL('./vendor/ffmpeg-core.js', location.href).href,
        wasmURL: new URL('./vendor/ffmpeg-core.wasm', location.href).href,
      });
      ffLoaded = true;
      setFFStatus('ready','✓ Motor listo · proceso privado');
      $('#convert-video-btn').disabled = !videoFile;
      syncAudioUI();
      return true;
    } catch (_) {
      ffmpeg = null;
      setFFStatus('error','✕ No se pudo cargar el motor');
      toast('No se pudo iniciar el conversor multimedia. Recarga para reintentar.','error');
      return false;
    } finally {
      ffLoadingPromise = null;
    }
  })();
  return ffLoadingPromise;
}
function setFFStatus(type, text) {
  ['video','audio'].forEach(t => {
    const el = $(`#ff-${t}-status`); if (el) { el.className = 'badge '+type; el.textContent = text; }
  });
}

let imgEntries = [];

async function handleImageFiles(fileList) {

  }

  if (currentIdx === -1) { currentIdx = 0; }
  renderUploadedGrid();
}

/* Right column: uploaded images grid */
function renderUploadedGrid() {

  const items = [];
  for (let i = 0; i < imgEntries.length; i++) {
    items.push(`
      <div class="img-grid-item" data-idx="${i}" style="cursor:pointer${i === currentIdx ? ';border-color:#111;box-shadow:0 0 10px rgba(233,30,99,.5)' : ''}">

      const mimeByExt = { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', webp:'image/webp', bmp:'image/bmp', gif:'image/gif', avif:'image/avif' };

/* Convertir formato */
$('#convert-img-quality').addEventListener('input', () => {
  $('#convert-quality-label').textContent = $('#convert-img-quality').value + '%';
});

$('#convert-img-btn').addEventListener('click', async () => {
  if (currentIdx === -1) return toast('Selecciona una imagen primero','error');
  const entry = imgEntries[currentIdx];
  const mime = $('#convert-img-format').value;
  const quality = parseInt($('#convert-img-quality').value) / 100;
  const ext = extFromMime(mime);

  // Detectar formato actual de la imagen
  const imgExt = (entry.file.name.match(/\.([^.]+)$/i) || [,'jpg'])[1].toLowerCase();
  const mimeByExt = { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', webp:'image/webp', bmp:'image/bmp', gif:'image/gif', avif:'image/avif' };
  if (mimeByExt[imgExt] === mime) return toast('El formato es el mismo que tiene la imagen','error');

  // Cargar dimensiones originales
  const img = new Image(); img.src = entry.dataUrl;
  await new Promise(r => { img.onload = r; });
  const w = img.naturalWidth, h = img.naturalHeight;

  procCanvas.width = w; procCanvas.height = h;
  procCtx.drawImage(img, 0, 0, w, h);

  let blob = await new Promise(r => procCanvas.toBlob(r, mime, quality));
  if (!blob || blob.type !== mime) {
    if (!['image/bmp','image/gif'].includes(mime)) return toast('Formato no compatible en este navegador','error');
    if (!await loadFFmpeg()) return;
    const inputExt = (entry.file.name.match(/\.([^.]+)$/) || [,'png'])[1];
    const inputName = 'image-input.' + inputExt;
    const outputName = 'image-output.' + ext;
    try {
      await ffmpeg.writeFile(inputName, new Uint8Array(await entry.file.arrayBuffer()));
      await ffmpeg.exec(['-i', inputName, outputName]);
      const data = await ffmpeg.readFile(outputName);
      blob = new Blob([data.buffer], { type: mime });
      await ffmpeg.deleteFile(inputName);
      await ffmpeg.deleteFile(outputName);
    } catch (_) {
      return toast('No se pudo convertir a ' + ext.toUpperCase(),'error');
    }
  }

  const name = entry.file.name.replace(/\.[^.]+$/, '') + '.' + ext;
  addConvertResult(blob, name, await fileToDataURL(blob));
});

/* Add result to left grid */
let convertResults = []; // {blob, name, dataUrl}

function addConvertResult(blob, name, dataUrl) {
  // Store result
  const result = { blob, name, dataUrl };
  convertResults.unshift(result);
  if (convertResults.length > 4) convertResults.length = 4;
  renderConvertGrid();
  toast(`Generado: ${name} (${fmtSize(blob.size)})`);
}

function renderConvertGrid() {
  const grid = $('#convert-results-grid');
  const actions = $('#convert-results-actions');

  const items = [];
  const max = Math.max(convertResults.length, 0);
  for (let i = 0; i < max; i++) {
    const r = convertResults[i];
    items.push(`
      <div class="img-grid-item" data-ridx="${i}">
        <img src="${r.dataUrl}" alt="">
        <div class="img-grid-actions" style="position:absolute;bottom:4px;left:50%;transform:translateX(-50%)">
          <button class="btn-xs dl-btn" data-ridx="${i}" data-action="dl">Descargar</button>
          <button class="btn-xs compress-btn" data-ridx="${i}" data-action="compress">60KB</button>
        </div>
      </div>`);
  }
  if (!items.length) {
    items.push('<div class="img-grid-item"><span class="grid-placeholder">SIN IMÁGENES</span></div>');
  }
  grid.innerHTML = items.join('');
  actions.style.display = convertResults.length ? '' : 'none';

  // Wire buttons
  grid.querySelectorAll('[data-action="dl"]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.ridx);
      const r = convertResults[idx];
      downloadBlob(r.blob, r.name);
      toast(`Descargado: ${r.name}`);
    });
  });

  grid.querySelectorAll('[data-action="compress"]').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.ridx);
      const r = convertResults[idx];
      const compressBtn = btn;
      compressBtn.textContent = '…';
      compressBtn.disabled = true;

      try {
        // Detect format
        const origExt = (r.name.match(/\.[^.]+$/i) || ['.jpg'])[0].toLowerCase().replace('.','');
        const fmtMap = {jpg:['image/jpeg','jpg'],jpeg:['image/jpeg','jpg'],webp:['image/webp','webp'],avif:['image/webp','webp'],png:['image/png','png'],bmp:['image/webp','webp'],gif:['image/webp','webp']};
        const [compressMime, outExt] = fmtMap[origExt] || ['image/png','png'];

        const img = new Image();
        await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = r.dataUrl; });

        let cw = img.naturalWidth, ch = img.naturalHeight;
        // Reducir dimensiones si es enorme
        if (cw > 4000 || ch > 4000) {
          const scale = 4000 / Math.max(cw, ch);
          cw = Math.round(cw * scale); ch = Math.round(ch * scale);
        }

        // Suelo de calidad por formato (no degradar de más)
        const qFloor = { jpg:0.3, jpeg:0.3, webp:0.01, avif:0.01, png:0.5, bmp:0.5, gif:0.5 };
        const minQ = qFloor[origExt] || 0.3;
        const isLossless = ['png','bmp','gif'].includes(origExt);

        let best = null, bestLo = minQ;
        // Reducir dimensiones progresivamente si no cabe en 60KB
        for (let round = 0; round < 6; round++) {
          procCanvas.width = cw; procCanvas.height = ch;
          procCtx.drawImage(img, 0, 0, cw, ch);

          let lo = minQ, hi = 1.0;
          for (let i = 0; i < 10; i++) {
            const mid = (lo + hi) / 2;
            const b = await new Promise(res => procCanvas.toBlob(res, compressMime, mid));
            if (!b) break;
            if (b.size / 1024 > 60) { hi = mid; }
            else { lo = mid; best = b; bestLo = mid; }
          }
          if (best && best.size / 1024 <= 60) break;
          // Reducir dimensiones: WebP/AVIF más agresivo, JPEG/PNG moderado
          const factor = (origExt === 'webp' || origExt === 'avif') ? 0.55 : 0.78;
          cw = Math.max(80, Math.round(cw * factor));
          ch = Math.max(80, Math.round(ch * factor));
        }
        // Si no llega, forzar la mínima calidad posible sin degradar más dimensiones
        if (!best || best.size / 1024 > 60) {
          procCanvas.width = cw; procCanvas.height = ch;
          procCtx.drawImage(img, 0, 0, cw, ch);
          best = await new Promise(res => procCanvas.toBlob(res, compressMime, minQ));
          bestLo = minQ;
        }
        if (!best) return toast('Error al comprimir','error');

        const newDataUrl = procCanvas.toDataURL(compressMime, bestLo);
        const newName = r.name.replace(/\.[^.]+$/i, '') + '_60kb.' + outExt;

        // Update result
        r.blob = best;
        r.name = newName;
        r.dataUrl = newDataUrl;
        renderConvertGrid();
        toast(`Comprimido: ${newName} (${fmtSize(best.size)})`);
      } catch(e) {
        toast('Error al comprimir','error');
        compressBtn.textContent = '60KB'; compressBtn.disabled = false;
      }
    });
  });
}

/* ============================================================ */
/*  AUDIO                                                        */
/* ============================================================ */
let audioEntries = [];
let currentAudioIdx = -1;
let selectedAudioIndexes = new Set();
let audioConversionActive = false;
const audioErrorMessages = new WeakMap();

function syncAudioUI() {
  const total = audioEntries.length;
  const count = [...selectedAudioIndexes].filter(i => audioEntries[i]).length;
  const all = $('#audio-select-all');
  if (all) {
    all.checked = total > 0 && count === total;
    all.indeterminate = count > 0 && count < total;
    all.disabled = total === 0 || audioConversionActive;
  }
  const counter = $('#audio-selection-count');
  if (counter) counter.textContent = count + (count === 1 ? ' seleccionado' : ' seleccionados');
  const btn = $('#convert-audio-btn');
  btn.disabled = !ffLoaded || count === 0 || audioConversionActive;
  btn.setAttribute('aria-disabled', String(btn.disabled));
  btn.textContent = audioConversionActive ? 'Convirtiendo lote…' : count > 1 ? 'Convertir ' + count + ' seleccionados' : 'Convertir seleccionado';
  const deleteBtn = $('#delete-selected-audio-btn');
  if (deleteBtn) {
    deleteBtn.disabled = count === 0 || audioConversionActive;
    deleteBtn.setAttribute('aria-disabled', String(deleteBtn.disabled));
    deleteBtn.textContent = count > 1 ? 'Eliminar ' + count + ' seleccionados' : count === 1 ? 'Eliminar seleccionado' : 'Eliminar seleccionados';
  }
}

function handleAudioFiles(fileList) {
  const files = Array.from(fileList).filter(f => f.type.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac|aac|wma)$/i.test(f.name));
  if (!files.length) return toast('No hay audios válidos','error');
  const offset = audioEntries.length;
  audioEntries.push(...files);
  files.forEach((_, i) => selectedAudioIndexes.add(offset + i));
  if (currentAudioIdx === -1) currentAudioIdx = 0;
  renderAudioList();
}

function renderAudioList() {
  const list = $('#audio-list');
  $('#audio-file-info').textContent = audioEntries.length ? audioEntries.length + ' archivo(s)' : 'Sin archivos';
  if (!audioEntries.length) {
    list.innerHTML = '<span style="color:var(--text-dim);font-size:12px">Sin archivos</span>';
    syncAudioUI();
    return;
  }
  list.innerHTML = audioEntries.map((f, i) => {
    const checked = selectedAudioIndexes.has(i);
    const focused = i === currentAudioIdx;
    const error = audioErrorMessages.get(f);
    return `<div class="audio-row ${checked ? 'is-checked' : ''} ${error ? 'has-error' : ''}" data-aidx="${i}" style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);border-radius:var(--radius-sm);font-size:12px;cursor:pointer;flex-wrap:wrap;${focused ? 'border:2px solid var(--pink);font-weight:600' : 'border:1px solid var(--border)'}">
      <input type="checkbox" class="audio-check" data-aidx="${i}" aria-label="Seleccionar ${escapeHtml(f.name)}" ${checked ? 'checked' : ''}>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">🎵 ${escapeHtml(f.name)}</span>
      <span style="color:var(--text-dim);font-family:var(--mono);white-space:nowrap">${fmtSize(f.size)}</span>
      <button type="button" class="audio-del-btn" data-aidx="${i}" aria-label="Eliminar ${escapeHtml(f.name)}" style="background:var(--red);color:#001018;border:none;border-radius:50%;width:24px;height:24px;font-size:12px;cursor:pointer;flex-shrink:0;line-height:1">✕</button>
      ${error ? `<span class="audio-error" role="status">⚠ ${escapeHtml(error)}</span>` : ''}
    </div>`;
  }).join('');

  list.querySelectorAll('.audio-row').forEach(row => row.addEventListener('click', e => {
    if (e.target.closest('.audio-check,.audio-del-btn')) return;
    currentAudioIdx = Number(row.dataset.aidx);
    renderAudioList();
  }));
  list.querySelectorAll('.audio-check').forEach(check => check.addEventListener('change', e => {
    e.stopPropagation();
    const idx = Number(check.dataset.aidx);
    if (check.checked) selectedAudioIndexes.add(idx); else selectedAudioIndexes.delete(idx);
    currentAudioIdx = idx;
    renderAudioList();
  }));
  list.querySelectorAll('.audio-del-btn').forEach(btn => btn.addEventListener('click', e => {
    e.stopPropagation();
    const idx = Number(btn.dataset.aidx);
    audioEntries.splice(idx, 1);
    const remapped = new Set();
    selectedAudioIndexes.forEach(value => { if (value < idx) remapped.add(value); else if (value > idx) remapped.add(value - 1); });
    selectedAudioIndexes = remapped;
    if (!audioEntries.length) currentAudioIdx = -1;
    else if (currentAudioIdx >= audioEntries.length) currentAudioIdx = audioEntries.length - 1;
    else if (currentAudioIdx > idx) currentAudioIdx--;
    renderAudioList();
  }));
  syncAudioUI();
}

$('#audio-select-all').addEventListener('change', e => {
  selectedAudioIndexes = e.target.checked ? new Set(audioEntries.map((_, i) => i)) : new Set();
  renderAudioList();
});

function removeSelectedAudios() {
  const selected = [...selectedAudioIndexes].filter(index => audioEntries[index]).sort((a, b) => a - b);
  if (!selected.length) return toast('Selecciona al menos un audio para eliminar', 'error');
  const currentFile = audioEntries[currentAudioIdx];
  const selectedFiles = new Set(selected.map(index => audioEntries[index]));
  audioEntries = audioEntries.filter(file => !selectedFiles.has(file));
  selectedAudioIndexes = new Set();
  currentAudioIdx = audioEntries.length ? Math.max(0, audioEntries.indexOf(currentFile)) : -1;
  renderAudioList();
  toast(selected.length === 1 ? 'Audio eliminado de la lista' : selected.length + ' audios eliminados de la lista', 'success');
}

$('#delete-selected-audio-btn').addEventListener('click', () => {
  if (!audioConversionActive) removeSelectedAudios();
});

function uniqueAudioName(file, fmt, used) {
  const base = file.name.replace(/\.[^.]+$/, '') || 'audio';
  let name = base + '.' + fmt;
  let suffix = 2;
  while (used.has(name.toLowerCase())) name = base + '-' + suffix++ + '.' + fmt;
  used.add(name.toLowerCase());
  return name;
}

async function convertAudioFile(file, fmt, qual, token) {
  const ext = (file.name.match(/\.[^.]+$/) || ['.audio'])[0].toLowerCase();
  const input = 'audio-input-' + token + ext;
  const output = 'audio-output-' + token + '.' + fmt;
  try {
    await ffmpeg.writeFile(input, new Uint8Array(await file.arrayBuffer()));
    const args = ['-i', input];
    if (!['wav','flac'].includes(fmt)) args.push('-b:a', qual);
    args.push(output);
    await ffmpeg.exec(args);
    const data = await ffmpeg.readFile(output);
    return new Uint8Array(data);
  } finally {
    try { await ffmpeg.deleteFile(input); } catch (_) {}
    try { await ffmpeg.deleteFile(output); } catch (_) {}
  }
}

function describeAudioFailure(error) {
  const message = String(error?.message || '').toLowerCase();
  if (/invalid data|not a valid|could not find|moov atom|demux|decode/.test(message)) return 'Archivo dañado o formato no compatible';
  if (/encoder|codec|unknown format|unsupported/.test(message)) return 'Este formato de salida no es compatible';
  return 'No se pudo convertir este archivo';
}

function removeConvertedAudios(converted) {
  if (!converted.size) return;
  const previouslySelected = new Set([...selectedAudioIndexes].map(index => audioEntries[index]));
  const currentFile = audioEntries[currentAudioIdx];
  audioEntries = audioEntries.filter(file => !converted.has(file));
  selectedAudioIndexes = new Set(audioEntries.flatMap((file, index) => previouslySelected.has(file) ? [index] : []));
  currentAudioIdx = audioEntries.length ? Math.max(0, audioEntries.indexOf(currentFile)) : -1;
  renderAudioList();
}

$('#convert-audio-btn').addEventListener('click', async () => {
  const selected = [...selectedAudioIndexes].filter(i => audioEntries[i]).sort((a,b) => a-b);
  if (!selected.length) return toast('Selecciona al menos un audio','error');
  if (!ffmpeg || !ffLoaded) return toast('El motor multimedia aún no está listo','error');
  const fmt = $('#convert-audio-format').value;
  const qual = $('#convert-audio-quality').value;
  const pg = $('#audio-progress'), fl = $('#audio-progress-fill'), tx = $('#audio-progress-text');
  const files = {}, usedNames = new Set(), failures = [], converted = new Set();
  let position = 0;
  audioConversionActive = true;
  syncAudioUI();
  pg.style.display = '';
  fl.style.width = '0%';
  const progressHandler = ({progress}) => {
    const overall = Math.min(99, Math.round(((position + Math.max(0, progress)) / selected.length) * 100));
    fl.style.width = overall + '%';
  };
  ffmpeg.on('progress', progressHandler);
  try {
    for (position = 0; position < selected.length; position++) {
      const file = audioEntries[selected[position]];
      tx.textContent = 'Convirtiendo ' + (position + 1) + ' de ' + selected.length + ': ' + file.name;
      try {
        const data = await convertAudioFile(file, fmt, qual, Date.now() + '-' + position);
        files[uniqueAudioName(file, fmt, usedNames)] = data;
        converted.add(file);
        audioErrorMessages.delete(file);
      } catch (error) {
        const reason = describeAudioFailure(error);
        audioErrorMessages.set(file, reason);
        failures.push({ file, reason });
      }
    }
    const names = Object.keys(files);
    if (!names.length) {
      fl.style.width = '100%';
      tx.textContent = 'Ningún archivo se pudo convertir';
      renderAudioList();
      toast('Los archivos con error siguen en la lista','error');
      return;
    }
    if (names.length === 1) {
      const mimeMap = {mp3:'audio/mpeg',wav:'audio/wav',ogg:'audio/ogg',m4a:'audio/mp4',flac:'audio/flac'};
      downloadBlob(new Blob([files[names[0]]], {type:mimeMap[fmt] || 'application/octet-stream'}), names[0]);
    } else {
      tx.textContent = 'Preparando ZIP…';
      const { zipSync } = await import('./vendor/fflate.js');
      const zip = zipSync(files, { level: 0 });
      downloadBlob(new Blob([zip], {type:'application/zip'}), 'audios_convertidos_' + fmt + '.zip');
    }
    removeConvertedAudios(converted);
    fl.style.width = '100%';
    const remaining = audioEntries.length;
    tx.textContent = failures.length ? names.length + ' convertidos · ' + remaining + ' con error en la lista' : names.length + ' archivos convertidos';
    $('#audio-result').innerHTML = '<p style="font-size:12px;color:var(--green)">✓ ' + names.length + ' archivo(s) convertidos a ' + escapeHtml(fmt.toUpperCase()) + (failures.length ? ' · Los ' + failures.length + ' que fallaron permanecen señalados en la lista' : '') + '</p>';
    toast(failures.length ? names.length + ' convertidos; ' + failures.length + ' con error siguen en la lista' : 'Lote convertido correctamente', failures.length ? 'error' : 'success');
  } catch (_) {
    tx.textContent = 'No se pudo completar el lote';
    renderAudioList();
    toast('No se pudo preparar la descarga; la lista se conserva','error');
  } finally {
    try { ffmpeg.off('progress', progressHandler); } catch (_) {}
    audioConversionActive = false;
    syncAudioUI();
  }
});

/* Init */
loadFFmpeg();
</script>
</body>
</html>
