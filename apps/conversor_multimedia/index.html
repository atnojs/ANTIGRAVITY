<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multimedia Converter Pro</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>🔄</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --pink:#e91e63;
  --pink-light:rgba(233,30,99,0.08);
  --pink-glow:rgba(233,30,99,0.25);
  --bg:#fafafa;
  --card-bg:#fff;
  --border:#e0e0e0;
  --text:#222;
  --text-dim:#777;
  --green:#2e7d32;
  --radius:8px;
  --radius-sm:6px;
  --font:'Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'Cascadia Code','JetBrains Mono','Consolas',monospace
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.4}
body{padding:16px;max-width:1100px;margin:0 auto}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#eee}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}

/* Header */
.app-header{text-align:center;padding:8px 0 14px}
.app-header h1{font-size:20px;color:var(--text);letter-spacing:-0.3px}
.app-header p{font-size:11px;color:var(--text-dim);margin-top:1px}

/* Top buttons */
.top-buttons{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.top-btn{flex:1;min-width:140px;padding:12px 16px;border:2px solid var(--pink);border-radius:var(--radius);background:var(--card-bg);color:var(--text);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;transition:.2s;text-align:center}
.top-btn:hover{background:var(--pink-light)}
.top-btn.active{background:var(--pink);color:#fff}

/* Cards */
.card{background:var(--card-bg);border:2px solid var(--pink);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.card-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin-bottom:10px;text-align:center}

/* Upload zone */
.upload-zone{border:2px dashed var(--pink);border-radius:var(--radius);padding:24px 16px;text-align:center;cursor:pointer;transition:.2s;background:var(--card-bg)}
.upload-zone:hover,.upload-zone.dragover{background:var(--pink-light);border-style:solid}
.upload-zone-icon{font-size:28px;margin-bottom:4px}
.upload-zone-text{font-size:13px;color:var(--text-dim)}
.upload-zone-text strong{color:var(--pink)}

/* Two columns */
.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media(max-width:700px){.columns{grid-template-columns:1fr}}

/* Format bar */
.format-bar{display:flex;align-items:center;gap:8px;background:var(--bg);border:2px solid var(--pink);border-radius:var(--radius);padding:6px 10px;margin-bottom:10px}
.format-bar select{border:none;background:transparent;font-weight:700;font-size:13px;color:var(--pink);outline:none;cursor:pointer;padding:4px}
.format-bar input[type=range]{flex:1;min-width:60px;border:none;outline:none}
.format-bar .bar-pct{font-size:11px;color:var(--text-dim);min-width:32px;text-align:right;font-weight:600}
.format-bar .bar-btn{background:var(--pink);color:#fff;border:none;padding:6px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.2s}
.format-bar .bar-btn:hover{background:#c2185b;box-shadow:0 2px 8px var(--pink-glow)}

/* Image grids */
.img-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(max-width:400px){.img-grid{grid-template-columns:1fr}}
.img-grid-item{border:2px solid var(--pink);border-radius:var(--radius-sm);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;background:var(--bg);overflow:hidden;position:relative}
.img-grid-item img{width:100%;height:100%;object-fit:contain}
.img-grid-item .grid-placeholder{color:var(--text-dim);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px}

/* Below grid image: actions */
.img-grid-actions{display:flex;gap:4px;margin-top:4px;justify-content:center}
.img-grid-actions .btn-xs{padding:4px 10px;font-size:11px;border-radius:var(--radius-sm);cursor:pointer;font-weight:600;border:1px solid var(--pink);transition:.2s}
.img-grid-actions .btn-xs.dl-btn{background:var(--pink);color:#fff}
.img-grid-actions .btn-xs.dl-btn:hover{background:#c2185b}
.img-grid-actions .btn-xs.compress-btn{background:var(--card-bg);color:var(--pink)}
.img-grid-actions .btn-xs.compress-btn:hover{background:var(--pink-light)}

.img-grid-item.compressed{border-color:#4caf50;box-shadow:0 0 8px rgba(76,175,80,.2)}

/* Editor (above columns) */
.editor-row{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.editor-preview{flex:1;min-width:280px;text-align:center;position:relative}
.editor-preview .resize-container{position:relative;display:inline-block;line-height:0}
.editor-preview img{max-width:100%;max-height:35vh;border-radius:var(--radius-sm);box-shadow:0 2px 12px rgba(0,0,0,.08);display:block;user-select:none;-webkit-user-drag:none;border:2px solid var(--border)}
.editor-preview .resize-handle{position:absolute;width:14px;height:14px;background:var(--pink);border:2px solid #fff;border-radius:50%;box-shadow:0 0 8px var(--pink-glow);z-index:10;transition:transform .15s}
.editor-preview .resize-handle:hover{transform:scale(1.3)}
.editor-preview .resize-handle[data-corner=se]{bottom:-7px;right:-7px;cursor:nwse-resize}
.editor-preview .resize-handle[data-corner=sw]{bottom:-7px;left:-7px;cursor:nesw-resize}
.editor-preview .resize-handle[data-corner=ne]{top:-7px;right:-7px;cursor:nesw-resize}
.editor-preview .resize-handle[data-corner=nw]{top:-7px;left:-7px;cursor:nwse-resize}

/* Info bar */
.info-bar{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;padding:6px 10px;background:var(--bg);border-radius:var(--radius-sm);font-family:var(--mono);font-size:11px;margin-top:4px}
.info-bar .info-item{display:flex;align-items:center;gap:3px}
.info-bar .info-label{color:var(--text-dim)}
.info-bar .info-value{color:var(--pink);font-weight:600}

/* Quick actions */
.quick-actions{display:flex;flex-wrap:wrap;gap:5px;padding:4px 0;justify-content:center}
.quick-actions .btn-sm{padding:5px 12px;font-size:11px;font-weight:600;border-radius:var(--radius-sm);cursor:pointer;transition:.2s;border:1px solid var(--pink);background:var(--card-bg);color:var(--pink)}
.quick-actions .btn-sm:hover{background:var(--pink-light)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 16px;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;transition:.2s;text-decoration:none}
.btn-primary{background:var(--pink);color:#fff}
.btn-primary:hover{background:#c2185b;box-shadow:0 2px 8px var(--pink-glow)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn-sm{padding:5px 12px;font-size:12px}

/* Video/audio card */
.media-card{background:var(--card-bg);border:2px solid var(--pink);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.media-card .preview-area video{max-width:100%;max-height:40vh;border-radius:var(--radius-sm);border:2px solid var(--border)}
.media-card .controls-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0}

/* progress */
.progress-bar{width:100%;height:4px;background:#eee;border-radius:2px;overflow:hidden;margin-top:6px}
.progress-bar-fill{height:100%;background:var(--pink);border-radius:2px;transition:width .2s;width:0%}
.progress-text{font-size:10px;color:var(--text-dim);margin-top:2px;text-align:center}

/* toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--pink);border-radius:var(--radius);padding:10px 20px;font-size:13px;z-index:999;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.toast.show{opacity:1}
.toast.success{border-color:#4caf50}
.toast.error{border-color:#f44336}

.spinner{display:inline-block;width:14px;height:14px;border:2px solid #eee;border-top-color:var(--pink);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600}
.badge.loading{background:rgba(255,152,0,.1);color:#e65100}
.badge.ready{background:rgba(76,175,80,.1);color:var(--green)}
.badge.error{background:rgba(244,67,54,.1);color:#c62828}

.section-divider{border:none;border-top:1px solid var(--border);margin:10px 0}
</style>
</head>
<body>

<div class="app-header">
  <h1>Multimedia Converter Pro</h1>
  <p>Cambia formatos, reduce peso, redimensiona — todo en tu navegador</p>
</div>

<!-- Top buttons -->
<div class="top-buttons">
  <button class="top-btn active" id="mode-images">SUBIR IMÁGENES</button>
  <button class="top-btn" id="mode-video">SUBIR VÍDEOS</button>
  <button class="top-btn" id="mode-audio">SUBIR AUDIOS</button>
</div>

<!-- Upload zone -->
<div class="card" id="upload-card">
  <div class="upload-zone" id="main-upload-zone">
    <div class="upload-zone-icon">📁</div>
    <div class="upload-zone-text">Arrastra archivos aquí o <strong>haz clic</strong></div>
  </div>
  <input type="file" id="img-input" multiple accept="image/*" hidden>
  <input type="file" id="video-input" accept="video/*" hidden>
  <input type="file" id="audio-input" accept="audio/*" multiple hidden>
</div>

<!-- ====== IMAGES MODE ====== -->
<div id="mode-images-pane">

  <!-- Two columns -->
  <div class="columns">
    <!-- LEFT: Convertir Formato -->
    <div class="card">
      <div class="card-title">Convertir formato</div>
      <div class="format-bar">
        <select id="convert-img-format">
          <option value="image/webp" selected>Webp</option>
          <option value="image/png">PNG</option>
          <option value="image/jpeg">JPEG</option>
          <option value="image/avif">AVIF</option>
          <option value="image/bmp">BMP</option>
          <option value="image/gif">GIF</option>
        </select>
        <input type="range" id="convert-img-quality" min="10" max="100" value="90">
        <span class="bar-pct" id="convert-quality-label">90%</span>
        <button class="bar-btn" id="convert-img-btn">Convertir</button>
      </div>
      <div class="img-grid" id="uploaded-img-grid"></div>
    </div>

    <!-- RIGHT: Imágenes Generadas -->
    <div class="card">
      <div class="card-title">Imágenes generadas</div>
      <div class="img-grid" id="convert-results-grid"></div>
      <div id="convert-results-actions" style="display:none"></div>
    </div>
  </div>
</div>

<!-- ====== VIDEO MODE ====== -->
<div id="mode-video-pane" style="display:none">
  <div class="media-card">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span id="ff-video-status" class="badge loading">⏳ FFmpeg…</span>
    </div>
    <div class="preview-area"><video id="video-preview" controls></video></div>
    <div class="controls-row">
      <label style="font-size:12px;color:var(--text-dim);font-weight:600">Convertir a:</label>
      <select id="convert-video-format" style="border:1px solid var(--pink);border-radius:var(--radius-sm);padding:5px 10px">
        <option value="mp4">MP4</option><option value="webm">WebM</option>
        <option value="avi">AVI</option><option value="mov">MOV</option><option value="gif">GIF</option>
      </select>
      <button class="btn btn-primary btn-sm" id="convert-video-btn" disabled>Convertir</button>
    </div>
    <div id="video-progress" style="display:none">
      <div class="progress-bar"><div class="progress-bar-fill" id="video-progress-fill"></div></div>
      <div class="progress-text" id="video-progress-text">0%</div>
    </div>
    <div id="video-result" style="margin-top:8px"></div>
  </div>
</div>

<!-- ====== AUDIO MODE ====== -->
<div id="mode-audio-pane" style="display:none">
  <div class="media-card">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span id="ff-audio-status" class="badge loading">⏳ FFmpeg…</span>
    </div>
    <div style="margin-bottom:8px"><span style="font-size:13px;color:var(--text-dim)" id="audio-file-info">Sin archivos</span></div>
    <!-- Lista de audios subidos -->
    <div id="audio-list" style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px"></div>
    <div class="controls-row">
      <label style="font-size:12px;color:var(--text-dim);font-weight:600">A:</label>
      <select id="convert-audio-format" style="border:1px solid var(--pink);border-radius:var(--radius-sm);padding:5px 10px">
        <option value="mp3">MP3</option><option value="wav">WAV</option>
        <option value="ogg">OGG</option><option value="m4a">M4A</option><option value="flac">FLAC</option>
      </select>
      <label style="font-size:12px;color:var(--text-dim);font-weight:600;margin-left:4px">Calidad:</label>
      <select id="convert-audio-quality" style="border:1px solid var(--pink);border-radius:var(--radius-sm);padding:5px 10px">
        <option value="128k">128k</option><option value="192k" selected>192k</option>
        <option value="256k">256k</option><option value="320k">320k</option>
      </select>
      <button class="btn btn-primary btn-sm" id="convert-audio-btn" disabled>Convertir</button>
    </div>
    <div id="audio-progress" style="display:none">
      <div class="progress-bar"><div class="progress-bar-fill" id="audio-progress-fill"></div></div>
      <div class="progress-text" id="audio-progress-text">0%</div>
    </div>
    <div id="audio-result" style="margin-top:8px"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>

<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function toast(msg, type='success') {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show '+type;
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 3000);
}
function fmtSize(bytes) {
  if (!bytes || bytes === 0) return '—';
  if (bytes < 1024) return bytes+' B';
  if (bytes < 1048576) return (bytes/1024).toFixed(1)+' KB';
  return (bytes/1048576).toFixed(2)+' MB';
}
function extFromMime(mime) {
  return ({'image/png':'png','image/jpeg':'jpg','image/webp':'webp',
    'image/bmp':'bmp','image/gif':'gif','image/avif':'avif'}[mime] || 'bin');
}
function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = reject;
    r.readAsDataURL(file);
  });
}

const procCanvas = document.createElement('canvas');
const procCtx = procCanvas.getContext('2d');

/* ============================================================ */
/*  MODE SWITCHING                                               */
/* ============================================================ */
let currentMode = 'images';
const modes = ['images','video','audio'];

$$('.top-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('.top-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const mode = btn.id.replace('mode-','');
    currentMode = mode;
    modes.forEach(m => {
      const pane = $(`#mode-${m}-pane`);
      if (pane) pane.style.display = m === mode ? '' : 'none';
    });
    // Update file input accept
    if (mode === 'images') {
      $('#img-input').accept = 'image/*';
      $('#main-upload-zone').querySelector('.upload-zone-text').innerHTML = 'Arrastra imágenes aquí o <strong>haz clic</strong>';
    } else if (mode === 'video') {
      $('#main-upload-zone').querySelector('.upload-zone-text').innerHTML = 'Arrastra un vídeo aquí o <strong>haz clic</strong>';
      if (!ffLoaded) loadFFmpeg();
    } else {
      $('#main-upload-zone').querySelector('.upload-zone-text').innerHTML = 'Arrastra audios aquí o <strong>haz clic</strong>';
      if (!ffLoaded) loadFFmpeg();
    }
  });
});

/* ============================================================ */
/*  FFMPEG                                                       */
/* ============================================================ */
let ffmpeg = null, ffLoaded = false;

async function loadFFmpeg() {
  if (ffLoaded) return true;
  setFFStatus('loading','⏳ FFmpeg…');
  try {
    // Precargar worker como blob (evita CORS cross-origin en Hostinger)
    const wkResp = await fetch('https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/worker.js');
    const wkCode = await wkResp.text();
    const wkBlob = new Blob([wkCode], { type: 'application/javascript' });
    const wkBlobURL = URL.createObjectURL(wkBlob);

    // Parchear Worker para redirigir el worker de FFmpeg a blob local
    const RealWorker = window.Worker;
    window.Worker = function(url, opts) {
      const urlStr = (url instanceof URL) ? url.href : String(url);
      if (urlStr.includes('ffmpeg') && urlStr.includes('worker')) {
        return new RealWorker(wkBlobURL, opts);
      }
      return new RealWorker(url, opts);
    };
    window.Worker.prototype = RealWorker.prototype;

    const mod = await import('https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js');
    const { FFmpeg } = mod;
    const { toBlobURL } = await import('https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js');
    ffmpeg = new FFmpeg();
    await ffmpeg.load({
      coreURL: await toBlobURL('https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm/ffmpeg-core.js','text/javascript'),
      wasmURL: await toBlobURL('https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm/ffmpeg-core.wasm','application/wasm'),
    });
    ffLoaded = true; setFFStatus('ready','✓ FFmpeg listo');
    $('#convert-video-btn').disabled = false;
    $('#convert-audio-btn').disabled = false;
    return true;
  } catch(e) {
    console.warn('FFmpeg:', e.message);
    setFFStatus('error','✗ No disponible'); return false;
  }
}
function setFFStatus(type, text) {
  ['video','audio'].forEach(t => {
    const el = $(`#ff-${t}-status`); if (el) { el.className = 'badge '+type; el.textContent = text; }
  });
}

/* ============================================================ */
/*  UPLOAD ZONE                                                  */
/* ============================================================ */
const mainZone = $('#main-upload-zone');
mainZone.addEventListener('click', () => {
  if (currentMode === 'images') $('#img-input').click();
  else if (currentMode === 'video') $('#video-input').click();
  else $('#audio-input').click();
});
mainZone.addEventListener('dragover', e => { e.preventDefault(); mainZone.classList.add('dragover'); });
mainZone.addEventListener('dragleave', () => mainZone.classList.remove('dragover'));
mainZone.addEventListener('drop', e => {
  e.preventDefault(); mainZone.classList.remove('dragover');
  const files = e.dataTransfer.files;
  if (currentMode === 'images') handleImageFiles(files);
  else if (currentMode === 'video' && files[0]?.type.startsWith('video/')) loadVideo(files[0]);
  else if (currentMode === 'audio') handleAudioFiles(files);
});
$('#img-input').addEventListener('change', () => { if ($('#img-input').files.length) handleImageFiles($('#img-input').files); });
$('#video-input').addEventListener('change', () => { if ($('#video-input').files[0]) loadVideo($('#video-input').files[0]); });
$('#audio-input').addEventListener('change', () => { if ($('#audio-input').files.length) handleAudioFiles($('#audio-input').files); });

/* ============================================================ */
/*  IMÁGENES — STATE                                             */
/* ============================================================ */
let imgEntries = [];
let currentIdx = -1;

async function handleImageFiles(fileList) {
  const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
  if (!files.length) return toast('No hay imágenes','error');
  const newEntries = [];
  for (const file of files) {
    newEntries.push({ file, dataUrl: await fileToDataURL(file) });
  }
  imgEntries = imgEntries.concat(newEntries);
  if (currentIdx === -1) { currentIdx = 0; }
  renderUploadedGrid();
}

/* Right column: uploaded images grid */
function renderUploadedGrid() {
  const grid = $('#uploaded-img-grid');
  const items = [];
  for (let i = 0; i < imgEntries.length; i++) {
    items.push(`
      <div class="img-grid-item" data-idx="${i}" style="cursor:pointer${i === currentIdx ? ';border-color:#111;box-shadow:0 0 10px rgba(233,30,99,.5)' : ''}">
        <img src="${imgEntries[i].dataUrl}" alt="">
      </div>`);
  }
  if (!items.length) {
    items.push('<div class="img-grid-item"><span class="grid-placeholder">SIN IMÁGENES</span></div>');
  }
  grid.innerHTML = items.join('');

  grid.querySelectorAll('.img-grid-item img').forEach(img => {
    const idx = parseInt(img.parentElement.dataset.idx);
    img.parentElement.addEventListener('click', () => {
      currentIdx = idx;
      // Auto-detectar formato
      const entry = imgEntries[idx];
      const ext = (entry.file.name.match(/\.([^.]+)$/i) || [,'jpg'])[1].toLowerCase();
      const mimeByExt = { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', webp:'image/webp', bmp:'image/bmp', gif:'image/gif', avif:'image/avif' };
      const detected = mimeByExt[ext];
      if (detected) $('#convert-img-format').value = detected;
      renderUploadedGrid();
    });
    if (idx === currentIdx) img.parentElement.style.borderColor = '#c2185b';
  });
}

/* Convertir formato */
$('#convert-img-quality').addEventListener('input', () => {
  $('#convert-quality-label').textContent = $('#convert-img-quality').value + '%';
});

$('#convert-img-btn').addEventListener('click', async () => {
  if (currentIdx === -1) return toast('Selecciona una imagen primero','error');
  const entry = imgEntries[currentIdx];
  const mime = $('#convert-img-format').value;
  const quality = parseInt($('#convert-img-quality').value) / 100;
  const ext = extFromMime(mime);

  // Detectar formato actual de la imagen
  const imgExt = (entry.file.name.match(/\.([^.]+)$/i) || [,'jpg'])[1].toLowerCase();
  const mimeByExt = { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', webp:'image/webp', bmp:'image/bmp', gif:'image/gif', avif:'image/avif' };
  if (mimeByExt[imgExt] === mime) return toast('El formato es el mismo que tiene la imagen','error');

  // Cargar dimensiones originales
  const img = new Image(); img.src = entry.dataUrl;
  await new Promise(r => { img.onload = r; });
  const w = img.naturalWidth, h = img.naturalHeight;

  procCanvas.width = w; procCanvas.height = h;
  procCtx.drawImage(img, 0, 0, w, h);

  const blob = await new Promise(r => procCanvas.toBlob(r, mime, quality));
  if (!blob) return toast('Error al convertir','error');

  const name = entry.file.name.replace(/\.[^.]+$/, '') + '.' + ext;
  addConvertResult(blob, name, procCanvas.toDataURL(mime, quality));
});

/* Add result to left grid */
let convertResults = []; // {blob, name, dataUrl}

function addConvertResult(blob, name, dataUrl) {
  // Store result
  const result = { blob, name, dataUrl };
  convertResults.unshift(result);
  if (convertResults.length > 4) convertResults.length = 4;
  renderConvertGrid();
  toast(`Generado: ${name} (${fmtSize(blob.size)})`);
}

function renderConvertGrid() {
  const grid = $('#convert-results-grid');
  const actions = $('#convert-results-actions');

  const items = [];
  const max = Math.max(convertResults.length, 0);
  for (let i = 0; i < max; i++) {
    const r = convertResults[i];
    items.push(`
      <div class="img-grid-item" data-ridx="${i}">
        <img src="${r.dataUrl}" alt="">
        <div class="img-grid-actions" style="position:absolute;bottom:4px;left:50%;transform:translateX(-50%)">
          <button class="btn-xs dl-btn" data-ridx="${i}" data-action="dl">Descargar</button>
          <button class="btn-xs compress-btn" data-ridx="${i}" data-action="compress">60KB</button>
        </div>
      </div>`);
  }
  if (!items.length) {
    items.push('<div class="img-grid-item"><span class="grid-placeholder">SIN IMÁGENES</span></div>');
  }
  grid.innerHTML = items.join('');
  actions.style.display = convertResults.length ? '' : 'none';

  // Wire buttons
  grid.querySelectorAll('[data-action="dl"]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.ridx);
      const r = convertResults[idx];
      downloadBlob(r.blob, r.name);
      toast(`Descargado: ${r.name}`);
    });
  });

  grid.querySelectorAll('[data-action="compress"]').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.ridx);
      const r = convertResults[idx];
      const compressBtn = btn;
      compressBtn.textContent = '…';
      compressBtn.disabled = true;

      try {
        // Detect format
        const origExt = (r.name.match(/\.[^.]+$/i) || ['.jpg'])[0].toLowerCase().replace('.','');
        const fmtMap = {jpg:['image/jpeg','jpg'],jpeg:['image/jpeg','jpg'],webp:['image/webp','webp'],avif:['image/avif','avif'],png:['image/png','png'],bmp:['image/bmp','bmp'],gif:['image/gif','gif']};
        const [compressMime, outExt] = fmtMap[origExt] || ['image/png','png'];

        const img = new Image();
        await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = r.dataUrl; });

        let cw = img.naturalWidth, ch = img.naturalHeight;
        // Reducir dimensiones si es enorme
        if (cw > 4000 || ch > 4000) {
          const scale = 4000 / Math.max(cw, ch);
          cw = Math.round(cw * scale); ch = Math.round(ch * scale);
        }

        // Suelo de calidad por formato (no degradar de más)
        const qFloor = { jpg:0.3, jpeg:0.3, webp:0.01, avif:0.01, png:0.5, bmp:0.5, gif:0.5 };
        const minQ = qFloor[origExt] || 0.3;
        const isLossless = ['png','bmp','gif'].includes(origExt);

        let best = null, bestLo = minQ;
        // Reducir dimensiones progresivamente si no cabe en 60KB
        for (let round = 0; round < 6; round++) {
          procCanvas.width = cw; procCanvas.height = ch;
          procCtx.drawImage(img, 0, 0, cw, ch);

          let lo = minQ, hi = 1.0;
          for (let i = 0; i < 10; i++) {
            const mid = (lo + hi) / 2;
            const b = await new Promise(res => procCanvas.toBlob(res, compressMime, mid));
            if (!b) break;
            if (b.size / 1024 > 60) { hi = mid; }
            else { lo = mid; best = b; bestLo = mid; }
          }
          if (best && best.size / 1024 <= 60) break;
          // Reducir dimensiones: WebP/AVIF más agresivo, JPEG/PNG moderado
          const factor = (origExt === 'webp' || origExt === 'avif') ? 0.55 : 0.78;
          cw = Math.max(80, Math.round(cw * factor));
          ch = Math.max(80, Math.round(ch * factor));
        }
        // Si no llega, forzar la mínima calidad posible sin degradar más dimensiones
        if (!best || best.size / 1024 > 60) {
          procCanvas.width = cw; procCanvas.height = ch;
          procCtx.drawImage(img, 0, 0, cw, ch);
          best = await new Promise(res => procCanvas.toBlob(res, compressMime, minQ));
          bestLo = minQ;
        }
        if (!best) return toast('Error al comprimir','error');

        const newDataUrl = procCanvas.toDataURL(compressMime, bestLo);
        const newName = r.name.replace(/\.[^.]+$/i, '') + '_60kb.' + outExt;

        // Update result
        r.blob = best;
        r.name = newName;
        r.dataUrl = newDataUrl;
        renderConvertGrid();
        toast(`Comprimido: ${newName} (${fmtSize(best.size)})`);
      } catch(e) {
        console.error(e); toast('Error al comprimir','error');
        compressBtn.textContent = '60KB'; compressBtn.disabled = false;
      }
    });
  });
}

/* ============================================================ */
/*  VÍDEO                                                        */
/* ============================================================ */
let videoFile = null;

function loadVideo(file) {
  videoFile = file;
  try { $('#video-preview').src = URL.createObjectURL(file); } catch(e) {}
  if (ffLoaded) $('#convert-video-btn').disabled = false;
  toast(`Vídeo: ${file.name} (${fmtSize(file.size)})`);
}

$('#convert-video-btn').addEventListener('click', async () => {
  if (!videoFile || !ffmpeg) return toast('FFmpeg no disponible','error');
  const fmt = $('#convert-video-format').value;
  const btn = $('#convert-video-btn'), pg = $('#video-progress'),
    fl = $('#video-progress-fill'), tx = $('#video-progress-text');
  btn.disabled = true; btn.textContent = 'Convirtiendo…';
  pg.style.display = ''; fl.style.width = '0%'; tx.textContent = '0%';
  ffmpeg.on('progress', ({progress:p}) => {
    const pc = Math.min(Math.round(p*100),99);
    fl.style.width = pc+'%'; tx.textContent = pc+'%';
  });
  try {
    const ext = (videoFile.name.match(/\.[^.]+$/) || ['.mp4'])[0];
    const inp = 'input'+ext, out = 'output.'+fmt;
    ffmpeg.writeFile(inp, new Uint8Array(await videoFile.arrayBuffer()));
    const args = ['-i', inp];
    if (fmt === 'gif') args.push('-vf','fps=10,scale=480:-1:flags=lanczos','-loop','0');
    args.push(out);
    await ffmpeg.exec(args);
    fl.style.width = '100%'; tx.textContent = '100%';
    const data = ffmpeg.readFile(out);
    const mimeMap = {mp4:'video/mp4',webm:'video/webm',avi:'video/x-msvideo',mov:'video/quicktime',gif:'image/gif'};
    const blob = new Blob([data.buffer], {type: mimeMap[fmt]||'video/mp4'});
    const oname = videoFile.name.replace(/\.[^.]+$/,'')+'.'+fmt;
    downloadBlob(blob, oname);
    ffmpeg.deleteFile(inp); ffmpeg.deleteFile(out);
    $('#video-result').innerHTML = `<p style="font-size:12px;color:var(--green)">✓ ${oname} — ${fmtSize(blob.size)}</p>`;
    toast(`Convertido: ${oname}`);
  } catch(e) { console.error(e); toast('Error','error'); }
  btn.disabled = false; btn.textContent = 'Convertir';
  ffmpeg.off('progress');
});

/* ============================================================ */
/*  AUDIO                                                        */
/* ============================================================ */
let audioEntries = [];
let currentAudioIdx = -1;

function handleAudioFiles(fileList) {
  const files = [];
  for (let i = 0; i < fileList.length; i++) {
    const f = fileList[i];
    if (f.type.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac|aac|wma)$/i.test(f.name)) {
      files.push(f);
    }
  }
  if (!files.length) return toast('No hay audios válidos','error');
  audioEntries = audioEntries.concat(files);
  if (currentAudioIdx === -1) currentAudioIdx = 0;
  if (ffLoaded) $('#convert-audio-btn').disabled = false;
  renderAudioList();
  $('#audio-file-info').textContent = audioEntries.length + ' archivo(s)';
}

function renderAudioList() {
  const list = $('#audio-list');
  if (!list) return;
  if (!audioEntries.length) {
    list.innerHTML = '<span style="color:var(--text-dim);font-size:12px">Sin archivos</span>';
    return;
  }

  let html = '';
  for (let i = 0; i < audioEntries.length; i++) {
    const f = audioEntries[i];
    const sel = i === currentAudioIdx;
    html += `
      <div class="audio-row" data-aidx="${i}" style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);border-radius:var(--radius-sm);font-size:12px;cursor:pointer;${sel ? 'border:2px solid var(--pink);font-weight:600' : 'border:1px solid var(--border)'}">
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">🎵 ${f.name}</span>
        <span style="color:var(--text-dim);font-family:var(--mono);white-space:nowrap">${fmtSize(f.size)}</span>
        <button class="audio-del-btn" data-aidx="${i}" style="background:var(--red);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer;flex-shrink:0;line-height:1">✕</button>
      </div>`;
  }
  list.innerHTML = html;

  // Click en fila → seleccionar
  list.querySelectorAll('.audio-row').forEach(row => {
    row.addEventListener('click', e => {
      if (e.target.classList.contains('audio-del-btn')) return; // no seleccionar si clic en ✕
      currentAudioIdx = parseInt(row.dataset.aidx);
      if (ffLoaded) $('#convert-audio-btn').disabled = false;
      renderAudioList();
    });
  });

  // Botón eliminar
  list.querySelectorAll('.audio-del-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.aidx);
      audioEntries.splice(idx, 1);
      if (!audioEntries.length) { currentAudioIdx = -1; $('#convert-audio-btn').disabled = true; }
      else if (currentAudioIdx >= audioEntries.length) currentAudioIdx = audioEntries.length - 1;
      else if (currentAudioIdx > idx) currentAudioIdx--;
      $('#audio-file-info').textContent = audioEntries.length ? audioEntries.length + ' archivo(s)' : 'Sin archivos';
      renderAudioList();
    });
  });
}

$('#convert-audio-btn').addEventListener('click', async () => {
  if (currentAudioIdx === -1 || !audioEntries[currentAudioIdx]) return toast('Selecciona un audio','error');
  if (!ffmpeg || !ffLoaded) return toast('FFmpeg no disponible. Prueba desde localhost.','error');
  const file = audioEntries[currentAudioIdx];
  const fmt = $('#convert-audio-format').value;
  const qual = $('#convert-audio-quality').value;
  const btn = $('#convert-audio-btn');
  const pg = $('#audio-progress');
  const fl = $('#audio-progress-fill');
  const tx = $('#audio-progress-text');

  btn.disabled = true; btn.textContent = 'Convirtiendo…';
  pg.style.display = ''; fl.style.width = '0%'; tx.textContent = '0%';

  ffmpeg.on('progress', function onProg({ progress: p }) {
    const pc = Math.min(99, Math.round(p * 100));
    fl.style.width = pc + '%'; tx.textContent = pc + '%';
  });

  try {
    const ext = (file.name.match(/\.[^.]+$/) || ['.mp3'])[0];
    const inp = 'input' + ext;
    const out = 'output.' + fmt;
    const buf = await file.arrayBuffer();
    ffmpeg.writeFile(inp, new Uint8Array(buf));
    await ffmpeg.exec(['-i', inp, '-b:a', qual, out]);
    fl.style.width = '100%'; tx.textContent = '100%';
    const data = ffmpeg.readFile(out);
    const mimeMap = { mp3: 'audio/mpeg', wav: 'audio/wav', ogg: 'audio/ogg', m4a: 'audio/mp4', flac: 'audio/flac' };
    const blob = new Blob([data.buffer], { type: mimeMap[fmt] || 'audio/mpeg' });
    const oname = file.name.replace(/\.[^.]+$/, '') + '.' + fmt;
    downloadBlob(blob, oname);
    ffmpeg.deleteFile(inp); ffmpeg.deleteFile(out);
    $('#audio-result').innerHTML = '<p style="font-size:12px;color:var(--green)">✓ ' + oname + ' — ' + fmtSize(blob.size) + ' (' + qual + ')</p>';
    toast('Convertido: ' + oname);
  } catch (e) {
    console.error(e);
    toast('Error al convertir','error');
  }
  btn.disabled = false;
  btn.textContent = 'Convertir';
  try { ffmpeg.off('progress'); } catch (_) {}
});
