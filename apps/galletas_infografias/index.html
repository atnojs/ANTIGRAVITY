<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galletas de Infografías · Antigravity</title>
  <meta name="description" content="Explora galletas con prompts para generar infografías. Cada galleta incluye un ejemplo visual y el prompt listo para copiar." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Electrolize&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="app.css?v=2" />
  <link rel="icon" href="https://www.atnojs.es/imagenes/favicon_negro1.ico" type="image/x-icon">
</head>
<body>
  <main class="container">
    <!-- Cabecera -->
    <header class="app-header">
      <h1>🍪 Galletas de Infografías</h1>
      <p class="subtitle">Explora, inspírate y copia prompts listos para crear infografías espectaculares.</p>
    </header>

    <!-- Filtro de categorías -->
    <nav class="categories-nav" aria-label="Filtrar por categoría">
      <div id="category-chips" class="chips-row">
        <!-- JS rellena -->
      </div>
    </nav>

    <!-- Grid de galletas -->
    <section id="cookies-grid" class="cookies-grid" aria-label="Galletas de infografías">
      <!-- JS rellena -->
    </section>

    <!-- Estado vacío -->
    <div id="empty-state" class="empty-state hidden">
      <p>🍪 No hay galletas en esta categoría aún.</p>
    </div>
  </main>

  <!-- Modal de detalle -->
  <div id="cookie-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <button class="modal-close" id="modal-close" aria-label="Cerrar">&times;</button>
      <div class="modal-preview" id="modal-preview">
        <!-- CSS mini-infographic preview -->
      </div>
      <div class="modal-body">
        <span class="modal-category" id="modal-category"></span>
        <h2 id="modal-title"></h2>
        <p class="modal-desc" id="modal-desc"></p>
        <div class="modal-prompt-box">
          <label>Prompt para copiar</label>
          <textarea id="modal-prompt" readonly rows="5" aria-label="Prompt de la galleta"></textarea>
          <button class="btn-copy" id="btn-copy-prompt" title="Copiar prompt">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copiar Prompt
          </button>
          <span id="copy-feedback" class="copy-feedback hidden">✓ ¡Copiado!</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Loading Overlay (canónico Hoola) -->
  <div id="loading-overlay" class="loading-overlay hidden" style="display:none" role="status" aria-live="polite" aria-busy="true">
    <div class="spinner-triple">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
    </div>
    <p id="loading-text" class="loading-text">IA generando lo solicitado...</p>
    <div class="progress-panel">
      <div class="progress-bar-track">
        <div id="overlay-progress-bar" class="progress-bar-fill" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div>
      </div>
      <p id="secondary-status" class="secondary-status">Procesando solicitud...</p>
    </div>
  </div>

  <script>(function(){var o=document.getElementById('loading-overlay');if(o){o.className='loading-overlay hidden';o.style.display='none';}})();</script>
  <script src="history-manager.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
