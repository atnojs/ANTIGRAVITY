<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galletas de Infografías · Antigravity</title>
  <meta name="description" content="Explora galletas con prompts, elige tu tema y genera infografías con IA. Cada galleta incluye un ejemplo visual y un prompt listo para usar." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Electrolize&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="app.css?v=4" />
  <link rel="icon" href="https://www.atnojs.es/imagenes/favicon_negro1.ico" type="image/x-icon">
</head>
<body>
  <main class="container">
    <!-- Cabecera -->
    <header class="app-header">
      <h1>🍪 Galletas de Infografías</h1>
      <p class="subtitle">Elige un estilo, escribe tu tema y genera infografías espectaculares con IA.</p>
    </header>

    <!-- Filtro de categorías -->
    <nav class="categories-nav" aria-label="Filtrar por categoría">
      <div id="category-chips" class="chips-row">
        <!-- JS rellena -->
      </div>
    </nav>

    <!-- Grid de galletas -->
    <section id="cookies-grid" class="cookies-grid" aria-label="Galletas de infografías">
      <!-- JS rellena -->
    </section>

    <!-- Estado vacío -->
    <div id="empty-state" class="empty-state hidden">
      <p>🍪 No hay galletas en esta categoría aún.</p>
    </div>
  </main>

  <!-- Modal de detalle -->
  <div id="cookie-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <button class="modal-close" id="modal-close" aria-label="Cerrar">&times;</button>
      <!-- Zona superior: vacía al abrir, muestra la infografía generada -->
      <div class="modal-preview" id="modal-preview">
        <img id="result-image" class="result-image-hidden" alt="Infografía generada" loading="lazy" />
      </div>
      <div class="modal-body">
        <span class="modal-category" id="modal-category"></span>
        <h2 id="modal-title"></h2>
        <p class="modal-desc" id="modal-desc"></p>

        <!-- PROMPT (solo lectura) -->
        <div class="modal-prompt-box">
          <label>Prompt</label>
          <textarea id="modal-prompt" readonly rows="3" aria-label="Prompt de la galleta"></textarea>
          <button class="btn-translate" id="btn-translate" title="Traducir prompt a inglés">🌐 Traducir a Inglés</button>
        </div>

        <!-- CAMPO OBJETO -->
        <div class="modal-subject-box">
          <label for="input-subject">¿Sobre qué quieres la infografía?</label>
          <input type="text" id="input-subject" placeholder="Ej: el león africano, la historia del café, el ciclo del agua en España..." aria-label="Tema de la infografía" />
          <button class="btn-generate" id="btn-generate">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            Generar Infografía
          </button>
        </div>

        <!-- RESULTADO: solo botón descargar (la imagen va arriba en modal-preview) -->
        <div id="result-section" class="result-section hidden">
          <button class="btn-download" id="btn-download" title="Descargar infografía">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
            Descargar Infografía
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Loading Overlay (canónico Hoola) -->
  <div id="loading-overlay" class="loading-overlay hidden" style="display:none" role="status" aria-live="polite" aria-busy="true">
    <div class="spinner-triple">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
    </div>
    <p id="loading-text" class="loading-text">IA generando lo solicitado...</p>
    <div class="progress-panel">
      <div class="progress-bar-track">
        <div id="overlay-progress-bar" class="progress-bar-fill" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div>
      </div>
      <p id="secondary-status" class="secondary-status">Procesando solicitud...</p>
    </div>
  </div>

  <script>(function(){var o=document.getElementById('loading-overlay');if(o){o.className='loading-overlay hidden';o.style.display='none';}})();</script>
  <script src="history-manager.js?v=2"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
