<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creador de Memes IA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Electrolize&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=4" />
  <link rel="icon" href="https://www.atnojs.es/imagenes/favicon_negro1.ico" type="image/x-icon">
</head>
<body>

<div id="meme-app" class="meme-app">

  <!-- HEADER -->
  <header class="app-header">
    <h1 class="app-title">Creador de Memes IA</h1>
    <p class="app-subtitle">FLUX genera la base · Tú pones el texto</p>
  </header>

  <!-- MAIN LAYOUT -->
  <div class="main-layout">

    <!-- COLUMNA IZQUIERDA -->
    <div class="main-col">

      <!-- IDEA DEL MEME -->
      <section class="section-card section-concepto">
        <h2 class="section-title">🎯 Idea del Meme</h2>
        <div class="prompt-wrap">
          <textarea id="meme-idea" class="prompt-input" rows="2" placeholder="Ej: Un gato con corbata en una oficina, con cara de 'es lunes otra vez'..."></textarea>
          <div class="prompt-actions">
            <button id="enhance-prompt-btn" class="action-chip">🪄 Mejorar prompt</button>
            <button id="random-idea-btn" class="action-chip">🎲 Idea aleatoria</button>
            <label id="upload-image-btn" class="action-chip" for="file-input" title="Subir imagen desde tu PC">📁 Mi imagen</label>
            <input type="file" id="file-input" accept="image/*" hidden />
            <span id="enhance-status" class="enhance-status"></span>
          </div>
        </div>
        <div id="enhanced-prompt-area" class="enhanced-prompt-area hidden">
          <label class="field-label">Prompt mejorado (editable):</label>
          <textarea id="final-prompt" class="prompt-input" rows="3" placeholder="El prompt mejorado aparecerá aquí..."></textarea>
        </div>
      </section>

      <!-- TEXTO DEL MEME -->
      <section class="section-card section-texto">
        <h2 class="section-title">💬 Texto del Meme</h2>
        <div class="meme-text-inputs">
          <div class="text-field">
            <label class="field-label">Texto superior</label>
            <input type="text" id="top-text" class="text-input" placeholder="CUANDO ES VIERNES..." maxlength="100" />
          </div>
          <div class="text-field">
            <label class="field-label">Texto inferior</label>
            <input type="text" id="bottom-text" class="text-input" placeholder="Y EL JEFE TE PIDE QUEDARTE" maxlength="100" />
          </div>
        </div>

        <!-- SLIDERS ROW -->
        <div class="sliders-row">
          <div class="slider-group">
            <span class="slider-label">Color</span>
            <input type="range" id="color-slider" class="color-spectrum-slider" min="0" max="100" value="50" />
            <span class="slider-val" id="color-val">50</span>
          </div>
          <div class="slider-group">
            <span class="slider-label">Tamaño</span>
            <input type="range" id="size-slider" class="range-slider" min="30" max="180" value="120" />
            <span class="slider-val" id="size-val">120px</span>
          </div>
          <div class="slider-group">
            <span class="slider-label">Interlineado</span>
            <input type="range" id="spacing-slider" class="range-slider" min="80" max="200" value="115" />
            <span class="slider-val" id="spacing-val">115%</span>
          </div>
        </div>
      </section>

      <!-- CONTROLES + GENERAR (misma fila compacta) -->
      <div class="bottom-row">
        <section class="section-card section-controls">
          <div class="controls-inline">
            <div class="control-item">
              <span class="control-label">AR</span>
              <div class="toggle-row-inline" id="ar-selector">
                <button class="toggle-btn active" data-ar="1:1">1:1</button>
                <button class="toggle-btn" data-ar="16:9">16:9</button>
                <button class="toggle-btn" data-ar="9:16">9:16</button>
                <button class="toggle-btn" data-ar="4:3">4:3</button>
                <button class="toggle-btn" data-ar="3:4">3:4</button>
              </div>
            </div>
            <div class="control-sep"></div>
            <div class="control-item">
              <span class="control-label">Modelo</span>
              <div class="toggle-row-inline" id="quality-selector">
                <button class="toggle-btn active" data-quality="pro">PRO</button>
                <button class="toggle-btn" data-quality="max">MAX</button>
              </div>
            </div>
            <div class="control-sep"></div>
            <div class="control-item">
              <span class="control-label">Resolución</span>
              <div class="toggle-row-inline" id="res-selector">
                <button class="toggle-btn" data-res="512">512</button>
                <button class="toggle-btn active" data-res="1024">1024</button>
                <button class="toggle-btn" data-res="2048">2048</button>
                <button class="toggle-btn" data-res="4096">4096</button>
              </div>
            </div>
          </div>
        </section>

        <button id="generate-btn" class="btn-generate">
          <span id="generate-btn-text">GENERAR MEME</span>
          <div id="generate-spinner" class="spinner-generate hidden"></div>
        </button>
      </div>

      <!-- RESULTADO -->
      <section id="result-section" class="section-card hidden">
        <h2 class="section-title">🖼️ Resultado</h2>
        <div id="meme-canvas-container" class="meme-canvas-container">
          <canvas id="meme-canvas"></canvas>
        </div>
        <div class="result-actions">
          <button id="download-btn" class="btn-download-meme">⬇ Descargar Meme</button>
        </div>
      </section>

    </div><!-- /main-col -->

    <!-- HISTORIAL -->
    <aside id="history-section" class="history-panel hidden">
      <div class="history-header">
        <h2 class="section-title">📸 Historial</h2>
        <button id="history-clear-btn" class="action-chip" style="font-size:0.6rem;padding:4px 10px">Limpiar</button>
      </div>
      <div class="history-header-actions">
        <button id="history-refresh-btn" class="action-chip" style="font-size:0.55rem;padding:3px 8px">↻ Refrescar</button>
      </div>
      <div id="history-container" class="history-grid"></div>
    </aside>

  </div><!-- /main-layout -->

</div>

<!-- TOAST -->
<div id="toast" class="toast-bar"><p id="toast-message"></p></div>

<!-- LOADING OVERLAY -->
<div id="loading-overlay" class="loading-overlay hidden" style="display:none" role="status" aria-live="polite" aria-busy="true">
  <div class="spinner-triple">
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>
  </div>
  <p id="loading-text" class="loading-text">IA generando lo solicitado...</p>
  <div class="progress-panel">
    <div class="progress-bar-track">
      <div id="overlay-progress-bar" class="progress-bar-fill" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div>
    </div>
    <p id="secondary-status" class="secondary-status">Procesando solicitud...</p>
  </div>
</div>

<script>(function(){var o=document.getElementById('loading-overlay');if(o){o.className='loading-overlay hidden';o.style.display='none';}})();</script>
<script src="history-manager.js?v=1"></script>
<script src="app.js?v=4"></script>
</body>
</html>
