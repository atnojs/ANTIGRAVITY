<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Abriendo Editor de Imágenes…</title>
  <link rel="icon" href="https://atnojs.es/iconos/favicon1.ico" type="image/x-icon">
  <script>
    // Cache busting del HTML de entrada: se conserva el query entrante (p. ej.
    // ?handoff=folio) y se añade un sello de tiempo para que el navegador no
    // reutilice una copia cacheada del editor destino.
    const target = new URL('/apps/imagenes_ia/ajustes_imagen/editor_local/', window.location.origin);
    const params = new URLSearchParams(window.location.search);
    params.set('_', Date.now());
    target.search = params.toString();
    window.location.replace(target.href);
  </script>
</head>
<body>
  <p>Abriendo el <a id="editor-link" href="/apps/imagenes_ia/ajustes_imagen/editor_local/">Editor de Imágenes</a>…</p>
  <!-- Tooltip de modelos (popup hover) -->
  <div id="model-tooltip" class="model-tooltip" role="tooltip" aria-hidden="true"></div>
  <script>document.getElementById('editor-link').href = '/apps/imagenes_ia/ajustes_imagen/editor_local/' + window.location.search;</script>
</body>
</html>
