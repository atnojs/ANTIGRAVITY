<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academia de Agentes IA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Electrolize&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="app.css?v=4" />
  <link rel="icon" href="https://www.atnojs.es/imagenes/favicon_negro1.ico" type="image/x-icon" />
</head>
<body>
  <main class="container">
    <!-- ===== SPLASH: SOLO 4 BOTONES DE PLATAFORMA ===== -->
    <div id="platform-select">
      <h1 class="splash-title">Academia de Agentes IA</h1>
      <p class="splash-subtitle">Elige la plataforma que quieres dominar</p>

      <div class="platform-cards" id="platform-cards">
        <button class="platform-card" data-platform="hermes">
          <span class="platform-card-icon">🧠</span>
          <span class="platform-card-name">Hermes Agent</span>
          <span class="platform-card-desc">Agente autónomo de Nous Research — 27 lecciones</span>
          <span class="platform-card-badge">27 temas</span>
        </button>
        <button class="platform-card" data-platform="codex">
          <span class="platform-card-icon">🤖</span>
          <span class="platform-card-name">Codex</span>
          <span class="platform-card-desc">Agente de OpenAI — CLI, IDE, proyectos — 16 lecciones</span>
          <span class="platform-card-badge">16 temas</span>
        </button>
        <button class="platform-card" data-platform="claude">
          <span class="platform-card-icon">💎</span>
          <span class="platform-card-name">Claude Code</span>
          <span class="platform-card-desc">Agente de Anthropic — 20 lecciones</span>
          <span class="platform-card-badge">20 temas</span>
        </button>
        <button class="platform-card" data-platform="antigravity">
          <span class="platform-card-icon">🌌</span>
          <span class="platform-card-name">Antigravity</span>
          <span class="platform-card-desc">Entorno de Google — 16 lecciones</span>
          <span class="platform-card-badge">16 temas</span>
        </button>
      </div>
    </div>

    <!-- ===== CONTENIDO PRINCIPAL (oculto hasta elegir plataforma) ===== -->
    <div id="main-content" class="hidden">
      <!-- Platform header -->
      <div class="platform-header">
        <button class="back-btn" id="change-platform-btn">← Cambiar de plataforma</button>
        <span class="platform-header-title" id="platform-header-title"></span>
      </div>

      <!-- Search -->
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Buscar comandos, conceptos o lecciones..." autocomplete="off" />
        <span class="search-icon">⌕</span>
      </div>

      <!-- Level toggles -->
      <div class="level-toggles" id="level-toggles">
        <button class="level-toggle active" data-level="all">🌐 Todos</button>
        <button class="level-toggle" data-level="1">🌱 Principiante</button>
        <button class="level-toggle" data-level="2">⚡ Intermedio</button>
        <button class="level-toggle" data-level="3">🚀 Avanzado</button>
      </div>

      <!-- Progress -->
      <div class="progress-section">
        <div class="progress-info">
          <span id="progress-count">0 / 0 completadas</span>
          <span class="progress-percent" id="progress-percent">0%</span>
        </div>
        <div class="progress-outer">
          <div class="progress-inner" id="progress-bar" style="width: 0%"></div>
        </div>
      </div>

      <!-- Search results -->
      <div id="search-results" class="hidden"></div>

      <!-- Lesson grid -->
      <div id="lessons-grid" class="lessons-grid"></div>

      <!-- Glossary toggle -->
      <button class="glossary-toggle" id="glossary-toggle-btn">📋 Glosario de Comandos</button>

      <!-- Glossary panel -->
      <div id="glossary-panel" class="hidden"></div>
    </div>

    <!-- ===== LESSON DETAIL VIEW ===== -->
    <div id="lesson-view" class="hidden">
      <button class="back-btn" id="back-btn">← Volver a las lecciones</button>
      <div id="lesson-detail-content"></div>
    </div>
  </main>

  <!-- ===== LOADING OVERLAY ===== -->
  <div id="loading-overlay" class="loading-overlay hidden" style="display:none" role="status" aria-live="polite" aria-busy="true">
    <div class="spinner-triple">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
    </div>
    <p class="loading-text">IA generando lo solicitado...</p>
    <div class="progress-panel">
      <div class="progress-bar-track">
        <div class="progress-bar-fill" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div>
      </div>
      <p class="secondary-status">Cargando Academia...</p>
    </div>
  </div>

  <script>(function(){var o=document.getElementById('loading-overlay');if(o){o.className='loading-overlay hidden';o.style.display='none';}})();</script>
  <script src="config-platforms.js"></script>
  <script src="lessons-hermes.js?v=2"></script>
  <script src="lessons-codex.js?v=2"></script>
  <script src="lessons-claude.js?v=2"></script>
  <script src="lessons-antigravity.js?v=2"></script>
  <script src="history-manager.js"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
