<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cambio de Outfit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Electrolize&display=swap" rel="stylesheet">
  <link rel="icon" href="https://atnojs.es/iconos/favicon1.ico" type="image/x-icon" />
  <link rel="stylesheet" href="app.css?v=3" />
</head>
<body>

<div id="outfit-app" class="outfit-app">

  <!-- ===== HEADER ===== -->
  <header class="app-header">
    <h1 class="app-title">
      <span class="title-dot">●</span> Cambio de Outfit
    </h1>
    <p class="app-subtitle">Sube una foto y reinventa el estilo</p>
  </header>

  <!-- ===== FILA 1: Categorías + VISOR CENTRAL + Categorías ===== -->
  <section class="row-viewer">
    <!-- Categorías izquierda -->
    <div class="cats-side cats-left" id="category-container-left"></div>

    <!-- VISOR CENTRAL -->
    <div class="viewer-central" id="image-viewer">
      <!-- Upload / Placeholder -->
      <label for="file-input" id="drag-area" class="viewer-dropzone">
        <input type="file" id="file-input" class="hidden" accept="image/*" />
        <div id="upload-placeholder" class="viewer-placeholder-inner">
          <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" class="viewer-icon"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
          <p>Arrastra tu foto aquí<br><span>o haz click para subir</span></p>
        </div>
        <img id="uploaded-image-preview" src="" class="hidden" alt="Preview" />
      </label>

      <!-- Comparación before/after -->
      <div id="comparison-container" class="comparison-container hidden">
        <img id="image-before" src="" alt="Original" class="comparison-img-base">
        <img id="image-after" src="" alt="Generado" class="comparison-img-overlay">
        <div id="comparison-slider" class="comparison-slider-bar">
          <div class="comparison-slider-knob">
            <span>◂</span><span>▸</span>
          </div>
        </div>
      </div>

      <!-- Placeholder inicial -->
      <div id="viewer-placeholder" class="viewer-empty">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="viewer-empty-icon"><path d="M15.5 2H8.6c-.4 0-.8.2-1.1.5-.3.3-.5.7-.5 1.1v12.8c0 .4.2.8.5 1.1.3.3.7.5 1.1.5h9.8c.4 0 .8-.2 1.1-.5.3-.3.5-.7.5-1.1V6.5L15.5 2z"/><path d="M3 7.6v12.8c0 .4.2.8.5 1.1.3.3.7.5 1.1.5h9.8"/><path d="M15 2v5h5"/></svg>
        <p>La imagen generada aparecerá aquí</p>
      </div>

      <!-- Descargar -->
      <button id="download-btn" class="btn-download hidden">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        Descargar
      </button>
    </div>

    <!-- Categorías derecha -->
    <div class="cats-side cats-right" id="category-container-right"></div>
  </section>

  <!-- Categorías extra (si hay más de 5) -->
  <div class="cats-more" id="category-container-more"></div>

  <!-- ===== SUB CATEGORÍAS (hasta 4 por fila) ===== -->
  <div class="subcats-section" id="subcategory-section">
    <div class="subcats-grid" id="subcategory-container"></div>
  </div>

  <!-- ===== SECCIÓN: PERSONALIZA ===== -->
  <section class="section-card section-personaliza" id="section-personaliza">
    <h2 class="section-title">🎨 PERSONALIZA</h2>
    
    <!-- Prompt -->
    <div class="prompt-wrap">
      <textarea id="custom-prompt" class="prompt-input" rows="2" placeholder="Describe el outfit que quieres... Ej: vestido rojo con flores"></textarea>
      <div class="prompt-actions">
        <button id="enhance-prompt-btn" class="action-chip" title="Mejorar descripción">
          <span id="enhance-prompt-icon">🪄 Mejorar</span>
          <div id="enhance-prompt-spinner" class="spinner hidden"></div>
        </button>
        <button id="idea-generator-btn" class="action-chip" title="Generar idea">
          <span id="idea-generator-icon">✨ Idea</span>
          <div id="idea-generator-spinner" class="spinner hidden"></div>
        </button>
      </div>
    </div>

    <!-- Slider intensidad -->
    <div class="control-row">
      <label for="intensity-slider" class="control-label">Intensidad: <span id="intensity-value" class="control-value">50</span>%</label>
      <input id="intensity-slider" type="range" min="10" max="100" value="50" class="range-slider">
    </div>

    <!-- Checkboxes -->
    <div class="checks-row">
      <label class="check-item">
        <input id="keep-colors-checkbox" type="checkbox" class="check-box">
        <span>Mantener colores</span>
      </label>
      <label class="check-item">
        <input id="change-background-checkbox" type="checkbox" class="check-box">
        <span>Cambiar fondo</span>
      </label>
      <label class="check-item">
        <input id="change-pose-checkbox" type="checkbox" class="check-box">
        <span>Modificar postura</span>
      </label>
    </div>
  </section>

  <!-- ===== FILA 6: CONTROLES (calidad, formato, resolución) ===== -->
  <section class="section-card section-controls" id="section-controls">
    <div class="controls-grid">
      <!-- Calidad -->
      <div class="control-group">
        <span class="control-group-label">Modelo</span>
        <div class="toggle-row" id="quality-selector">
          <button id="quality-pro" class="toggle-btn active" data-quality="pro">PRO</button>
          <button id="quality-max" class="toggle-btn" data-quality="max">MAX</button>
        </div>
      </div>

      <!-- Formato -->
      <div class="control-group">
        <span class="control-group-label">Formato</span>
        <div class="toggle-row" id="ar-selector">
          <button class="toggle-btn active" data-ar="1:1">1:1</button>
          <button class="toggle-btn" data-ar="16:9">16:9</button>
          <button class="toggle-btn" data-ar="9:16">9:16</button>
          <button class="toggle-btn" data-ar="4:3">4:3</button>
          <button class="toggle-btn" data-ar="3:4">3:4</button>
        </div>
      </div>

      <!-- Resolución -->
      <div class="control-group">
        <span class="control-group-label">Resolución</span>
        <div class="toggle-row" id="res-selector">
          <button class="toggle-btn" data-res="512">512</button>
          <button class="toggle-btn active" data-res="1024">1024</button>
          <button class="toggle-btn" data-res="2048">2048</button>
          <button class="toggle-btn" data-res="4096">4096</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== FILA 7: GENERAR ===== -->
  <section class="section-generate">
    <button id="generate-btn" class="btn-generate">
      <span id="generate-btn-text">GENERAR OUTFIT</span>
      <div id="loader" class="spinner-generate hidden"></div>
    </button>
    <button id="random-btn" class="btn-surprise hidden">
      ✨ ¡Sorpréndeme!
    </button>
  </section>

  <!-- ===== DESCRIBIR ESTILO ===== -->
  <div id="style-description-section" class="section-card hidden">
    <button id="describe-style-btn" class="btn-describe">
      <span id="describe-btn-text">✨ Describe mi Estilo</span>
      <div id="describe-loader" class="spinner hidden"></div>
    </button>
    <div id="style-description-output" class="style-desc-output hidden"></div>
  </div>

  <!-- ===== HISTORIAL ===== -->
  <section id="history-section" class="section-card hidden">
    <h2 class="section-title">📸 Historial</h2>
    <div id="history-container" class="history-grid"></div>
  </section>

</div>

<!-- Toast -->
<div id="toast" class="toast-bar">
  <p id="toast-message"></p>
</div>

<!-- ===== MODALES INYECTADOS POR JS ===== -->
<!-- (El JS los crea dinámicamente: global-loader, regen-modal, lightbox) -->

<script src="history-manager.js?v=3"></script>
<script src="app.js?v=3"></script>
</body>
</html>
