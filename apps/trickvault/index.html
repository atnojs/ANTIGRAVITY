    const [showPasswordModal, setShowPasswordModal] = useState(false);
    const [pendingEditAction, setPendingEditAction] = useState(null);
    const [showFolderForm, setShowFolderForm] = useState(false);

    function addToast(msg, type = 'success') {
        const id = uid();
        setToasts(prev => [...prev, { id, msg, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
    }

    function removeToast(id) { setToasts(prev => prev.filter(t => t.id !== id)); }

    const withEditAccess = useCallback((action) => {
        if (editUnlocked) {
            action();
            return;
        }
        setPendingEditAction(() => action);
        setShowPasswordModal(true);
    }, [editUnlocked]);

    const migrateLocalImages = useCallback(async () => {
        let changed = false;
        const next = [];
        for (const trick of tricks) {
            let imageUrl = trick.imageUrl || '';
            if (typeof imageUrl === 'string' && imageUrl.startsWith('data:image/')) {
                imageUrl = await fitDataUrlToLimit(imageUrl);
                imageUrl = await uploadRemoteImage(trick.id, imageUrl);
                changed = true;
            }
            next.push({ ...trick, imageUrl });
        }
        if (changed) setTricks(next);
        return next;
    }, [tricks, setTricks]);

    const submitEditPassword = useCallback(async (password) => {
        try {
            await authenticateRemote(password);
            await migrateLocalImages();
            const action = pendingEditAction;
            setEditPassword(password);
            setEditUnlocked(true);
            setShowPasswordModal(false);
            setPendingEditAction(null);
            if (action) action();
            return true;
        } catch (error) {
            console.error('[TrickVault] No se pudo iniciar la sesión de edición:', error);
            return false;
        }
    }, [pendingEditAction, migrateLocalImages]);

    const toggleFav = useCallback((id) => {
        setTricks(prev => {
            const next = prev.map(t => t.id === id ? { ...t, isFavorite: !t.isFavorite } : t);
            const favIds = next.filter(t => t.isFavorite).map(t => t.id);
            saveRemoteFavorites(favIds).catch(e => console.warn('[TrickVault] No se pudo guardar favoritos en el servidor:', e));
            return next;
        });
    }, [setTricks]);

    const createFolder = useCallback(({ label, icon, color }) => {
        const clean = String(label || '').trim();
        if (!clean) return;
        if (folders.some(f => f.label.toLowerCase() === clean.toLowerCase())) {
            addToast('Ya existe una carpeta con ese nombre', 'error');
            return;
        }
        setFolders(prev => [...prev, { id: 'f_' + uid(), label: clean, icon: icon || '📁', color: color || 'cyan', bgIcon: '🗂️' }]);
        addToast('📁 Carpeta creada');
    }, [folders, setFolders]);

    const reorderFolders = useCallback((sourceId, targetId) => {
        if (!editUnlocked) return;
        const sourceIndex = orderedFolderCards.findIndex(f => f.id === sourceId);
        const targetIndex = orderedFolderCards.findIndex(f => f.id === targetId);
        if (sourceIndex < 0 || targetIndex < 0 || sourceIndex === targetIndex) return;
        const next = [...orderedFolderCards];
        const [moved] = next.splice(sourceIndex, 1);
        next.splice(targetIndex, 0, moved);
        setFolderCardOrder(next.map(f => f.id));
        setFolders(next.filter(f => f.id !== 'favorites'));
        addToast('📂 Carpetas reordenadas');
    }, [editUnlocked, orderedFolderCards, setFolders]);

    const moveTrickToFolder = useCallback((trickId, targetFolderId) => {
        setTricks(prev => {
            let movedTrick = null;
            const next = prev.map(t => {
                if (t.id !== trickId) return t;
                if (targetFolderId === 'favorites') {
                    movedTrick = { ...t, isFavorite: true };
                    return movedTrick;
                }
                if (t.category === targetFolderId) return t;
                const maxOrder = prev
                    .filter(x => x.category === targetFolderId)
                    .reduce((max, x) => hasSortOrder(x) ? Math.max(max, Number(x.sortOrder)) : max, -1);
                movedTrick = { ...t, category: targetFolderId, sortOrder: maxOrder + 1 };
                return movedTrick;
            });
            return next;
        });
        if (targetFolderId === 'favorites') {
            addToast('⭐ Añadida a favoritos');
        } else {
            addToast('📂 Tarjeta movida de carpeta');
        }
    }, [setTricks]);

    const deleteFolder = useCallback((folder) => {
        withEditAccess(() => {

            if (folders.length <= 1) {
                addToast('No puedes eliminar la última carpeta', 'error');
                return;
            }
            const destination = folders.find(f => f.id === 'xl-dev' && f.id !== folder.id) || folders.find(f => f.id !== folder.id);
            if (!confirm(`¿Eliminar la carpeta "${folder.label}"? Sus tarjetas pasarán a "${destination.label}".`)) return;
            const target = destination.id;
            setTricks(prev => prev.map(t => t.category === folder.id ? { ...t, category: target } : t));
            setFolders(prev => prev.filter(f => f.id !== folder.id));
            addToast('🗑️ Carpeta eliminada', 'error');
        });
    }, [folders, setFolders, setTricks, withEditAccess]);

    const reorderTricks = useCallback((categoryId, sourceId, targetId) => {
        setTricks(prev => {
            const categoryTricks = prev.filter(t => t.category === categoryId).sort(compareTricks);
            const sourceIndex = categoryTricks.findIndex(t => t.id === sourceId);
            const targetIndex = categoryTricks.findIndex(t => t.id === targetId);
            if (sourceIndex < 0 || targetIndex < 0 || sourceIndex === targetIndex) return prev;
            const [moved] = categoryTricks.splice(sourceIndex, 1);
            categoryTricks.splice(targetIndex, 0, moved);
            const orderById = new Map(categoryTricks.map((trick, index) => [trick.id, index]));
            return prev.map(trick => orderById.has(trick.id) ? { ...trick, sortOrder: orderById.get(trick.id) } : trick);
        });
    }, [setTricks]);

    const deleteEditingTrick = useCallback(() => {
        if (!editingTrick) return;
        withEditAccess(() => {
            if (!confirm('¿Eliminar este truco para siempre?')) return;
            const deletedId = editingTrick.id;
            if (editingTrick.imageUrl) {
                removeRemoteImage(deletedId).catch(error => console.error('[TrickVault] No se pudo borrar la imagen remota:', error));
            }
            setTricks(prev => prev.filter(t => t.id !== deletedId));
            setShowForm(false);
            setEditingTrick(null);
            addToast('🗑️ Truco eliminado', 'error');
        });
    }, [editingTrick, setTricks, withEditAccess]);

    const saveTrick = useCallback(async (formData) => {
        try {
            const targetId = editingTrick?.id || uid();
            const normalized = {
                ...formData,
                title: String(formData.title || '').trim(),
                description: String(formData.description || '').trim(),
                tags: Array.isArray(formData.tags) ? formData.tags : [],
            };

            if (typeof normalized.imageUrl === 'string' && normalized.imageUrl.startsWith('data:image/')) {
                normalized.imageUrl = await uploadRemoteImage(targetId, normalized.imageUrl);
            } else if (editingTrick?.imageUrl && !normalized.imageUrl) {
                await removeRemoteImage(targetId);
            }

            if (editingTrick) {
                setTricks(prev => prev.map(t => t.id === targetId ? { ...t, ...normalized, updatedAt: Date.now() } : t));
                addToast('✅ Truco actualizado');
            } else {
                setTricks(prev => {
                    const maxOrder = prev
                        .filter(trick => trick.category === normalized.category)
                        .reduce((max, trick) => hasSortOrder(trick) ? Math.max(max, Number(trick.sortOrder)) : max, -1);
                    const newTrick = { ...normalized, id: targetId, createdAt: Date.now(), updatedAt: Date.now(), sortOrder: maxOrder + 1 };
                    return [newTrick, ...prev];
                });
                addToast('✨ Truco creado');
            }
            setShowForm(false);
            setEditingTrick(null);
            return true;
        } catch (error) {
            console.error('[TrickVault] No se pudo guardar la imagen:', error);
            addToast(`No se pudo guardar la imagen en Hostinger: ${error.message}`, 'error');
            return false;
        }
    }, [editingTrick, setTricks]);

    const handleCopy = useCallback(async (trick) => {
        try {
            const copyText = getTrickCopyText(trick);
            await navigator.clipboard.writeText(copyText);
            setCopiedId(trick.id);
            addToast((isImageCommandTrick(trick) || isTextCommandTrick(trick)) ? '📋 Prompt completo copiado' : '📋 Código copiado al portapapeles');
            setTimeout(() => setCopiedId(null), 2000);
        } catch {
            addToast('Error al copiar', 'error');
        }
    }, []);

    const handleImport = useCallback((importedTricks) => {
        withEditAccess(() => {
            const existingIds = new Set(tricks.map(t => t.id));
            const newOnes = importedTricks.filter(t => !existingIds.has(t.id));
            if (newOnes.length === 0) {
                addToast('No hay trucos nuevos para importar', 'error');
                return;
            }
            setTricks(prev => [...newOnes, ...prev]);
            addToast(`📤 ${newOnes.length} trucos importados`);
        });
    }, [tricks, setTricks, withEditAccess]);

    /** Diagnóstico: ¿puede el servidor publicar en GitHub? */
    const comprobarPublicacion = useCallback(async () => {
        setPublicando(true);
        setEstadoPublicar('Comprobando…');
        try {
            const r = await estadoPublicacion(editPassword);
            const e = r.estado || {};
            setEstadoPublicar(
                `GitHub: ${e.token_configurado === 'sí' ? 'token sí' : 'SIN token'} · API: ${e.api_github} · ` +
                `rama ${e.rama_destino}: ${e.rama_existe} · catálogo en el repo: ${e.catalogo_en_el_repo}` +
                (e.siguiente_paso ? ' · ' + e.siguiente_paso : '')
            );
        } catch (error) {
            setEstadoPublicar('❌ ' + error.message);
        } finally {
            setPublicando(false);
        }
    }, [editPassword]);

    /** Publica en GitHub la diferencia con el catálogo de serie. */
    const publicarCambios = useCallback(async () => {
        if (!editPassword) {
            addToast('Vuelve a entrar en modo edición para publicar', 'error');
            return;
        }
        const { catalogo, imagenes, resumen } = buildPublishPayload(tricks, SEED_TRICKS, carpetaPublicar);
        const nombreCarpeta = carpetaPublicar ? (getCat(carpetaPublicar, folders)?.label || carpetaPublicar) : '';
        const total = resumen.cambiadas + resumen.nuevas + resumen.borradas;
        if (!total && !resumen.imagenes) {
            addToast('No has cambiado nada respecto al catálogo');
            return;
        }
        // Enseñar QUÉ se va a publicar (los primeros códigos) para poder decirlo
        // con conocimiento de causa antes de aceptar.
        const codigos = [
            ...Object.keys(catalogo.tarjetas),
            ...catalogo.nuevas.map(t => t.codeSnippet || t.title || t.id),
        ];
        const muestra = codigos.length
            ? '\nSe incluyen: ' + codigos.slice(0, 6).map(c => String(c).trim()).join(', ') +
              (codigos.length > 6 ? ` y ${codigos.length - 6} más` : '') + '\n'
            : '\n';
        const porCampo = Object.entries(resumen.desglose || {})
            .sort((a, b) => b[1] - a[1])
            .map(([campo, n]) => `${campo}: ${n}`)
            .join(' · ');
        const seguro = window.confirm(
            (nombreCarpeta ? `Vas a publicar SOLO la carpeta «${nombreCarpeta}»:\n\n` : 'Vas a publicar en GitHub:\n\n') +
            `• ${resumen.cambiadas} tarjetas modificadas\n` +
            `• ${resumen.nuevas} tarjetas propias\n` +
            `• ${resumen.borradas} tarjetas borradas\n` +
            `• ${resumen.imagenes} imágenes propias\n` +
            (resumen.reordenadas ? `• ${resumen.reordenadas} carpetas con el orden cambiado\n` : '') +
            (porCampo ? `\nPor campo → ${porCampo}\n` : '') +
            muestra +
            '\nLo verá todo el mundo y quedará en el historial del repositorio. ¿Publicamos?'
        );
        if (!seguro) return;

        setPublicando(true);
        setEstadoPublicar('Publicando…');
        try {
            const r = await publishCatalogue(editPassword, catalogo, imagenes,
                `publicar${nombreCarpeta ? ' ' + nombreCarpeta : ''}: ${resumen.cambiadas} tarjetas, ` +
                `${resumen.nuevas} nuevas, ${resumen.imagenes} imágenes`);
            if (r.sin_cambios) {
                setEstadoPublicar('ℹ️ ' + (r.mensaje || 'No había nada nuevo'));
                addToast('No había nada nuevo que publicar');
            } else {
                setEstadoPublicar(`✅ Publicado en GitHub (commit ${r.commit}). Esperando al despliegue…`);
                addToast(`✅ Publicado (commit ${r.commit})`);
                // El despliegue de Hostinger tarda unos segundos en traer el
                // fichero: se comprueba aquí, sin bloquear la respuesta.
                const marca = r.actualizado;
                let enElAire = false;
                for (let intento = 0; intento < 10 && !enElAire; intento++) {
                    await new Promise(seguir => setTimeout(seguir, 3000));
                    const capa = await loadPublishedCatalogue();
                    if (capa && capa.actualizado === marca) {
                        enElAire = true;
                        setTricks(prev => normalizeTrickOrder(applyPublishedCatalogue(prev, capa)));
                    }
                }
                setEstadoPublicar(enElAire
                    ? `✅ Publicado y ya en el aire (commit ${r.commit})`
                    : `✅ Publicado (commit ${r.commit}). El despliegue lo traerá en breve.`);
            }
        } catch (error) {
            setEstadoPublicar('❌ ' + error.message);
            addToast('❌ ' + error.message, 'error');
            console.error('[TrickVault] No se pudo publicar:', error);
        } finally {
            setPublicando(false);
        }
    }, [editPassword, tricks, addToast, carpetaPublicar, folders]);

    const selectCategory = useCallback((catId) => {
        setCurrentCategory(catId);
        setView('category');
        setSearch('');
        setFilter('');
    }, []);

    const goHome = useCallback(() => {
        setView('categories');
        setCurrentCategory(null);
        setSearch('');
        setFilter('');
    }, []);

    const openAddForm = useCallback(() => {
        withEditAccess(() => {
            setEditingTrick(null);
            setShowForm(true);
        });
    }, [withEditAccess]);

    const openEditForm = useCallback((trick) => {
        withEditAccess(() => {
            setEditingTrick(trick);
            setShowForm(true);
        });
    }, [withEditAccess]);

    const toggleEditMode = useCallback(() => {
        if (editUnlocked) {
            setEditUnlocked(false);
            setEditPassword('');
            setEstadoPublicar('');
            setShowForm(false);
            setEditingTrick(null);
            setShowPasswordModal(false);
            setPendingEditAction(null);
            return;
        }
        withEditAccess(() => setEditUnlocked(true));
    }, [editUnlocked, withEditAccess]);

    useEffect(() => {
        let cancelled = false;

        async function syncImagesFromHostinger() {
            try {
                const remoteImages = await loadRemoteImages();

                if (!cancelled) {
                    // Aplicar solo imágenes sobre el estado actual: los favoritos,
                    // el contenido y la ubicación pueden haber cambiado mientras cargaban.
                    setTricks(prev => applyRemoteImages(prev, remoteImages));
                }
            } catch (error) {
                console.error('[TrickVault] No se pudieron cargar las imágenes de Hostinger:', error);
            }
        }

        syncImagesFromHostinger();
        return () => { cancelled = true; };
    }, [setTricks]);

    // Catálogo publicado: capa de cambios que vive en el repositorio (la escribió
    // el botón «Publicar»). Se aplica ENCIMA del catálogo de serie, así el
    // catálogo puede seguir creciendo por debajo sin pisar tus cambios.
    useEffect(() => {
        let cancelled = false;

        async function syncPublishedCatalogue() {
            try {
                const capa = await loadPublishedCatalogue();
                if (!capa || cancelled) return;
                setTricks(prev => normalizeTrickOrder(applyPublishedCatalogue(prev, capa)));
            } catch (error) {
                console.error('[TrickVault] No se pudo cargar el catálogo publicado:', error);
            }
        }

        syncPublishedCatalogue();
        return () => { cancelled = true; };
    }, [setTricks]);

    // Favoritos: fuente de verdad en el servidor (sobreviven pushes y recargas).
    useEffect(() => {
        let cancelled = false;

        async function syncFavoritesFromHostinger() {
            try {
                const remote = await loadRemoteFavorites();
                if (cancelled) return;
                if (remote.exists) {
                    setTricks(prev => applyRemoteFavorites(prev, remote.ids));
                }
            } catch (error) {
                console.error('[TrickVault] No se pudieron cargar los favoritos de Hostinger:', error);
            }
        }

        syncFavoritesFromHostinger();
        return () => { cancelled = true; };
    }, [setTricks]);

    // Simulated loading for premium feel
    useEffect(() => {
        setLoading(true);
        const t = setTimeout(() => setLoading(false), 800);
        return () => clearTimeout(t);
    }, []);

    const totalFavs = useMemo(() => tricks.filter(t => t.isFavorite).length, [tricks]);

    return (
        <div className={`app-container ${view === 'categories' ? 'home-mode' : ''}`}>
            {loading && (
                <div className="loading-overlay">
                    <div className="spinner-triple">
                        <div className="ring ring-1"></div>
                        <div className="ring ring-2"></div>
                        <div className="ring ring-3"></div>
                    </div>
                    <p className="loading-text">Cargando TrickVault...</p>
                </div>
            )}

            {/* TÍTULO CENTRADO */}
            <div className="app-branding" aria-label="TrickVault">
                <span className="app-logo">💎</span>
                <div className="app-title-wrap">
                    <div className="app-title">TrickVault</div>
                    <div className="app-subtitle">Tu colección personal de trucos</div>
                </div>
            </div>

            <div className="prompt-guide" role="note">
                <span className="prompt-guide-icon" aria-hidden="true">💡</span>
                <div>
                    <span className="prompt-guide-kicker">CÓDIGOS DE IMAGEN · GUÍA RÁPIDA</span>
                    <p>{IMAGE_PROMPT_HINT}</p>
                </div>
            </div>

            {/* STATS — solo aparecen en la portada */}
            {view === 'categories' && (
                <div className="stats-bar">
                    <span className="stat-chip">💎 <span className="count">{tricks.length}</span> trucos</span>
                    <span className="stat-chip">📂 <span className="count">{folders.length + 1}</span> carpetas</span>
                    <span className="stat-chip">⭐ <span className="count">{totalFavs}</span> favoritos</span>
                </div>
            )}

            {/* Buscador global visible en la portada. */}
            {view === 'categories' && (
                <GlobalSearch
                    tricks={tricks}
                    folders={folders}
                    onSelectCategory={selectCategory}
                    onToggleFav={toggleFav}
                    onEdit={openEditForm}
                    onImageClick={setLightboxSrc}
                    onCopy={handleCopy}
                    copiedId={copiedId}
                    canEdit={editUnlocked}
                />
            )}

            {/* MAIN CONTENT */}
            {view === 'categories' && (
                <div>
                    <div className="section-header">
                        <h2>📂 Carpetas</h2>
                        {editUnlocked && (
                            <div style={{ display: 'flex', gap: '0.6rem' }}>
                                <button className="btn btn-glass btn-sm" onClick={() => setShowFolderForm(true)}>➕ Nueva carpeta</button>
                                <button className="btn btn-primary btn-sm" onClick={openAddForm}>✨ Nuevo Truco</button>
                            </div>
                        )}
                    </div>
                    {editUnlocked && <p className="drag-hint">⠿ Arrastra cualquier carpeta, incluido Favoritos, sobre otra para cambiar su posición. El orden se guarda automáticamente.</p>}
                    <CategoryGrid
                        tricks={tricks}
                        folders={orderedFolderCards}
                        onSelectCategory={selectCategory}
                        canEdit={editUnlocked}
                        onDeleteFolder={deleteFolder}
                        onReorderFolders={reorderFolders}
                    />
                </div>
            )}

            {view === 'category' && currentCategory && (
                <TrickList
                    tricks={tricks}
                    folders={folders}
                    categoryId={currentCategory}
                    onBack={goHome}
                    onToggleFav={toggleFav}
                    onEdit={openEditForm}
                    onImageClick={setLightboxSrc}
                    onCopy={handleCopy}
                    copiedId={copiedId}
                    onAdd={openAddForm}
                    canEdit={editUnlocked}
                    search={search}
                    setSearch={setSearch}
                    filter={filter}
                    setFilter={setFilter}
                    onReorder={reorderTricks}
                    onMoveTrick={moveTrickToFolder}
                    onSelectFolder={selectCategory}
                />
            )}

            {view === 'search' && (
                <GlobalSearch
                    tricks={tricks}
                    folders={folders}
                    onSelectCategory={selectCategory}
                    onToggleFav={toggleFav}
                    onEdit={openEditForm}
                    onImageClick={setLightboxSrc}
                    onCopy={handleCopy}
                    copiedId={copiedId}
                    canEdit={editUnlocked}
                />
            )}

            {editUnlocked && <ExportImport tricks={tricks} onImport={handleImport} />}

            {editUnlocked && (
                <div className="publish-panel">
                    <div className="publish-panel-head">
                        <strong>🚀 Publicar en GitHub</strong>
                        <span className="publish-hint">
                            Sube al repositorio tus cambios (tarjetas e imágenes propias). Puedes limitarlo a una carpeta.
                        </span>
                    </div>
                    <div className="publish-panel-actions">
                        <label className="publish-carpeta">
                            <span>Qué publicar:</span>
                            <select value={carpetaPublicar} onChange={e => setCarpetaPublicar(e.target.value)} disabled={publicando}>
                                <option value="">Solo lo que he cambiado (todas las carpetas)</option>
                                {orderedFolderCards.map(cat => (
                                    <option key={cat.id} value={cat.id}>Solo «{cat.label}»</option>
                                ))}
                            </select>
                        </label>
                        <button type="button" className="btn btn-primary" onClick={publicarCambios} disabled={publicando}>
                            {publicando ? '⏳ Trabajando…' : '🚀 Publicar cambios'}
                        </button>
                        <button type="button" className="btn btn-glass btn-sm" onClick={comprobarPublicacion} disabled={publicando}>
                            🔎 Comprobar conexión
                        </button>
                        {estadoPublicar && <span className="publish-estado">{estadoPublicar}</span>}
                    </div>
                </div>
            )}

            {/* MODALS */}
            {showForm && (
                <TrickForm trick={editingTrick} folders={folders} onSave={saveTrick} onDelete={deleteEditingTrick} onClose={() => { setShowForm(false); setEditingTrick(null); }} />
            )}

            {showFolderForm && (
                <FolderForm onSave={createFolder} onClose={() => setShowFolderForm(false)} />
            )}

            {lightboxSrc && (
                <Lightbox src={lightboxSrc} onClose={() => setLightboxSrc(null)} />
            )}

            {showPasswordModal && (
                <PasswordModal
                    onSubmit={submitEditPassword}
                    onClose={() => { setShowPasswordModal(false); setPendingEditAction(null); }}
                />
            )}

            <Toast toasts={toasts} removeToast={removeToast} />

            {/* FOOTER */}
            <footer className="app-footer">
                <button
                    type="button"
                    className="edit-access-trigger"
                    onClick={toggleEditMode}
                    aria-label={editUnlocked ? 'Salir del modo edición' : 'Activar edición'}
                    title={editUnlocked ? 'Salir del modo edición' : 'Activar edición'}
                >✏️</button>
                TrickVault — Hecho con 💎 y Neon Glassmorphism
            </footer>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
