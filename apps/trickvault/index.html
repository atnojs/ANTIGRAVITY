function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 9); }

function getOrderedFolderCards(folders, savedOrder) {
    const cards = [...folders, FAVORITES_FOLDER];
    if (!Array.isArray(savedOrder)) return cards;
    const byId = new Map(cards.map(folder => [folder.id, folder]));
    const ordered = [];
    for (const id of savedOrder) {
        if (byId.has(id)) { ordered.push(byId.get(id)); byId.delete(id); }
    }
    // Las carpetas recién creadas también aparecen sin perder el orden guardado.
    for (const folder of cards) if (byId.has(folder.id)) ordered.push(folder);
    return ordered;
}

function getCat(id, folders) {
    if (id === 'favorites') return FAVORITES_FOLDER;
    const list = folders && folders.length ? folders : DEFAULT_FOLDERS;
    return list.find(c => c.id === id);
}
// Lista de carpetas efectiva: la guardada por el usuario + las carpetas nuevas
// que aún no conocía (una única vez por versión de esquema).
function removeEmptyLegacyFolders(saved) {
    const legacyIds = new Set(LEGACY_FOLDERS.map(folder => folder.id));
    let storedTricks;
    try {
        storedTricks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        if (!Array.isArray(storedTricks)) return saved;
    } catch { return saved; }
    const occupied = new Set();
    for (const trick of storedTricks) {
        if (!trick || REMOVED_IMAGE_IDS.has(String(trick.id))) continue;
        occupied.add(trick.category);
    }
    return saved.filter(folder => !legacyIds.has(folder.id) || occupied.has(folder.id));
}

function loadFolders() {
    let saved = null;
    try {
        const raw = localStorage.getItem(FOLDERS_KEY);
        if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length) saved = parsed;
        }
    } catch { /* ignorar */ }
    if (!saved) return DEFAULT_FOLDERS;
    saved = removeEmptyLegacyFolders(saved);
    if (!saved.length) return DEFAULT_FOLDERS;

    // Carpetas retiradas del catálogo: fuera también de la lista del navegador.
    if (saved.some(f => f && FOLDERS_REMOVED.includes(f.id))) {
        saved = saved.filter(f => f && !FOLDERS_REMOVED.includes(f.id));
        if (!saved.length) return DEFAULT_FOLDERS;
    }

    // Retirar la carpeta solo después de asegurar destinos para sus tarjetas.
    // Mantener el orden, los nombres personalizados y las demás carpetas borradas.
    if (saved.some(f => f && f.id === 'xl-500')) {
        saved = saved.filter(f => f && f.id !== 'xl-500');
        const destinations = new Set(['xl-verdentro', 'xl-letras3d', 'xl-hechomano',
            'xl-efectosempaque', 'xl-casaviajes', 'xl-comidamoda',
            'xl-escenaprueba', 'xl-luzcamara']);
        const known = new Set(saved.map(f => f.id));
        saved = [...saved, ...DEFAULT_FOLDERS.filter(f => destinations.has(f.id) && !known.has(f.id))];
    }

    let schema = 0;
    try { schema = Number(localStorage.getItem(FOLDERS_SCHEMA_KEY)) || 0; } catch { /* ignorar */ }
    if (schema >= FOLDERS_SCHEMA_VERSION) return saved;

    const known = new Set(saved.map(f => f && f.id));
    const missing = DEFAULT_FOLDERS.filter(f => !known.has(f.id));
    return missing.length ? [...saved, ...missing] : saved;
}

function isTextCommandTrick(trick) { return TEXT_COMMAND_PROMPTS.has(getImageCommandKey(trick)); }

const IMAGE_COMMAND_PROMPTS = new Map(
    Object.entries(PROMPT_TEMPLATES)
);

const TEXT_COMMAND_PROMPTS = new Map(Object.entries(TEXT_COMMAND_TEMPLATES));

function getImageCommandKey(trick) {
    return typeof trick?.codeSnippet === "string" ? trick.codeSnippet.trim() : "";
}

function isImageCommandTrick(trick) {
    return IMAGE_COMMAND_PROMPTS.has(getImageCommandKey(trick));
}

function getTrickCopyText(trick) {
    const commandKey = getImageCommandKey(trick);
    const base = (() => {
        const custom = String(trick?.customPrompt || '').trim();
        if (custom) return custom;
        return IMAGE_COMMAND_PROMPTS.get(commandKey) || String(trick?.codeSnippet || "");
    })();
    if (!IMAGE_COMMAND_PROMPTS.has(commandKey)) {
        const textTemplate = TEXT_COMMAND_PROMPTS.get(commandKey);
        return textTemplate ? `${commandKey} ${textTemplate}` : base;
    }
    if (base.includes(IMAGE_STYLE_PREFIX_TEXT)) {
        return base.trim().startsWith(commandKey) ? base : `${commandKey} ${base}`;
    }
    return `${commandKey} ${IMAGE_STYLE_PREFIX_TEXT} ${base}`;
}
function hasSortOrder(trick) { return Number.isFinite(Number(trick.sortOrder)); }
function compareTricks(a, b) {
    const aOrder = hasSortOrder(a) ? Number(a.sortOrder) : null;
    const bOrder = hasSortOrder(b) ? Number(b.sortOrder) : null;
    if (aOrder !== null && bOrder !== null) return aOrder - bOrder;
    if (aOrder !== null) return -1;
    if (bOrder !== null) return 1;
    return b.createdAt - a.createdAt;
}
function normalizeTrickOrder(items) {
    const usedByCategory = new Map();
    const nextByCategory = new Map();
    items.forEach(item => {
        if (!hasSortOrder(item)) return;
        if (!usedByCategory.has(item.category)) usedByCategory.set(item.category, new Set());
        usedByCategory.get(item.category).add(Number(item.sortOrder));
    });
    return items.map(item => {
        if (hasSortOrder(item)) return item;
        const used = usedByCategory.get(item.category) || new Set();
        let next = nextByCategory.get(item.category) || 0;
        while (used.has(next)) next += 1;
        used.add(next);
        usedByCategory.set(item.category, used);
        nextByCategory.set(item.category, next + 1);
        return { ...item, sortOrder: next };
    });
}

async function readServerJson(response) {
    let payload;
    try { payload = await response.json(); }
    catch { throw new Error(`El servidor devolvió una respuesta inválida (HTTP ${response.status}).`); }
    if (!response.ok || payload.success === false) {
        throw new Error(payload.error || `Error del servidor (HTTP ${response.status}).`);
    }
    return payload;
}

/* Comprime la imagen para que no supere 60 KB (regla de la app). */
function fitImageToLimit(image) {
    const maxBytes = 60 * 1024;
    let fallback = '';
    for (const maxSide of [1400, 1000, 720]) {
        const scale = Math.min(1, maxSide / Math.max(image.width, image.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(image.width * scale));
        canvas.height = Math.max(1, Math.round(image.height * scale));
        canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
        for (const quality of [0.82, 0.7, 0.6, 0.5, 0.42, 0.35]) {
            const candidate = canvas.toDataURL('image/jpeg', quality);
            fallback = candidate;
            if (Math.floor(candidate.length * 3 / 4) <= maxBytes) return candidate;
        }
    }
    return fallback;
}

function fitDataUrlToLimit(dataUrl) {
    return new Promise((resolve) => {
        const image = new Image();
        image.onload = () => resolve(fitImageToLimit(image));
        image.onerror = () => resolve(dataUrl);
        image.src = dataUrl;
    });
}

async function uploadRemoteImage(trickId, imageData) {
    const formData = new FormData();
    formData.append('trickId', trickId);
    formData.append('imageData', imageData);
    const response = await fetch(`${IMAGE_STORE_URL}?action=save`, {
        method: 'POST',
        cache: 'no-store',
        credentials: 'same-origin',
        body: formData
    });
    const payload = await readServerJson(response);
    if (!payload.url) throw new Error('El servidor no devolvió la dirección de la imagen.');
    return payload.url;
}

/* ── Catálogo publicado + publicación en GitHub ──────────────────────────────
   El botón «Publicar» no manda todo el catálogo: manda SOLO la diferencia con
   el catálogo de serie (tarjetas tocadas, tarjetas propias y borradas). Así el
   fichero que vive en el repositorio es pequeño, el catálogo puede seguir
   creciendo por debajo y esos cambios se aplican encima en cualquier navegador.
   Las imágenes propias (data:image/...) se envían aparte y el servidor las
   guarda como assets/publicado/<id>.jpg.

   OJO con sortOrder: la app reparte números de orden por carpeta y esos números
   cambian con el tiempo (cada vez que entran tarjetas nuevas), así que NO se
   comparan. Lo que sí se publica es el ORDEN real: si la secuencia de tarjetas
   de una carpeta ya no coincide con la del catálogo, va en `orden`. */

const CAMPOS_PUBLICABLES = ['title', 'description', 'category', 'codeSnippet', 'customPrompt', 'imageUrl'];

function esImagenPropia(url) {
    return typeof url === 'string' && url.startsWith('data:image/');
}

async function loadPublishedCatalogue() {
    try {
        const response = await fetch(`${CATALOGO_URL}?t=${Date.now()}`, { cache: 'no-store', credentials: 'same-origin' });
        if (!response.ok) return null;
        const capa = await response.json();
        return capa && Number(capa.version) === 1 ? capa : null;
    } catch {
        return null;   // sin capa publicada: se usa el catálogo de serie
    }
}

function applyPublishedCatalogue(items, capa) {
    if (!capa) return items;
    const borradas = new Set((capa.borradas || []).map(String));
    const tarjetas = (capa.tarjetas && typeof capa.tarjetas === 'object') ? capa.tarjetas : {};
    let salida = items
        .filter(t => !borradas.has(String(t.id)))
        .map(t => tarjetas[t.id] ? { ...t, ...tarjetas[t.id] } : t);
    const conocidos = new Set(salida.map(t => String(t.id)));
    for (const nueva of (capa.nuevas || [])) {
        if (nueva && nueva.id && !conocidos.has(String(nueva.id))) {
            salida = [nueva, ...salida];
            conocidos.add(String(nueva.id));
        }
    }
    // Orden publicado por carpeta: se traduce a sortOrder para que la app lo
    // respete; el resto de tarjetas de esa carpeta conservan su sitio detrás.
    const orden = (capa.orden && typeof capa.orden === 'object') ? capa.orden : {};
    for (const [categoria, ids] of Object.entries(orden)) {
        if (!Array.isArray(ids)) continue;
        const posicion = new Map(ids.map((id, i) => [String(id), i]));
        salida = salida.map(t => (t.category === categoria && posicion.has(String(t.id)))
            ? { ...t, sortOrder: posicion.get(String(t.id)) }
            : t);
    }
    return salida;
}

function prepararImagenPublicada(trick, imagenes) {
    const url = trick.imageUrl || '';
    if (esImagenPropia(url)) {
        imagenes[trick.id] = url;
        return `assets/publicado/${trick.id}.jpg`;
    }
    return url;
}

/** Diferencia entre lo que tengo y el catálogo de serie (opcionalmente, de UNA carpeta). */
function buildPublishPayload(tricks, semillas, carpeta = '') {
    // La base es el catálogo de serie tal como lo ordena la app. Los números de
    // sortOrder NO se comparan (cambian solos con el tiempo): del orden solo se
    // publica la secuencia, y únicamente si de verdad es distinta.
    const semillasOrdenadas = normalizeTrickOrder(semillas);
    const enCarpeta = t => !carpeta || t.category === carpeta;
    const lista = tricks.filter(enCarpeta);
    const base = new Map(semillasOrdenadas.filter(enCarpeta).map(s => [String(s.id), s]));
    const tarjetas = {};
    const nuevas = [];
    const imagenes = {};
    const desglose = {};
    const vivos = new Set();

    for (const trick of lista) {
        vivos.add(String(trick.id));
        const imagen = prepararImagenPublicada(trick, imagenes);
        const propria = esImagenPropia(trick.imageUrl || '');
        const original = base.get(String(trick.id));
        if (!original) {
            nuevas.push({ ...trick, imageUrl: imagen });
            continue;
        }
        const dif = {};
        // '' y null/undefined son lo mismo: si no, publicar un customPrompt ""
        // dejaba la tarjeta marcada como «modificada» para siempre.
        const normalizar = v => (v === undefined || v === null || v === '') ? null : v;
        for (const campo of CAMPOS_PUBLICABLES) {
            // La imagen SOLO se publica cuando es tuya (data:image/...). Las del
            // catálogo o del almacén se resuelven solas en cada navegador, y
            // publicarlas congelaría versiones antiguas encima de las nuevas.
            if (campo === 'imageUrl' && !propria) continue;
            const valor = campo === 'imageUrl' ? imagen : (trick[campo] ?? null);
            if (JSON.stringify(normalizar(valor)) !== JSON.stringify(normalizar(original[campo] ?? null))) {
                dif[campo] = valor;
                desglose[campo] = (desglose[campo] || 0) + 1;
            }
        }
        if (Object.keys(dif).length) tarjetas[trick.id] = dif;
    }

    // Nunca publicar como borradas las que el propio catálogo descarta, ni las
    // que solo se han MOVIDO a otra carpeta (si se publica una carpeta, esas
    // tarjetas no están en `lista` pero siguen existiendo).
    const existentes = new Set(tricks.map(t => String(t.id)));
    const borradas = [...base.keys()].filter(id =>
        !vivos.has(id) && !existentes.has(id) && !REMOVED_IMAGE_IDS.has(id));

    // Orden por carpeta: solo las carpetas cuya secuencia de tarjetas ha cambiado.
    const secuencia = lista2 => {
        const porCategoria = new Map();
        for (const t of lista2) {
            if (!porCategoria.has(t.category)) porCategoria.set(t.category, []);
            porCategoria.get(t.category).push(String(t.id));
        }
        return porCategoria;
    };
    const ahora = secuencia(lista);
    const antes = secuencia(semillasOrdenadas.filter(s => vivos.has(String(s.id))));
    const orden = {};
    for (const [categoria, ids] of ahora) {
        const previos = antes.get(categoria) || [];
        if (ids.length !== previos.length || ids.some((id, i) => id !== previos[i])) orden[categoria] = ids;
    }

    return {
        catalogo: {
            version: 1,
            tarjetas,
            nuevas,
            borradas,
            orden,
            // Si se publica UNA carpeta, se dice cuál y qué tarjetas son suyas:
            // el servidor borra de la capa anterior esas entradas antes de
            // mezclar, para que lo publicado refleje fielmente esa carpeta.
            carpetas: carpeta ? [carpeta] : [],
            ids: carpeta ? lista.map(t => String(t.id)) : [],
        },
        imagenes,
        resumen: {
            cambiadas: Object.keys(tarjetas).length,
            nuevas: nuevas.length,
            borradas: borradas.length,
            imagenes: Object.keys(imagenes).length,
            reordenadas: Object.keys(orden).length,
            desglose,
        },
    };
}

function isGeneratedCardImage(imageUrl) {
    return typeof imageUrl === 'string' && GENERATED_IMAGE_RELEASES.some(release => imageUrl.startsWith(release.prefix));
}
function migrateGeneratedCardImages(items) {
    const pendingReleases = new Set(GENERATED_IMAGE_RELEASES.filter(release => localStorage.getItem(release.key) !== release.version));
    return items.map(item => {
        const command = getImageCommandKey(item);
        // Tarjeta sin imagen cuyo comando ya tiene ejemplo en el repositorio: se
        // le pone (carpetas que se quedaron sin ejemplos por no haberse subido
        // nunca al servidor, como Juegos y temporadas o Tú en otro mundo).
        if (!item.imageUrl) {
            const own = seedAssetImage(command);
            if (own) return { ...item, imageUrl: own };
        }
        // El ejemplo del servidor de este código está contaminado: se usa el del
        // repositorio (nunca la imagen ajena), salvo que la tarjeta tenga una
        // imagen personal propia todavía sin subir.
        if (isBrokenStoreImage(command) && !String(item.imageUrl || '').startsWith('data:image/')) {
            const own = seedAssetImage(command);
            return own && own !== item.imageUrl ? { ...item, imageUrl: own } : item;
        }
        // El ejemplo nuevo al que pertenece la tarjeta se deduce del CÓDIGO, no
        // del id ni de la carpeta guardada: así también lo reciben las tarjetas
        // con un id de una numeración anterior.
        const seedImage = SEED_COMMAND_IMAGES[command];
        const release = GENERATED_IMAGE_RELEASES.find(candidate => seedImage?.startsWith(candidate.prefix));
        const legacyExample = !item.imageUrl || item.imageUrl.startsWith('uploads/visual-') || isGeneratedCardImage(item.imageUrl);
        return release && legacyExample && (!item.imageUrl || pendingReleases.has(release))
            ? { ...item, imageUrl: seedImage }
            : item;
    });
}
function applyRemoteImages(items, remoteImages) {
    return items.map(trick => {
        const imageUrl = trick.imageUrl || '';
        const command = getImageCommandKey(trick);
        const seedImage = SEED_COMMAND_IMAGES[command];
        // Imagen personal aún sin subir, o ejemplo nuevo ya colocado en este
        // código: se respeta tal cual.
        if (imageUrl.startsWith('data:image/') || (isGeneratedCardImage(imageUrl) && seedImage === imageUrl)) return trick;
        // El ejemplo del servidor de este código fue sobrescrito por una imagen
        // ajena: se usa el del repositorio si existe (y si no, no se toca).
        if (isBrokenStoreImage(command)) {
            const own = seedAssetImage(command);
            return own && own !== imageUrl ? { ...trick, imageUrl: own } : trick;
        }
        // Tarjeta sin imagen: si su comando ya tiene ejemplo en el repositorio,
        // se le pone ahora.
        if (!imageUrl) {
            const own = seedAssetImage(command);
            return own ? { ...trick, imageUrl: own } : trick;
        }
        // Cada variante conserva su identidad, incluso si comparte /comando.
        const recovered = RESTORED_VARIANTS.find(variant => variant.id === trick.id ||
            (variant.codeSnippet === command && String(variant.customPrompt || '') === String(trick.customPrompt || '')));
        const reusedId = RESTORED_VARIANTS.some(variant => variant.imageStorageId === trick.id && variant.codeSnippet !== command);
        // La imagen se busca por CÓDIGO. El id guardado en el navegador puede
        // venir de una numeración anterior (ver SEED_ID_BY_COMMAND) y entonces
        // apuntaba a la imagen de otro comando. Las tarjetas personales (id que
        // no es de catálogo) siguen usando su propia imagen.
        const canonicalId = SEED_ID_BY_COMMAND[command];
        const catalogCard = /^(ig-dcek|xl-cmd|cap-cmd)-\d{3}$/.test(String(trick.id));
        const byCode = catalogCard && canonicalId ? remoteImages[canonicalId] : null;
        // Si el id pertenece a la imagen de una variante personal, no se usa como
        // respaldo: esa imagen es de la variante, no de esta tarjeta.
        const byOwnId = reusedId ? null : remoteImages[trick.id];
        const remoteUrl = recovered ? remoteImages[recovered.imageStorageId] : (byCode || byOwnId || null);
        return remoteUrl && remoteUrl !== imageUrl ? { ...trick, imageUrl: remoteUrl } : trick;
    });
}

function mergeSeedCards(saved, initial) {
    const existingIds = new Set(saved.map(item => item.id));
    const newItems = initial.filter(seed => {
        if (existingIds.has(seed.id)) return false;
        // Una variante recuperada puede seguir con su antiguo ID en este navegador.
        if (RESTORED_VARIANTS.some(variant => variant.id === seed.id)) {
            return !saved.some(item => item.codeSnippet === seed.codeSnippet && String(item.customPrompt || '') === String(seed.customPrompt || ''));
        }
        return true;
    });
    return [...newItems, ...saved];
}

function variantFavoriteIds(variant) {
    const list = Array.isArray(variant?.legacyFavoriteIds) ? variant.legacyFavoriteIds : [];
    return variant?.legacyFavoriteId ? [variant.legacyFavoriteId, ...list] : list;
}

function applyRemoteFavorites(items, ids) {
    const favorites = new Set(ids);
    return items.map(item => {
        const recovered = RESTORED_VARIANTS.find(variant => variant.id === item.id ||
            (variant.codeSnippet === item.codeSnippet && String(variant.customPrompt || '') === String(item.customPrompt || '')));
        // Los IDs reutilizados del catálogo no heredan el favorito de otra variante.
        const oldOwner = RESTORED_VARIANTS.find(variant => variantFavoriteIds(variant).includes(item.id));
        const ownsId = !oldOwner || oldOwner.codeSnippet === item.codeSnippet;
        return { ...item, isFavorite: (ownsId && favorites.has(item.id)) ||
            !!(recovered && (variantFavoriteIds(recovered).some(id => favorites.has(id)) || favorites.has(recovered.id))) };
    });
}

function useLocalStorage(key, initial) {
    const [val, setVal] = useState(() => {
        try {
            const saved = localStorage.getItem(key);
            if (!saved) return normalizeTrickOrder(migrateGeneratedCardImages(normalizeTrickCategories(initial)));
            const parsed = JSON.parse(saved);
            if (!Array.isArray(parsed)) return normalizeTrickOrder(migrateGeneratedCardImages(normalizeTrickCategories(initial)));
            const filtered = parsed.filter(item => !REMOVED_IMAGE_IDS.has(String(item.id)));
            const migrated = normalizeTrickCategories(filtered);
            if (filtered.length !== parsed.length || migrated.some((item, i) => item.category !== filtered[i].category)) {
                localStorage.setItem(key, JSON.stringify(migrated));
            }
            const merged = mergeSeedCards(migrated, initial);
            return normalizeTrickOrder(cleanLegacyImageCommandDescriptions(migrateGeneratedCardImages(merged)));
        } catch { return initial; }
    });

    useEffect(() => {
        try {
            localStorage.setItem(key, JSON.stringify(val));
            // Marca la versión después de guardar los datos migrados.
            for (const release of GENERATED_IMAGE_RELEASES) localStorage.setItem(release.key, release.version);
        }
        catch(e) { console.warn('localStorage full', e); }
    }, [key, val]);

    return [val, setVal];
}

function useFolders() {
    const [folders, setFolders] = useState(loadFolders);

    useEffect(() => {
        try {
            localStorage.setItem(FOLDERS_KEY, JSON.stringify(folders));
            localStorage.setItem(FOLDERS_SCHEMA_KEY, String(FOLDERS_SCHEMA_VERSION));
        } catch(e) { console.warn('localStorage full', e); }
    }, [folders]);

    return [folders, setFolders];
}

   COMPONENT: Lightbox
   ═══════════════════════════════════════════════ */
function Lightbox({ src, onClose }) {
    const [zoom, setZoom] = useState(1);

    useEffect(() => {
        const handler = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', handler);
        return () => document.removeEventListener('keydown', handler);
    }, [onClose]);

    useEffect(() => { setZoom(1); }, [src]);

    const handleWheel = (e) => {
        e.preventDefault();
        e.stopPropagation();
        setZoom(z => Math.min(6, Math.max(0.5, z * (e.deltaY < 0 ? 1.15 : 0.87))));
    };

    return (
        <div className="lightbox" onClick={onClose} onWheel={handleWheel}>
            <img
                src={src}
                alt="Vista ampliada"
                draggable={false}
                style={{ transform: `scale(${zoom})`, cursor: 'zoom-out' }}
                onClick={onClose}
            />
            <button className="lightbox-close" onClick={onClose} aria-label="Cerrar lightbox">✕</button>
        </div>
    );
}

function PasswordModal({ onSubmit, onClose }) {
    const [password, setPassword] = useState('');
    const [error, setError] = useState('');
    const [submitting, setSubmitting] = useState(false);

    useEffect(() => {
        const handler = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', handler);
        return () => document.removeEventListener('keydown', handler);
    }, [onClose]);

    async function handleSubmit(e) {
        e.preventDefault();
        if (submitting) return;
        if (!password) {
            setError('Introduce la contraseña para continuar.');
            return;
        }
        setSubmitting(true);
        const accepted = await onSubmit(password);
        if (!accepted) {
            setError('Contraseña incorrecta.');
            setPassword('');
            setSubmitting(false);
        }
    }

    return (
        <div className="modal-overlay" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
            <div className="modal" role="dialog" aria-modal="true" aria-label="Contraseña de edición">
                <div className="modal-header">
                    <h2>🔒 Edición protegida</h2>
                    <button className="modal-close" onClick={onClose} aria-label="Cerrar">✕</button>
                </div>
                <form onSubmit={handleSubmit}>
                    <div className="modal-body">
                        <p style={{marginTop:0,color:'var(--muted)'}}>Introduce la contraseña para añadir, editar o eliminar trucos.</p>
                        <label htmlFor="edit-password">Contraseña</label>
                        <input
                            id="edit-password"
                            type="password"
                            value={password}
                            onChange={(e) => { setPassword(e.target.value); setError(''); }}
                            autoFocus
                            autoComplete="current-password"
                        />
                        {error && <p role="alert" style={{color:'var(--neon-pink)',margin:'0.5rem 0 0',fontSize:'0.85rem'}}>{error}</p>}
                    </div>
                    <div className="modal-footer">
                        <button type="button" className="btn btn-glass" onClick={onClose} disabled={submitting}>Cancelar</button>

                    </div>
                </form>
            </div>
        </div>
    );
}

/* ═══════════════════════════════════════════════
   COMPONENT: TrickForm (Add / Edit Modal)
   ═══════════════════════════════════════════════ */
function TrickForm({ trick, folders, onSave, onClose, onDelete }) {
    const isEdit = !!trick;
    const [formError, setFormError] = useState('');
    const [saving, setSaving] = useState(false);
    const [promptCopied, setPromptCopied] = useState(false);
    const fullPrompt = isEdit && (isImageCommandTrick(trick) || isTextCommandTrick(trick)) ? getTrickCopyText(trick) : '';
    const [promptDraft, setPromptDraft] = useState(fullPrompt);
    const [form, setForm] = useState(() => trick ? {
        ...trick,
        tags: Array.isArray(trick.tags) ? trick.tags.join(', ') : (trick.tags || '')
    } : {
        title: '', description: '', category: folders?.[0]?.id || 'xl-dev', tags: '',
        codeSnippet: '', imageUrl: '', sourceUrl: '', difficulty: 'beginner', isFavorite: false
    });

    function handleChange(e) {
        const { name, value, type, checked } = e.target;
        setFormError('');
        setForm(prev => ({ ...prev, [name]: type === 'checkbox' ? checked : value }));
    }

    function handleImageChange(e) {
        const file = e.target.files?.[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
            setFormError('Selecciona un archivo de imagen válido.');
            e.target.value = '';
            return;
        }

        const reader = new FileReader();
        reader.onload = () => {
            const image = new Image();
            image.onload = () => {
                const dataUrl = fitImageToLimit(image);
                setForm(prev => ({ ...prev, imageUrl: dataUrl }));
                setFormError('');
            };
            image.onerror = () => setFormError('No se pudo leer esa imagen.');
            image.src = reader.result;
        };
        reader.onerror = () => setFormError('No se pudo cargar esa imagen.');
        reader.readAsDataURL(file);
        e.target.value = '';
    }

    async function handleSubmit(e) {
        e.preventDefault();
        if (saving) return;
        const title = String(form.title || '').trim();
        const description = String(form.description || '').trim();
        if (!title) {
            setFormError('Completa el título para guardar la tarjeta.');
            return;
        }
        const tags = (Array.isArray(form.tags) ? form.tags : String(form.tags || '').split(','))
            .map(t => t.trim()).filter(Boolean);
        let customPrompt = '';
        if (fullPrompt) {
            const draft = promptDraft.trim();
            if (draft && draft !== fullPrompt) customPrompt = draft;
        }
        setSaving(true);
        const saved = await onSave({ ...form, title, description, tags, customPrompt });
        if (saved === false) setSaving(false);
    }

    const fields = [
        { label: 'Título *', name: 'title', type: 'text', placeholder: 'Ej: Atajo para buscar en el historial' },
        { label: 'Descripción', name: 'description', type: 'textarea', placeholder: 'Explica el truco, cuándo usarlo y por qué es útil...', rows: 3 },
        { label: 'Código / Comando', name: 'codeSnippet', type: 'textarea', placeholder: 'Ej: /flashcard o un comando de terminal…', rows: 3 },
        { label: 'Carpeta', name: 'category', type: 'select', options: (folders && folders.length ? folders : DEFAULT_FOLDERS).map(c => ({ value: c.id, label: `${c.icon} ${c.label}` })) },
    ];

    return (
        <div className="modal-overlay" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
            <div className="modal" role="dialog" aria-modal="true" aria-label={isEdit ? 'Editar truco' : 'Nuevo truco'}>
                <div className="modal-header">
                    <h2>{isEdit ? '✏️ Editar Truco' : '💎 Nuevo Truco'}</h2>
                    <button className="modal-close" onClick={onClose} aria-label="Cerrar">✕</button>
                </div>
                <form onSubmit={handleSubmit}>
                    <div className="modal-body">
                        {fields.map(f => {
                            if (f.type === 'select') return (
                                <div key={f.name}>
                                    <label htmlFor={`field-${f.name}`}>{f.label}</label>
                                    <select id={`field-${f.name}`} name={f.name} value={form[f.name]} onChange={handleChange}>
                                        {f.options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                                    </select>
                                </div>
                            );
                            if (f.type === 'textarea') return (
                                <div key={f.name}>
                                    <label htmlFor={`field-${f.name}`}>{f.label}</label>
                                    <textarea id={`field-${f.name}`} name={f.name} value={form[f.name]} onChange={handleChange} placeholder={f.placeholder} rows={f.rows || 3} />
                                </div>
                            );
                            return (
                                <div key={f.name}>
                                    <label htmlFor={`field-${f.name}`}>{f.label}</label>

                                </div>
                            );
                        })}
                        {fullPrompt && (
                            <div className="prompt-full-preview">
                                <label htmlFor="field-full-prompt">📋 Prompt completo (el que se copia con el botón de la tarjeta)</label>
                                <textarea id="field-full-prompt" value={promptDraft} rows={6} onChange={(e) => setPromptDraft(e.target.value)} />
                                <button
                                    type="button"
                                    className="btn btn-glass btn-sm"
                                    onClick={() => {
                                        navigator.clipboard.writeText(promptDraft).then(() => {
                                            setPromptCopied(true);
                                            setTimeout(() => setPromptCopied(false), 2000);
                                        }).catch(() => {});
                                    }}
                                >{promptCopied ? '✓ Copiado' : '📋 Copiar prompt'}</button>
                            </div>

                        <div className="image-upload-field">
                            <label htmlFor="field-image">Imagen de ejemplo</label>
                            <input id="field-image" type="file" accept="image/*" onChange={handleImageChange} />

                            {form.imageUrl && (
                                <div className="image-upload-preview">
                                    <img src={form.imageUrl} alt="Vista previa de la imagen de ejemplo" />
                                    <button type="button" className="btn btn-glass btn-sm" onClick={() => setForm(prev => ({ ...prev, imageUrl: '' }))}>Quitar imagen</button>
                                </div>
                            )}
                        </div>
                        {formError && <p className="form-error" role="alert">{formError}</p>}
                        <label style={{display:'flex',alignItems:'center',gap:'0.5rem',cursor:'pointer',marginTop:'0.5rem'}}>
                            <input type="checkbox" name="isFavorite" checked={form.isFavorite} onChange={handleChange} style={{width:'auto'}} />
                            <span style={{color:'var(--neon-pink)',fontSize:'0.9rem'}}>⭐ Marcar como favorito</span>
                        </label>
                    </div>
                    <div className="modal-footer">
                        {isEdit && <button type="button" className="btn btn-danger" onClick={onDelete} style={{marginRight:'auto'}}>🗑️ Eliminar</button>}
                        <button type="button" className="btn btn-glass" onClick={onClose} disabled={saving}>Cancelar</button>
                        <button type="submit" className="btn btn-primary" disabled={saving}>{saving ? 'Guardando…' : (isEdit ? '💾 Guardar Cambios' : '✨ Crear Truco')}</button>
                    </div>
                </form>
            </div>
        </div>
    );
}

/* ═══════════════════════════════════════════════
   COMPONENT: TrickCard
   ═══════════════════════════════════════════════ */
function TrickCard({ trick, onToggleFav, onEdit, onImageClick, onCopy, copiedId, canEdit = false, canDrag = false, isDragging = false, isDragOver = false, onDragStart, onDragOver, onDrop, onDragEnd }) {
    function handleDragStart(event) {
        if (!canDrag || event.target.closest('button, input, a, img')) {
            event.preventDefault();
            return;
        }
        if (event.dataTransfer) {
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', trick.id);
        }
        onDragStart?.(event, trick);
    }

    return (
        <div
            className={['trick-card', trick.isFavorite ? 'favorite' : '', canDrag ? 'is-draggable' : '', isDragging ? 'is-dragging' : '', isDragOver ? 'is-drag-over' : ''].filter(Boolean).join(' ')}
            draggable={canDrag}
            onDragStart={handleDragStart}
            onDragOver={(event) => {
                if (!canDrag || !onDragOver) return;
                event.preventDefault();
                onDragOver(event, trick);
            }}
            onDrop={(event) => {
                if (!canDrag || !onDrop) return;
                event.preventDefault();
                onDrop(event, trick);
            }}
            onDragEnd={onDragEnd}
        >
            <div className="trick-card-header">
                <h3>{trick.title}</h3>
                <div className="actions">
                    {canDrag && <span className="drag-handle" title="Arrastra para recolocar" aria-label="Arrastra para recolocar">⠿</span>}
                    <button className={`fav-btn ${trick.isFavorite ? 'active' : ''}`} onClick={() => onToggleFav(trick.id)} title={trick.isFavorite ? 'Quitar de favoritos' : 'Añadir a favoritos'} aria-label={trick.isFavorite ? 'Quitar de favoritos' : 'Añadir a favoritos'} aria-pressed={trick.isFavorite}>{trick.isFavorite ? '⭐' : '☆'}</button>
                    {canEdit && <button onClick={() => onEdit(trick)} title="Editar" aria-label="Editar truco">✏️</button>}
                </div>
            </div>

            {trick.description && <p className="description">{trick.description}</p>}

            {trick.imageUrl && (
                <img src={trick.imageUrl} alt={trick.title} className="trick-image" onClick={() => onImageClick(trick.imageUrl)} loading="lazy" />
            )}

            {trick.codeSnippet && (
                <div className="code-snippet" onSelectStart={(event) => event.preventDefault()}>
                    <button className={`copy-btn ${copiedId === trick.id ? 'copied' : ''}`} onClick={() => onCopy(trick)} title={(isImageCommandTrick(trick) || isTextCommandTrick(trick)) ? 'Copiar prompt completo' : 'Copiar código'} aria-label={(isImageCommandTrick(trick) || isTextCommandTrick(trick)) ? 'Copiar prompt completo al portapapeles' : 'Copiar código al portapapeles'}>
                        {copiedId === trick.id ? '✓' : '📋'}
                    </button>
                    <span className="code-value">{trick.codeSnippet}</span>
                </div>
            )}

            <div className="card-footer">
                <span className="date">{formatDate(trick.createdAt)}</span>
                {trick.updatedAt && trick.updatedAt !== trick.createdAt && (
                    <span className="date-updated">Actualizado {formatDate(trick.updatedAt)}</span>
                )}
            </div>
        </div>
    );
}

/* ═══════════════════════════════════════════════
   COMPONENT: CategoryGrid (Main Dashboard)
   ═══════════════════════════════════════════════ */
function CategoryGrid({ tricks, folders, onSelectCategory, canEdit, onDeleteFolder, onReorderFolders }) {
    const counts = useMemo(() => {
        const map = {};
        tricks.forEach(t => { map[t.category] = (map[t.category] || 0) + 1; });
        return map;
    }, [tricks]);
    const favCount = useMemo(() => tricks.filter(t => t.isFavorite).length, [tricks]);
    const draggingFolderRef = useRef(null);
    const suppressClickRef = useRef(false);
    const [draggingFolderId, setDraggingFolderId] = useState(null);
    const [dragOverFolderId, setDragOverFolderId] = useState(null);

    const cardKeyDown = (event, id) => {
        if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            onSelectCategory(id);
        }
    };

    const handleFolderDragStart = (event, cat) => {
        if (!canEdit) { event.preventDefault(); return; }
        if (event.target.closest('button')) { event.preventDefault(); return; }
        draggingFolderRef.current = cat.id;
        suppressClickRef.current = true;
        setDraggingFolderId(cat.id);
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('folder/id', cat.id);
    };

    const handleFolderDragOver = (event, cat) => {
        if (!canEdit || !draggingFolderRef.current || draggingFolderRef.current === cat.id) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = 'move';
        if (dragOverFolderId !== cat.id) setDragOverFolderId(cat.id);
    };

    const handleFolderDrop = (event, cat) => {
        if (!canEdit || !draggingFolderRef.current) return;
        event.preventDefault();
        const sourceId = event.dataTransfer.getData('folder/id') || draggingFolderRef.current;
        setDragOverFolderId(null);
        if (sourceId && sourceId !== cat.id) onReorderFolders(sourceId, cat.id);
    };

    return (
        <div className="category-grid">
            {folders.map(cat => (
                <div
                    key={cat.id}
                    className={`category-card ${cat.color}-border ${cat.id === 'favorites' ? 'favorites-card' : ''} ${canEdit ? 'is-draggable' : ''} ${draggingFolderId === cat.id ? 'is-dragging' : ''} ${dragOverFolderId === cat.id ? 'is-drag-over' : ''}`}
                    onClick={() => { if (!suppressClickRef.current) onSelectCategory(cat.id); }}
                    onKeyDown={(e) => cardKeyDown(e, cat.id)}
                    role="button"
                    tabIndex="0"
                    aria-label={`${cat.label}: ${cat.id === 'favorites' ? favCount : (counts[cat.id] || 0)} trucos`}
                    draggable={canEdit}
                    title={canEdit ? "Arrastra esta carpeta sobre otra para cambiar su posición" : undefined}
                    onDragStart={(e) => handleFolderDragStart(e, cat)}
                    onDragOver={(e) => handleFolderDragOver(e, cat)}
                    onDrop={(e) => handleFolderDrop(e, cat)}
                    onDragLeave={(e) => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOverFolderId(null); }}
                    onDragEnd={() => {
                        draggingFolderRef.current = null;
                        setDraggingFolderId(null);
                        setDragOverFolderId(null);
                        setTimeout(() => { suppressClickRef.current = false; }, 0);
                    }}
                >
                    {canEdit && cat.id !== 'favorites' && (
                        <button
                            className="folder-delete"
                            onClick={(e) => { e.stopPropagation(); onDeleteFolder(cat); }}
                            aria-label={`Eliminar carpeta ${cat.label}`}
                            title="Eliminar carpeta"
                        >✕</button>
                    )}
                    {canEdit && <span className="folder-drag-handle" aria-hidden="true">⠿</span>}
                    <div className="bg-icon">{cat.bgIcon}</div>
                    <div className={`cat-icon ${cat.color}`}>{cat.icon}</div>
                    <h3>{cat.label}</h3>
                    <span className="cat-count">{cat.id === 'favorites' ? favCount : (counts[cat.id] || 0)} trucos</span>
                </div>
            ))}


        </div>
    );
}

function TrickList({ tricks, folders, categoryId, onBack, onToggleFav, onEdit, onImageClick, onCopy, copiedId, onAdd, canEdit, search, setSearch, filter, setFilter, onReorder, onMoveTrick, onSelectFolder }) {
    const cat = getCat(categoryId, folders);
    const [draggingId, setDraggingId] = useState(null);
    const [dragOverId, setDragOverId] = useState(null);
    const [dragOverFolder, setDragOverFolder] = useState(null);

    const filtered = useMemo(() => {
        let result = categoryId === 'favorites'
            ? tricks.filter(t => t.isFavorite)
            : tricks.filter(t => t.category === categoryId);
        if (search.trim()) {
            const q = search.toLowerCase();
            result = result.filter(t => t.title.toLowerCase().includes(q) || t.description.toLowerCase().includes(q) || (t.codeSnippet || '').toLowerCase().includes(q) || t.tags.some(tg => tg.toLowerCase().includes(q)));
        }
        if (filter === 'favorites') result = result.filter(t => t.isFavorite);
        if (filter === 'beginner' || filter === 'intermediate' || filter === 'advanced') result = result.filter(t => t.difficulty === filter);
        return result.sort(compareTricks);
    }, [tricks, categoryId, search, filter]);

    function handleDragStart(event, trick) {
        setDraggingId(trick.id);
        setDragOverId(null);
    }

    function handleDragOver(event, trick) {
        if (draggingId && trick.id !== draggingId) setDragOverId(trick.id);
    }

    function resetDragState() {
        setDraggingId(null);
        setDragOverId(null);
    }

    function handleDrop(event, trick) {
        const sourceId = event.dataTransfer?.getData('text/plain') || draggingId;
        if (sourceId && sourceId !== trick.id) onReorder(categoryId, sourceId, trick.id);
        resetDragState();
    }

    return (
        <div>
            <button className="back-nav" onClick={onBack}>← Volver a carpetas</button>

            <div className="section-header">
                <h2>{cat?.icon} {cat?.label} <span style={{color:'var(--muted)',fontSize:'0.9rem',fontWeight:400}}>({filtered.length} trucos)</span></h2>
                <div className="search-wrap folder-search">
                    <span className="search-icon">🔍</span>
                    <input
                        type="text"
                        placeholder={`Buscar código por nombre en ${cat?.label || 'esta carpeta'}...`}
                        value={search}
                        onChange={(e) => setSearch(e.target.value)}
                        aria-label={`Buscar código por nombre en ${cat?.label || 'esta carpeta'}`}
                    />
                </div>
                {canEdit && <button className="btn btn-primary btn-sm" onClick={onAdd}>✨ Nuevo Truco</button>}
            </div>

            {canEdit && (
                <div className="folder-rail" role="group" aria-label="Mover tarjeta a otra carpeta">
                    <span className="folder-rail-label">Arrastra una tarjeta aquí para moverla:</span>
                    {folders.map(f => (
                        <button
                            key={f.id}
                            type="button"
                            className={`folder-chip ${f.id === categoryId ? 'current' : ''} ${dragOverFolder === f.id ? 'drag-over' : ''}`}
                            onClick={() => onSelectFolder(f.id)}
                            onDragOver={(e) => { e.preventDefault(); if (dragOverFolder !== f.id) setDragOverFolder(f.id); }}
                            onDragLeave={() => setDragOverFolder(prev => prev === f.id ? null : prev)}
                            onDrop={(e) => {
                                e.preventDefault();
                                setDragOverFolder(null);
                                const id = e.dataTransfer.getData('text/plain');
                                if (id) onMoveTrick(id, f.id);
                            }}
                        >{f.icon} {f.label}</button>
                    ))}
                    <button
                        type="button"
                        className={`folder-chip fav-chip ${dragOverFolder === 'favorites' ? 'drag-over' : ''}`}
                        title="Soltar aquí marca la tarjeta como favorita"
                        onClick={() => onSelectFolder('favorites')}
                        onDragOver={(e) => { e.preventDefault(); if (dragOverFolder !== 'favorites') setDragOverFolder('favorites'); }}
                        onDragLeave={() => setDragOverFolder(prev => prev === 'favorites' ? null : prev)}
                        onDrop={(e) => {
                            e.preventDefault();
                            setDragOverFolder(null);
                            const id = e.dataTransfer.getData('text/plain');
                            if (id) onMoveTrick(id, 'favorites');
                        }}
                    >⭐ Favoritos</button>
                </div>
            )}

            {canEdit && categoryId !== 'favorites' && <p className="drag-hint">⠿ Arrastra las tarjetas para cambiar su posición.</p>}

            {filtered.length === 0 ? (
                <div className="empty-state">
                    <div className="empty-icon">📭</div>
                    <h3>No hay trucos aquí todavía</h3>
                    <p>{search ? 'Prueba con otros términos de búsqueda' : '¡Añade tu primer truco!'}</p>
                </div>
            ) : (
                <div className="tricks-grid">
                    {filtered.map(t => (
                        <TrickCard
                            key={t.id}
                            trick={t}
                            onToggleFav={onToggleFav}
                            onEdit={onEdit}
                            onImageClick={onImageClick}
                            onCopy={onCopy}
                            copiedId={copiedId}
                            canEdit={canEdit}
                            canDrag={canEdit}
                            isDragging={draggingId === t.id}
                            isDragOver={dragOverId === t.id}
                            onDragStart={handleDragStart}
                            onDragOver={handleDragOver}
                            onDrop={handleDrop}
                            onDragEnd={resetDragState}
                        />
                    ))}
                </div>
            )}
        </div>
    );
}

/* ═══════════════════════════════════════════════
   COMPONENT: GlobalSearch
   ═══════════════════════════════════════════════ */
function GlobalSearch({ tricks, folders, onSelectCategory, onToggleFav, onEdit, onImageClick, onCopy, copiedId, canEdit }) {
    const [query, setQuery] = useState('');

    const results = useMemo(() => {
        if (!query.trim()) return [];
        const q = query.trim().toLowerCase();
        return tricks.filter(t =>
            t.title.toLowerCase().includes(q) ||
            (t.codeSnippet || '').toLowerCase().includes(q) ||
            t.description.toLowerCase().includes(q) ||
            t.tags.some(tg => tg.toLowerCase().includes(q)) ||
            (getCat(t.category, folders)?.label || '').toLowerCase().includes(q)
        ).sort((a, b) => b.createdAt - a.createdAt);
    }, [tricks, query, folders]);

    return (
        <div>
            <div className="section-header">
                <h2>🔍 Búsqueda Global</h2>
            </div>
            <div className="stats-bar">
                <div className="search-wrap">
                    <span className="search-icon">🔍</span>
                    <input type="text" placeholder="Buscar códigos en todas las carpetas..." value={query} onChange={e => setQuery(e.target.value)} aria-label="Buscar códigos en todas las carpetas" />
                </div>
                {query && <span className="stat-chip"><span className="count">{results.length}</span> resultados</span>}
            </div>

            {query && results.length === 0 ? (
                <div className="empty-state">
                    <div className="empty-icon">🔎</div>
                    <h3>Sin resultados</h3>
                    <p>Prueba con otros términos</p>
                </div>
            ) : query && (
                <div className="tricks-grid">
                    {results.map(t => (
                        <div key={t.id} style={{position:'relative'}}>
                            <TrickCard trick={t} onToggleFav={onToggleFav} onEdit={onEdit} onImageClick={onImageClick} onCopy={onCopy} copiedId={copiedId} canEdit={canEdit} />
                            <button className="btn btn-glass btn-sm" style={{position:'absolute',top:'0.5rem',right:'4rem',zIndex:2}} onClick={() => onSelectCategory(t.category)} title="Ir a la categoría">
                                📂 {getCat(t.category, folders)?.label}
                            </button>
                        </div>
                    ))}
                </div>
            )}
        </div>
    );
}

/* ═══════════════════════════════════════════════
   COMPONENT: ExportImport
   ═══════════════════════════════════════════════ */
function ExportImport({ tricks, onImport }) {
    const [show, setShow] = useState(false);
    const [importData, setImportData] = useState('');
    const fileRef = useRef(null);

    function handleExport() {
        const blob = new Blob([JSON.stringify(tricks, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `trickvault-backup-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function handleFileImport(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const data = JSON.parse(ev.target.result);
                if (Array.isArray(data) && data.every(d => d.id && d.title && d.category)) {
                    onImport(data);
                } else {
                    alert('El archivo no tiene el formato correcto de TrickVault.');
                }
            } catch { alert('Error al leer el archivo JSON.'); }
        };
        reader.readAsText(file);
        e.target.value = '';
    }

    return (
        <div style={{position:'relative'}}>
            <button className="btn btn-glass btn-sm" onClick={() => setShow(!show)}>⚙️ Datos</button>
            {show && (
                <div style={{position:'absolute',top:'100%',right:0, marginTop:'0.5rem', padding:'1rem', borderRadius:'var(--radius-md)', background:'var(--card-bg)', backdropFilter:'blur(20px)', border:'1px solid var(--border)', zIndex:100, minWidth:'220px', display:'flex', flexDirection:'column', gap:'0.75rem'}}>
                    <button className="btn btn-glass btn-sm" onClick={handleExport}>📥 Exportar JSON</button>
                    <label className="btn btn-glass btn-sm" style={{cursor:'pointer',textAlign:'center'}}>
                        📤 Importar JSON
                        <input type="file" accept=".json" ref={fileRef} onChange={handleFileImport} style={{display:'none'}} />
                    </label>
                    <span style={{fontSize:'0.7rem',color:'var(--muted)'}}>{tricks.length} trucos guardados</span>
                </div>
            )}
        </div>
    );
}
