const IMAGE_COMMAND_PROMPTS = new Map(
    Object.entries(PROMPT_TEMPLATES)
);

function getImageCommandKey(trick) {
    return typeof trick?.codeSnippet === "string" ? trick.codeSnippet.trim() : "";
}

function isImageCommandTrick(trick) {
    return IMAGE_COMMAND_PROMPTS.has(getImageCommandKey(trick));
}

function getTrickCopyText(trick) {
    const commandPrompt = IMAGE_COMMAND_PROMPTS.get(getImageCommandKey(trick));
    return commandPrompt || String(trick?.codeSnippet || "");
}
function hasSortOrder(trick) { return Number.isFinite(Number(trick.sortOrder)); }
function compareTricks(a, b) {
    const aOrder = hasSortOrder(a) ? Number(a.sortOrder) : null;
    const bOrder = hasSortOrder(b) ? Number(b.sortOrder) : null;
    if (aOrder !== null && bOrder !== null) return aOrder - bOrder;
    if (aOrder !== null) return -1;
    if (bOrder !== null) return 1;
    return b.createdAt - a.createdAt;
}
function normalizeTrickOrder(items) {
    const usedByCategory = new Map();
    const nextByCategory = new Map();
    items.forEach(item => {
        if (!hasSortOrder(item)) return;
        if (!usedByCategory.has(item.category)) usedByCategory.set(item.category, new Set());
        usedByCategory.get(item.category).add(Number(item.sortOrder));
    });
    return items.map(item => {
        if (hasSortOrder(item)) return item;
        const used = usedByCategory.get(item.category) || new Set();
        let next = nextByCategory.get(item.category) || 0;
        while (used.has(next)) next += 1;
        used.add(next);
        usedByCategory.set(item.category, used);
        nextByCategory.set(item.category, next + 1);
        return { ...item, sortOrder: next };
    });
}

async function readServerJson(response) {
    let payload;
    try { payload = await response.json(); }
    catch { throw new Error(`El servidor devolvió una respuesta inválida (HTTP ${response.status}).`); }
    if (!response.ok || payload.success === false) {
        throw new Error(payload.error || `Error del servidor (HTTP ${response.status}).`);
    }
    return payload;
}

async function loadRemoteImages() {
    const response = await fetch(`${IMAGE_STORE_URL}?action=list&t=${Date.now()}`, { cache: 'no-store', credentials: 'same-origin' });
    const payload = await readServerJson(response);
    return payload.images && typeof payload.images === 'object' ? payload.images : {};
}

async function authenticateRemote(password) {
    const formData = new FormData();
    formData.append('password', password);
    const response = await fetch(AUTH_URL, {
        method: 'POST',
        cache: 'no-store',
        credentials: 'same-origin',
        body: formData
    });
    await readServerJson(response);
    return true;
}

async function uploadRemoteImage(trickId, imageData) {
    const formData = new FormData();
    formData.append('trickId', trickId);
    formData.append('imageData', imageData);
    const response = await fetch(`${IMAGE_STORE_URL}?action=save`, {
        method: 'POST',
        cache: 'no-store',
        credentials: 'same-origin',
        body: formData
    });
    const payload = await readServerJson(response);
    if (!payload.url) throw new Error('El servidor no devolvió la dirección de la imagen.');
    return payload.url;
}

async function removeRemoteImage(trickId) {
    const formData = new FormData();
    formData.append('trickId', trickId);
    const response = await fetch(`${IMAGE_STORE_URL}?action=delete`, {
        method: 'POST',
        cache: 'no-store',
        credentials: 'same-origin',
        body: formData
    });
    return readServerJson(response);
}

/* ═══════════════════════════════════════════════
   HOOK: useLocalStorage
   ═══════════════════════════════════════════════ */
function useLocalStorage(key, initial) {
    const [val, setVal] = useState(() => {
        try {
            const saved = localStorage.getItem(key);
            if (!saved) return initial;
            const parsed = JSON.parse(saved);
            if (!Array.isArray(parsed)) return initial;
            const existingIds = new Set(parsed.map(item => item.id));
            const newSeedItems = initial.filter(item => !existingIds.has(item.id));
            const merged = newSeedItems.length ? [...newSeedItems, ...parsed] : parsed;
            return normalizeTrickOrder(cleanLegacyImageCommandDescriptions(merged));
        } catch { return initial; }
    });

    useEffect(() => {
        try { localStorage.setItem(key, JSON.stringify(val)); }
        catch(e) { console.warn('localStorage full', e); }
    }, [key, val]);

    return [val, setVal];
}

                <div key={t.id} className={`toast ${t.type}`} onClick={() => removeToast(t.id)}>

   ═══════════════════════════════════════════════ */
function Lightbox({ src, onClose }) {
    useEffect(() => {
        const handler = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', handler);
        return () => document.removeEventListener('keydown', handler);
    }, [onClose]);

    return (
        <div className="lightbox" onClick={onClose}>
            <img src={src} alt="Vista ampliada" />
            <button className="lightbox-close" onClick={onClose} aria-label="Cerrar lightbox">✕</button>
        </div>
    );
}

/* ═══════════════════════════════════════════════
   COMPONENT: PasswordModal (Edit access)
   ═══════════════════════════════════════════════ */
function PasswordModal({ onSubmit, onClose }) {
    const [password, setPassword] = useState('');
    const [error, setError] = useState('');
    const [submitting, setSubmitting] = useState(false);

    useEffect(() => {
        const handler = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', handler);
        return () => document.removeEventListener('keydown', handler);
    }, [onClose]);

    async function handleSubmit(e) {
        e.preventDefault();
        if (submitting) return;
        if (!password) {
            setError('Introduce la contraseña para continuar.');
            return;
        }
        setSubmitting(true);
        const accepted = await onSubmit(password);
        if (!accepted) {
            setError('Contraseña incorrecta.');
            setPassword('');
            setSubmitting(false);
        }
    }

    return (
        <div className="modal-overlay" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
            <div className="modal" role="dialog" aria-modal="true" aria-label="Contraseña de edición">
                <div className="modal-header">
                    <h2>🔒 Edición protegida</h2>
                    <button className="modal-close" onClick={onClose} aria-label="Cerrar">✕</button>
                </div>
                <form onSubmit={handleSubmit}>
                    <div className="modal-body">
                        <p style={{marginTop:0,color:'var(--muted)'}}>Introduce la contraseña para añadir, editar o eliminar trucos.</p>
                        <label htmlFor="edit-password">Contraseña</label>
                        <input
                            id="edit-password"
                            type="password"
                            value={password}
                            onChange={(e) => { setPassword(e.target.value); setError(''); }}
                            autoFocus
                            autoComplete="current-password"
                        />
                        {error && <p role="alert" style={{color:'var(--neon-pink)',margin:'0.5rem 0 0',fontSize:'0.85rem'}}>{error}</p>}
                    </div>
                    <div className="modal-footer">
                        <button type="button" className="btn btn-glass" onClick={onClose} disabled={submitting}>Cancelar</button>
                        <button type="submit" className="btn btn-primary" disabled={submitting}>{submitting ? 'Comprobando…' : '🔓 Continuar'}</button>
                    </div>
                </form>
            </div>
        </div>
    );
}

   ═══════════════════════════════════════════════ */
function TrickForm({ trick, onSave, onClose, onDelete }) {
    const isEdit = !!trick;
    const [formError, setFormError] = useState('');
    const [saving, setSaving] = useState(false);
    const [form, setForm] = useState(() => trick ? {
        ...trick,
        tags: Array.isArray(trick.tags) ? trick.tags.join(', ') : (trick.tags || '')
    } : {
        title: '', description: '', category: 'terminal', tags: '',
        codeSnippet: '', imageUrl: '', sourceUrl: '', difficulty: 'beginner', isFavorite: false
    });

    function handleChange(e) {
        const { name, value, type, checked } = e.target;
        setFormError('');
        setForm(prev => ({ ...prev, [name]: type === 'checkbox' ? checked : value }));
    }

    function handleImageChange(e) {
        const file = e.target.files?.[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
            setFormError('Selecciona un archivo de imagen válido.');
            e.target.value = '';
            return;
        }

        const reader = new FileReader();
        reader.onload = () => {
            const image = new Image();
            image.onload = () => {
                const maxSize = 1400;
                const scale = Math.min(1, maxSize / Math.max(image.width, image.height));
                const canvas = document.createElement('canvas');
                canvas.width = Math.max(1, Math.round(image.width * scale));
                canvas.height = Math.max(1, Math.round(image.height * scale));
                canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
                const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
                setForm(prev => ({ ...prev, imageUrl: dataUrl }));
                setFormError('');
            };
            image.onerror = () => setFormError('No se pudo leer esa imagen.');
            image.src = reader.result;
        };
        reader.onerror = () => setFormError('No se pudo cargar esa imagen.');
        reader.readAsDataURL(file);
        e.target.value = '';
    }

    async function handleSubmit(e) {
        e.preventDefault();
        if (saving) return;
        const title = String(form.title || '').trim();
        const description = String(form.description || '').trim();
        if (!title || !description) {
            setFormError('Completa el título y la descripción para guardar la tarjeta.');
            return;
        }
        const tags = (Array.isArray(form.tags) ? form.tags : String(form.tags || '').split(','))
            .map(t => t.trim()).filter(Boolean);
        setSaving(true);
        const saved = await onSave({ ...form, title, description, tags });
        if (saved === false) setSaving(false);
    }

    const fields = [
        { label: 'Título *', name: 'title', type: 'text', placeholder: 'Ej: Atajo para buscar en el historial' },
        { label: 'Descripción *', name: 'description', type: 'textarea', placeholder: 'Explica el truco, cuándo usarlo y por qué es útil...', rows: 3 },
        { label: 'Categoría', name: 'category', type: 'select', options: CATEGORIES.map(c => ({ value: c.id, label: `${c.icon} ${c.label}` })) },
    ];

    return (
        <div className="modal-overlay" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
            <div className="modal" role="dialog" aria-modal="true" aria-label={isEdit ? 'Editar truco' : 'Nuevo truco'}>
                <div className="modal-header">
                    <h2>{isEdit ? '✏️ Editar Truco' : '💎 Nuevo Truco'}</h2>
                    <button className="modal-close" onClick={onClose} aria-label="Cerrar">✕</button>
                </div>
                <form onSubmit={handleSubmit}>
                    <div className="modal-body">
                        {fields.map(f => {
                            if (f.type === 'select') return (
                                <div key={f.name}>
                                    <label htmlFor={`field-${f.name}`}>{f.label}</label>
                                    <select id={`field-${f.name}`} name={f.name} value={form[f.name]} onChange={handleChange}>
                                        {f.options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                                    </select>
                                </div>
                            );
                            if (f.type === 'textarea') return (
                                <div key={f.name}>
                                    <label htmlFor={`field-${f.name}`}>{f.label}</label>
                                    <textarea id={`field-${f.name}`} name={f.name} value={form[f.name]} onChange={handleChange} placeholder={f.placeholder} rows={f.rows || 3} />
                                </div>
                            );
                            return (
                                <div key={f.name}>
                                    <label htmlFor={`field-${f.name}`}>{f.label}</label>
                                    <input id={`field-${f.name}`} name={f.name} type={f.type} value={form[f.name]} onChange={handleChange} placeholder={f.placeholder} />
                                </div>
                            );
                        })}
                        <div className="image-upload-field">
                            <label htmlFor="field-image">Imagen de ejemplo</label>
                            <input id="field-image" type="file" accept="image/*" onChange={handleImageChange} />
                            <p className="field-help">Añade una imagen para verla dentro de esta tarjeta.</p>
                            {form.imageUrl && (
                                <div className="image-upload-preview">
                                    <img src={form.imageUrl} alt="Vista previa de la imagen de ejemplo" />
                                    <button type="button" className="btn btn-glass btn-sm" onClick={() => setForm(prev => ({ ...prev, imageUrl: '' }))}>Quitar imagen</button>
                                </div>
                            )}
                        </div>
                        {formError && <p className="form-error" role="alert">{formError}</p>}
                        <label style={{display:'flex',alignItems:'center',gap:'0.5rem',cursor:'pointer',marginTop:'0.5rem'}}>
                            <input type="checkbox" name="isFavorite" checked={form.isFavorite} onChange={handleChange} style={{width:'auto'}} />
                            <span style={{color:'var(--neon-pink)',fontSize:'0.9rem'}}>⭐ Marcar como favorito</span>
                        </label>
                    </div>
                    <div className="modal-footer">
                        {isEdit && <button type="button" className="btn btn-danger" onClick={onDelete} style={{marginRight:'auto'}}>🗑️ Eliminar</button>}
                        <button type="button" className="btn btn-glass" onClick={onClose} disabled={saving}>Cancelar</button>
                        <button type="submit" className="btn btn-primary" disabled={saving}>{saving ? 'Guardando…' : (isEdit ? '💾 Guardar Cambios' : '✨ Crear Truco')}</button>
                    </div>
                </form>
            </div>
        </div>
    );
}

/* ═══════════════════════════════════════════════
   COMPONENT: TrickCard
   ═══════════════════════════════════════════════ */
function TrickCard({ trick, onToggleFav, onEdit, onImageClick, onCopy, copiedId, canEdit = false, canDrag = false, isDragging = false, isDragOver = false, onDragStart, onDragOver, onDrop, onDragEnd }) {
    function handleDragStart(event) {
        if (!canDrag || event.target.closest('button, input, a, img')) {
            event.preventDefault();
            return;
        }
        if (event.dataTransfer) {
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', trick.id);
        }
        onDragStart?.(event, trick);
    }

    return (
        <div
            className={['trick-card', trick.isFavorite ? 'favorite' : '', canDrag ? 'is-draggable' : '', isDragging ? 'is-dragging' : '', isDragOver ? 'is-drag-over' : ''].filter(Boolean).join(' ')}
            draggable={canDrag}
            onDragStart={handleDragStart}
            onDragOver={(event) => {
                if (!canDrag || !onDragOver) return;
                event.preventDefault();
                onDragOver(event, trick);
            }}
            onDrop={(event) => {
                if (!canDrag || !onDrop) return;
                event.preventDefault();
                onDrop(event, trick);
            }}
            onDragEnd={onDragEnd}
        >
            <div className="trick-card-header">
                <h3>{trick.title}</h3>
                <div className="actions">
                    {canDrag && <span className="drag-handle" title="Arrastra para recolocar" aria-label="Arrastra para recolocar">⠿</span>}
                    <button className={`fav-btn ${trick.isFavorite ? 'active' : ''}`} onClick={() => onToggleFav(trick.id)} title={trick.isFavorite ? 'Quitar de favoritos' : 'Añadir a favoritos'} aria-label={trick.isFavorite ? 'Quitar de favoritos' : 'Añadir a favoritos'} aria-pressed={trick.isFavorite}>{trick.isFavorite ? '⭐' : '☆'}</button>
                    {canEdit && <button onClick={() => onEdit(trick)} title="Editar" aria-label="Editar truco">✏️</button>}
                </div>
            </div>

            {trick.description && <p className="description">{trick.description}</p>}

            {trick.imageUrl && (
                <img src={trick.imageUrl} alt={trick.title} className="trick-image" onClick={() => onImageClick(trick.imageUrl)} loading="lazy" />
            )}

            {trick.codeSnippet && (
                <div className="code-snippet" onSelectStart={(event) => event.preventDefault()}>
                    <button className={`copy-btn ${copiedId === trick.id ? 'copied' : ''}`} onClick={() => onCopy(trick)} title={isImageCommandTrick(trick) ? 'Copiar prompt completo' : 'Copiar código'} aria-label={isImageCommandTrick(trick) ? 'Copiar prompt completo al portapapeles' : 'Copiar código al portapapeles'}>
                        {copiedId === trick.id ? '✓' : '📋'}
                    </button>
                    <span className="code-value">{trick.codeSnippet}</span>
                </div>
            )}

            <div className="card-footer">
                <span className="date">{formatDate(trick.createdAt)}</span>
            </div>
        </div>
    );
}

/* ═══════════════════════════════════════════════
   COMPONENT: TrickList (Category View)
   ═══════════════════════════════════════════════ */
function TrickList({ tricks, categoryId, onBack, onToggleFav, onEdit, onImageClick, onCopy, copiedId, onAdd, canEdit, search, setSearch, filter, setFilter, onReorder }) {
    const cat = getCat(categoryId);
    const [draggingId, setDraggingId] = useState(null);
    const [dragOverId, setDragOverId] = useState(null);

    const filtered = useMemo(() => {
        let result = tricks.filter(t => t.category === categoryId);
        if (search.trim()) {
            const q = search.toLowerCase();
            result = result.filter(t => t.title.toLowerCase().includes(q) || t.description.toLowerCase().includes(q) || t.tags.some(tg => tg.toLowerCase().includes(q)));
        }
        if (filter === 'favorites') result = result.filter(t => t.isFavorite);
        if (filter === 'beginner' || filter === 'intermediate' || filter === 'advanced') result = result.filter(t => t.difficulty === filter);
        return result.sort(compareTricks);
    }, [tricks, categoryId, search, filter]);

    function handleDragStart(event, trick) {
        setDraggingId(trick.id);
        setDragOverId(null);
    }

    function handleDragOver(event, trick) {
        if (draggingId && trick.id !== draggingId) setDragOverId(trick.id);
    }

    function resetDragState() {
        setDraggingId(null);
        setDragOverId(null);
    }

    function handleDrop(event, trick) {
        const sourceId = event.dataTransfer?.getData('text/plain') || draggingId;
        if (sourceId && sourceId !== trick.id) onReorder(categoryId, sourceId, trick.id);
        resetDragState();
    }

    return (
        <div>
            <button className="back-nav" onClick={onBack}>← Volver a categorías</button>

            <div className="section-header">
                <h2>{cat?.icon} {cat?.label} <span style={{color:'var(--muted)',fontSize:'0.9rem',fontWeight:400}}>({filtered.length} trucos)</span></h2>
                {canEdit && <button className="btn btn-primary btn-sm" onClick={onAdd}>✨ Nuevo Truco</button>}
            </div>

            {canEdit && <p className="drag-hint">⠿ Arrastra las tarjetas para cambiar su posición.</p>}

            {filtered.length === 0 ? (
                <div className="empty-state">
                    <div className="empty-icon">📭</div>
                    <h3>No hay trucos aquí todavía</h3>
                    <p>{search ? 'Prueba con otros términos de búsqueda' : '¡Añade tu primer truco!'}</p>
                </div>
            ) : (
                <div className="tricks-grid">
                    {filtered.map(t => (
                        <TrickCard
                            key={t.id}
                            trick={t}
                            onToggleFav={onToggleFav}
                            onEdit={onEdit}
                            onImageClick={onImageClick}
                            onCopy={onCopy}
                            copiedId={copiedId}
                            canEdit={canEdit}
                            canDrag={canEdit}
                            isDragging={draggingId === t.id}
                            isDragOver={dragOverId === t.id}
                            onDragStart={handleDragStart}
                            onDragOver={handleDragOver}
                            onDrop={handleDrop}
                            onDragEnd={resetDragState}
                        />
                    ))}
                </div>
            )}
        </div>
    );
}

/* ═══════════════════════════════════════════════
   COMPONENT: GlobalSearch
   ═══════════════════════════════════════════════ */
function GlobalSearch({ tricks, onSelectCategory, onToggleFav, onEdit, onImageClick, onCopy, copiedId, canEdit }) {
    const [query, setQuery] = useState('');

    const results = useMemo(() => {
        if (!query.trim()) return [];
        const q = query.toLowerCase();
        return tricks.filter(t =>
            t.title.toLowerCase().includes(q) ||
            t.description.toLowerCase().includes(q) ||
            t.tags.some(tg => tg.toLowerCase().includes(q)) ||
            (getCat(t.category)?.label || '').toLowerCase().includes(q)
        ).sort((a, b) => b.createdAt - a.createdAt).slice(0, 20);
    }, [tricks, query]);

    return (
        <div>
            <div className="section-header">
                <h2>🔍 Búsqueda Global</h2>
            </div>
            <div className="stats-bar">
                <div className="search-wrap">
                    <span className="search-icon">🔍</span>
                    <input type="text" placeholder="Buscar en todos los trucos..." value={query} onChange={e => setQuery(e.target.value)} autoFocus aria-label="Buscar en todos los trucos" />
                </div>
                {query && <span className="stat-chip"><span className="count">{results.length}</span> resultados</span>}
            </div>

            {query && results.length === 0 ? (
                <div className="empty-state">
                    <div className="empty-icon">🔎</div>
                    <h3>Sin resultados</h3>
                    <p>Prueba con otros términos</p>
                </div>
            ) : query && (
                <div className="tricks-grid">
                    {results.map(t => (
                        <div key={t.id} style={{position:'relative'}}>
                            <TrickCard trick={t} onToggleFav={onToggleFav} onEdit={onEdit} onImageClick={onImageClick} onCopy={onCopy} copiedId={copiedId} canEdit={canEdit} />
                            <button className="btn btn-glass btn-sm" style={{position:'absolute',top:'0.5rem',right:'4rem',zIndex:2}} onClick={() => onSelectCategory(t.category)} title="Ir a la categoría">
                                📂 {getCat(t.category)?.label}
                            </button>
                        </div>
                    ))}
                </div>
            )}
        </div>
    );
}

/* ═══════════════════════════════════════════════
   COMPONENT: ExportImport
   ═══════════════════════════════════════════════ */
function ExportImport({ tricks, onImport }) {
    const [show, setShow] = useState(false);
    const [importData, setImportData] = useState('');
    const fileRef = useRef(null);

    function handleExport() {
        const blob = new Blob([JSON.stringify(tricks, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `trickvault-backup-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function handleFileImport(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const data = JSON.parse(ev.target.result);
                if (Array.isArray(data) && data.every(d => d.id && d.title && d.category)) {
                    onImport(data);
                } else {
                    alert('El archivo no tiene el formato correcto de TrickVault.');
                }
            } catch { alert('Error al leer el archivo JSON.'); }
        };
        reader.readAsText(file);
        e.target.value = '';
    }

    return (
        <div style={{position:'relative'}}>
            <button className="btn btn-glass btn-sm" onClick={() => setShow(!show)}>⚙️ Datos</button>
            {show && (
                <div style={{position:'absolute',top:'100%',right:0, marginTop:'0.5rem', padding:'1rem', borderRadius:'var(--radius-md)', background:'var(--card-bg)', backdropFilter:'blur(20px)', border:'1px solid var(--border)', zIndex:100, minWidth:'220px', display:'flex', flexDirection:'column', gap:'0.75rem'}}>
                    <button className="btn btn-glass btn-sm" onClick={handleExport}>📥 Exportar JSON</button>
                    <label className="btn btn-glass btn-sm" style={{cursor:'pointer',textAlign:'center'}}>
                        📤 Importar JSON
                        <input type="file" accept=".json" ref={fileRef} onChange={handleFileImport} style={{display:'none'}} />
                    </label>
                    <span style={{fontSize:'0.7rem',color:'var(--muted)'}}>{tricks.length} trucos guardados</span>
                </div>
            )}
        </div>
    );
}

/* ═══════════════════════════════════════════════
   APP ROOT
   ═══════════════════════════════════════════════ */
function App() {
    const [tricks, setTricks] = useLocalStorage(STORAGE_KEY, SEED_TRICKS);
    const [view, setView] = useState('categories'); // 'categories' | 'category' | 'search'
    const [currentCategory, setCurrentCategory] = useState(null);
    const [search, setSearch] = useState('');
    const [filter, setFilter] = useState('');
    const [showForm, setShowForm] = useState(false);
    const [editingTrick, setEditingTrick] = useState(null);
    const [lightboxSrc, setLightboxSrc] = useState(null);
    const [copiedId, setCopiedId] = useState(null);
    const [toasts, setToasts] = useState([]);
    const [loading, setLoading] = useState(false);
    const [editUnlocked, setEditUnlocked] = useState(false);
    const [showPasswordModal, setShowPasswordModal] = useState(false);
    const [pendingEditAction, setPendingEditAction] = useState(null);
    const initialTricksRef = useRef(tricks);

    function addToast(msg, type = 'success') {
        const id = uid();
        setToasts(prev => [...prev, { id, msg, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
    }

    function removeToast(id) { setToasts(prev => prev.filter(t => t.id !== id)); }

    const withEditAccess = useCallback((action) => {
        if (editUnlocked) {
            action();
            return;
        }
        setPendingEditAction(() => action);
        setShowPasswordModal(true);
    }, [editUnlocked]);

    const migrateLocalImages = useCallback(async () => {
        let changed = false;
        const next = [];
        for (const trick of tricks) {
            let imageUrl = trick.imageUrl || '';
            if (typeof imageUrl === 'string' && imageUrl.startsWith('data:image/')) {
                imageUrl = await uploadRemoteImage(trick.id, imageUrl);
                changed = true;
            }
            next.push({ ...trick, imageUrl });
        }
        if (changed) setTricks(next);
        return next;
    }, [tricks, setTricks]);

    const submitEditPassword = useCallback(async (password) => {
        try {
            await authenticateRemote(password);
            await migrateLocalImages();
            const action = pendingEditAction;
            setEditUnlocked(true);
            setShowPasswordModal(false);
            setPendingEditAction(null);
            if (action) action();
            return true;
        } catch (error) {
            console.error('[TrickVault] No se pudo iniciar la sesión de edición:', error);
            return false;
        }
    }, [pendingEditAction, migrateLocalImages]);

    const toggleFav = useCallback((id) => {
        setTricks(prev => prev.map(t => t.id === id ? { ...t, isFavorite: !t.isFavorite } : t));
    }, [setTricks]);

    const reorderTricks = useCallback((categoryId, sourceId, targetId) => {
        setTricks(prev => {
            const categoryTricks = prev.filter(t => t.category === categoryId).sort(compareTricks);
            const sourceIndex = categoryTricks.findIndex(t => t.id === sourceId);
            const targetIndex = categoryTricks.findIndex(t => t.id === targetId);
            if (sourceIndex < 0 || targetIndex < 0 || sourceIndex === targetIndex) return prev;
            const [moved] = categoryTricks.splice(sourceIndex, 1);
            categoryTricks.splice(targetIndex, 0, moved);
            const orderById = new Map(categoryTricks.map((trick, index) => [trick.id, index]));
            return prev.map(trick => orderById.has(trick.id) ? { ...trick, sortOrder: orderById.get(trick.id) } : trick);
        });
    }, [setTricks]);

    const deleteEditingTrick = useCallback(() => {
        if (!editingTrick) return;
        withEditAccess(() => {
            if (!confirm('¿Eliminar este truco para siempre?')) return;
            const deletedId = editingTrick.id;
            if (editingTrick.imageUrl) {
                removeRemoteImage(deletedId).catch(error => console.error('[TrickVault] No se pudo borrar la imagen remota:', error));
            }
            setTricks(prev => prev.filter(t => t.id !== deletedId));
            setShowForm(false);
            setEditingTrick(null);
            addToast('🗑️ Truco eliminado', 'error');
        });
    }, [editingTrick, setTricks, withEditAccess]);

    const saveTrick = useCallback(async (formData) => {
        try {
            const targetId = editingTrick?.id || uid();
            const normalized = {
                ...formData,
                title: String(formData.title || '').trim(),
                description: String(formData.description || '').trim(),
                tags: Array.isArray(formData.tags) ? formData.tags : [],
            };

            if (typeof normalized.imageUrl === 'string' && normalized.imageUrl.startsWith('data:image/')) {
                normalized.imageUrl = await uploadRemoteImage(targetId, normalized.imageUrl);
            } else if (editingTrick?.imageUrl && !normalized.imageUrl) {
                await removeRemoteImage(targetId);
            }

            if (editingTrick) {
                setTricks(prev => prev.map(t => t.id === targetId ? { ...t, ...normalized } : t));
                addToast('✅ Truco actualizado');
            } else {
                setTricks(prev => {
                    const maxOrder = prev
                        .filter(trick => trick.category === normalized.category)
                        .reduce((max, trick) => hasSortOrder(trick) ? Math.max(max, Number(trick.sortOrder)) : max, -1);
                    const newTrick = { ...normalized, id: targetId, createdAt: Date.now(), sortOrder: maxOrder + 1 };
                    return [newTrick, ...prev];
                });
                addToast('✨ Truco creado');
            }
            setShowForm(false);
            setEditingTrick(null);
            return true;
        } catch (error) {
            console.error('[TrickVault] No se pudo guardar la imagen:', error);
            addToast('No se pudo guardar la imagen en Hostinger', 'error');
            return false;
        }
    }, [editingTrick, setTricks]);

    const handleCopy = useCallback(async (trick) => {
        try {
            const copyText = getTrickCopyText(trick);
            await navigator.clipboard.writeText(copyText);
            setCopiedId(trick.id);
            addToast(isImageCommandTrick(trick) ? '📋 Prompt completo copiado' : '📋 Código copiado al portapapeles');
            setTimeout(() => setCopiedId(null), 2000);
        } catch {
            addToast('Error al copiar', 'error');
        }
    }, []);

    const handleImport = useCallback((importedTricks) => {
        withEditAccess(() => {
            const existingIds = new Set(tricks.map(t => t.id));
            const newOnes = importedTricks.filter(t => !existingIds.has(t.id));
            if (newOnes.length === 0) {
                addToast('No hay trucos nuevos para importar', 'error');
                return;
            }
            setTricks(prev => [...newOnes, ...prev]);
            addToast(`📤 ${newOnes.length} trucos importados`);
        });
    }, [tricks, setTricks, withEditAccess]);

    const selectCategory = useCallback((catId) => {
        setCurrentCategory(catId);
        setView('category');
        setSearch('');
        setFilter('');
    }, []);

    const goHome = useCallback(() => {
        setView('categories');
        setCurrentCategory(null);
        setSearch('');
        setFilter('');
    }, []);

    const openAddForm = useCallback(() => {
        withEditAccess(() => {
            setEditingTrick(null);
            setShowForm(true);
        });
    }, [withEditAccess]);

    const openEditForm = useCallback((trick) => {
        withEditAccess(() => {
            setEditingTrick(trick);
            setShowForm(true);
        });
    }, [withEditAccess]);

    const toggleEditMode = useCallback(() => {
        if (editUnlocked) {
            setEditUnlocked(false);
            setShowForm(false);
            setEditingTrick(null);
            setShowPasswordModal(false);
            setPendingEditAction(null);
            return;
        }
        withEditAccess(() => setEditUnlocked(true));
    }, [editUnlocked, withEditAccess]);

    useEffect(() => {
        let cancelled = false;

        async function syncImagesFromHostinger() {
            try {
                const remoteImages = await loadRemoteImages();
                const next = [];

                for (const trick of initialTricksRef.current) {
                    let imageUrl = trick.imageUrl || '';
                    if (!(typeof imageUrl === 'string' && imageUrl.startsWith('data:image/')) && remoteImages[trick.id]) {
                        imageUrl = remoteImages[trick.id];
                    }
                    next.push({ ...trick, imageUrl });
                }

                if (!cancelled) setTricks(next);
            } catch (error) {
                console.error('[TrickVault] No se pudieron cargar las imágenes de Hostinger:', error);
            }
        }

        syncImagesFromHostinger();
        return () => { cancelled = true; };
    }, [setTricks]);

    // Simulated loading for premium feel
    useEffect(() => {
        setLoading(true);
        const t = setTimeout(() => setLoading(false), 800);
        return () => clearTimeout(t);
    }, []);

    const totalFavs = useMemo(() => tricks.filter(t => t.isFavorite).length, [tricks]);
    const globalSearchQuery = search; // used across views

    return (
        <div className={`app-container ${view === 'categories' ? 'home-mode' : ''}`}>
            {loading && (
                <div className="loading-overlay">
                    <div className="spinner-triple">
                        <div className="ring ring-1"></div>
                        <div className="ring ring-2"></div>
                        <div className="ring ring-3"></div>
                    </div>
                    <p className="loading-text">Cargando TrickVault...</p>
                </div>
            )}

            {/* TÍTULO CENTRADO */}
            <div className="app-branding" aria-label="TrickVault">
                <span className="app-logo">💎</span>
                <div className="app-title-wrap">
                    <div className="app-title">TrickVault</div>
                    <div className="app-subtitle">Tu colección personal de trucos</div>
                </div>
            </div>

            <div className="prompt-guide" role="note">
                <span className="prompt-guide-icon" aria-hidden="true">💡</span>
                <div>
                    <span className="prompt-guide-kicker">CÓDIGOS DE IMAGEN · GUÍA RÁPIDA</span>
                    <p>{IMAGE_PROMPT_HINT}</p>
                </div>
            </div>

            {/* STATS — solo aparecen en la portada */}
            {view === 'categories' && (
                <div className="stats-bar">
                    <span className="stat-chip">💎 <span className="count">{tricks.length}</span> trucos</span>
                    <span className="stat-chip">📂 <span className="count">{new Set(tricks.map(t => t.category)).size}</span> categorías</span>
                    <span className="stat-chip">⭐ <span className="count">{totalFavs}</span> favoritos</span>
                </div>
            )}

            {/* MAIN CONTENT */}
            {view === 'categories' && (
                <div>
                    <div className="section-header">
                        <h2>📂 Categorías</h2>
                        {editUnlocked && <button className="btn btn-primary btn-sm" onClick={openAddForm}>✨ Nuevo Truco</button>}
                    </div>
                    <CategoryGrid tricks={tricks} onSelectCategory={selectCategory} />
                </div>
            )}

            {view === 'category' && currentCategory && (
                <TrickList
                    tricks={tricks}
                    categoryId={currentCategory}
                    onBack={goHome}
                    onToggleFav={toggleFav}
                    onEdit={openEditForm}
                    onImageClick={setLightboxSrc}
                    onCopy={handleCopy}
                    copiedId={copiedId}
                    onAdd={openAddForm}
                    canEdit={editUnlocked}
                    search={search}
                    setSearch={setSearch}
                    filter={filter}
                    setFilter={setFilter}
                    onReorder={reorderTricks}
                />
            )}

            {view === 'search' && (
                <GlobalSearch
                    tricks={tricks}
                    onSelectCategory={selectCategory}
                    onToggleFav={toggleFav}
                    onEdit={openEditForm}
                    onImageClick={setLightboxSrc}
                    onCopy={handleCopy}
                    copiedId={copiedId}
                    canEdit={editUnlocked}
                />
            )}

            {/* MODALS */}
            {showForm && (
                <TrickForm trick={editingTrick} onSave={saveTrick} onDelete={deleteEditingTrick} onClose={() => { setShowForm(false); setEditingTrick(null); }} />
            )}

            {lightboxSrc && (
                <Lightbox src={lightboxSrc} onClose={() => setLightboxSrc(null)} />
            )}

            {showPasswordModal && (
                <PasswordModal
                    onSubmit={submitEditPassword}
                    onClose={() => { setShowPasswordModal(false); setPendingEditAction(null); }}
                />
            )}

            <Toast toasts={toasts} removeToast={removeToast} />

            {/* FOOTER */}
            <footer className="app-footer">
                <button
                    type="button"
                    className="edit-access-trigger"
                    onClick={toggleEditMode}
                    aria-label={editUnlocked ? 'Salir del modo edición' : 'Activar edición'}
                    title={editUnlocked ? 'Salir del modo edición' : 'Activar edición'}
                >✏️</button>
                TrickVault — Hecho con 💎 y Neon Glassmorphism
            </footer>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
