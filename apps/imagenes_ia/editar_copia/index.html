<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Image Studio | Premium Edition</title>
    <link rel="icon" href="https://atnojs.es/iconos/favicon1.ico" type="image/x-icon">

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Electrolize&family=Montserrat:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React 18 UMD (Con respaldo CDN) -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Babel standalone (JSX) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Sistema de Diseño Neon Glassmorphism (Rutas corregidas hacia la raíz/carpeta superior) -->
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="app.css">

    <script>
        window.onerror = function (msg, url, line, col, error) {
            document.body.innerHTML = '<div style="color:#2ee8ff; background:#041847; padding:20px; font-family:monospace; border: 2px solid #ff4ecd;">' +
                '<h1>Error Crítico de Interfaz</h1>' +
                '<p>' + msg + '</p>' +
                '<p>Line: ' + line + ':' + col + '</p>' +
                '<pre>' + (error ? error.stack : 'No stacktrace') + '</pre>' +
                '</div>';
        };
    </script>
<script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>

<!-- Toggle modelo (vanilla) -->
<style>
  .model-bar {
    display:flex; justify-content:center; gap:0.5rem; padding:0.6rem 1rem; margin:0 auto;
    max-width:600px; z-index:100; position:relative;
    background:rgba(23,79,122,0.35); border:1px solid rgba(0,208,208,0.35);
    border-radius:999px; backdrop-filter:blur(8px);
  }
  .model-bar .mbtn {
    font-family:'Electrolize',sans-serif; font-size:0.78rem; letter-spacing:0.04em;
    padding:0.4rem 1rem; border-radius:999px; border:1px solid transparent;
    background:transparent; color:rgba(204,255,255,0.5); cursor:pointer;
    transition:all 0.2s ease; text-transform:uppercase; white-space:nowrap;
  }
  .model-bar .mbtn:hover { color:#eaffff; border-color:rgba(0,208,208,0.4); }
  .model-bar .mbtn.active.flux {
    background:linear-gradient(135deg,rgba(23,79,122,0.9),#26C626);
    color:#eaffff; border-color:#26C626;
    box-shadow:0 0 16px rgba(38,198,38,0.4); text-shadow:0 0 6px rgba(38,198,38,0.5);
  }
  .model-bar .mbtn.active.gemini {
    background:linear-gradient(135deg,rgba(23,79,122,0.9),#00D0D0);
    color:#CCFFFF; border-color:#00D0D0;
    box-shadow:0 0 16px rgba(0,208,208,0.4); text-shadow:0 0 6px rgba(0,208,208,0.5);
  }
</style>

</head>
<body>
<div id="root"></div>

<div class="model-bar" id="modelBar">
<button class="mbtn active flux" data-model="flux">Flux Pro</button>
<button class="mbtn gemini" data-model="gemini-flash">3.1 Flash</button>
<button class="mbtn gemini" data-model="gemini-pro">3 Pro</button>
</div>

  <script>
    // Toggle de modelo — compartido con React via window.selectedModel
    window.selectedModel = 'flux';
    document.querySelectorAll('#modelBar .mbtn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#modelBar .mbtn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        window.selectedModel = btn.dataset.model;
      });
    });
  </script>

  <script src="history-manager.js"></script>
    <script type="text/babel" src="app.js"></script>
</body>

</html>
