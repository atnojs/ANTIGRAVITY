<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Image Studio Premium Edition</title>
  <link rel="icon" href="https://atnojs.es/iconos/favicon1.ico" type="image/x-icon">

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Electrolize&family=Montserrat:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 UMD (Con respaldo CDN) -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <!-- Babel standalone (JSX) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Sistema de Diseno Neon Glassmorphism (Rutas corregidas hacia la raiz / carpeta superior) -->
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="app.css?v=4">

  <script>
    window.onerror = function (msg, url, line, col, error) {
      document.body.innerHTML = '<div style="color:#2ee8ff; background:#041847; padding:20px; font-family:monospace; border: 2px solid #ff4ecd;">' +
        '<h1>Error Critico en la Interfaz</h1>' +
        '<p>' + msg + '</p>' +
        '<p>Line: ' + line + ':' + col + '</p>' +
        '<pre>' + (error ? error.stack : 'No stacktrace') + '</pre>' +
        '</div>';
    };
  </script>
</head>

<body>
  <div id="root"></div>
  <script src="history-manager.js"></script>
  <script type="text/babel" src="app.js?v=6"></script>
</body>

</html>
