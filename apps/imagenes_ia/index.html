    <!-- Triple spinner CSS -->
    <style>
    .loading-overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;background:radial-gradient(circle at 0% 0%,rgba(0,208,208,0.3),transparent 55%),radial-gradient(circle at 100% 100%,rgba(0,16,24,0.95),rgba(0,16,24,1));backdrop-filter:blur(32px) saturate(1.8);-webkit-backdrop-filter:blur(32px) saturate(1.8)}
    .loading-overlay.hidden{display:none}
    .spinner-triple{position:relative;width:80px;height:80px}
    .spinner-triple .ring{position:absolute;border-radius:50%;border:3px solid transparent}
    .spinner-triple .ring-1{inset:0;border-top-color:#00D0D0;animation:triple-spin 1.2s linear infinite;box-shadow:0 0 20px rgba(0,208,208,0.4)}
    .spinner-triple .ring-2{inset:10px;border-right-color:#26C626;animation:triple-spin-rev 1s linear infinite;box-shadow:0 0 15px rgba(38,198,38,0.4)}
    .spinner-triple .ring-3{inset:20px;border-bottom-color:#00D0D0;animation:triple-spin 0.8s linear infinite;box-shadow:0 0 10px rgba(0,208,208,0.4)}
    .loading-text{color:#eaffff;font-size:1.125rem;font-weight:500;text-align:center;text-transform:uppercase;letter-spacing:0.12em}
    @keyframes triple-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes triple-spin-rev{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
    </style>
