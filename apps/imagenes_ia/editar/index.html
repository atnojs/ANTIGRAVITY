<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Image Studio | Premium Edition</title>
    <link rel="icon" href="https://atnojs.es/iconos/favicon1.ico" type="image/x-icon">

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (opcional, para utilidades) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React 18 UMD -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel standalone (JSX) -->
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>

    <!-- Lucide Icons (global) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Sistema de Diseño Neon Glassmorphism -->
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="app.css">

    <script>
        window.onerror = function (msg, url, line, col, error) {
            document.body.innerHTML = '<div style="color:#2ee8ff; background:#041847; padding:20px; font-family:monospace; border: 2px solid #ff4ecd;">' +
                '<h1>Error Crítico de Interfaz</h1>' +
                '<p>' + msg + '</p>' +
                '<p>Line: ' + line + ':' + col + '</p>' +
                '<pre>' + (error ? error.stack : 'No stacktrace') + '</pre>' +
                '</div>';
        };
    </script>
</head>

<body>
    <div id="root"></div>
    <script src="history-manager.js"></script>
    <script type="text/babel" src="app.js"></script>
</body>

</html>
