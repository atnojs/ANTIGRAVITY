<!doctype html>
<html lang="en">
  <head>
    <script id="fetch-compatibility-patch">
      // Patch global fetch descriptor because some sandboxed browser/testing environments
      // try to override window.fetch directly, which can throw if it only has a getter.
      (function() {
        try {
          if (typeof window !== 'undefined') {
            let currentFetch = window.fetch;
            const patch = {
              get() {
                return currentFetch;
              },
              set(newValue) {
                currentFetch = newValue;
              },
              configurable: true,
              enumerable: true
            };
            Object.defineProperty(window, 'fetch', patch);
            if (typeof Window !== 'undefined' && Window.prototype) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', patch);
              } catch (_) {}
            }
          }
        } catch (e) {
          console.warn("[Compatibility Patch] Could not install fetch getter/setter patch:", e);
        }
      })();
    </script>
