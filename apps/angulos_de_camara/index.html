<!-- Ángulos de Cámara — Estilo Hoola (FLUX + Historial servidor) -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="description" content="Generador de ángulos de cámara con IA FLUX. Arrastra una imagen y obtén perspectivas diferentes al instante."/>
  <title>Ángulos de Cámara</title>
  <link rel="icon" href="https://atnojs.es/imagenes/favicon_negro1.ico" type="image/x-icon">

  <!-- Fuente Electrolize (Hoola) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Electrolize&display=swap" rel="stylesheet">

  <!-- Iconos Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

  <!-- CSS Hoola -->
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>Generador de Ángulos de Cámara</h1>
      <p>Arrastra una imagen y obtén 5 perspectivas de cámara diferentes al instante con IA FLUX.</p>
    </header>

    <main class="app-container glass-hover">
      <div id="upload-container">
        <!-- Drop zone -->
        <div id="drop-zone" class="drop-zone">
          <div id="drop-zone-content">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <p>Arrastra y suelta tu imagen aquí</p>
            <p class="muted-inline">o haz clic para seleccionarla</p>
          </div>
          <input type="file" id="file-input" class="hidden" accept="image/*">
        </div>

        <!-- Selector de planos + calidad + formato + fondo -->
        <div id="shot-selector" class="hidden">
          <div class="shot-options-container">
            <button class="shot-option glass-hover" data-shot="general">Plano General</button>
            <button class="shot-option glass-hover" data-shot="medium">Plano Medio</button>
            <button class="shot-option glass-hover" data-shot="close-up">Primer Plano</button>
            <button class="shot-option glass-hover" data-shot="side">Plano Lateral</button>
            <button class="shot-option glass-hover" data-shot="top-down">Plano Cenital</button>
          </div>

          <!-- Selector de calidad PRO / MAX -->
          <div class="quality-selector">
            <button class="quality-btn active" data-quality="pro">PRO</button>
            <button class="quality-btn" data-quality="max">MAX</button>
          </div>

          <!-- Formato + Resolución -->
          <div class="format-row">
            <div class="format-group">
              <label for="aspect-ratio">Formato</label>
              <select id="aspect-ratio">
                <option value="1:1">1:1 Cuadrado</option>
                <option value="16:9">16:9 Horizontal</option>
                <option value="9:16">9:16 Vertical</option>
                <option value="4:3">4:3</option>
                <option value="3:4">3:4</option>
                <option value="3:2">3:2</option>
                <option value="2:3">2:3</option>
              </select>
            </div>
            <div class="format-group">
              <label for="resolution">Resolución</label>
              <select id="resolution">
                <option value="512">512</option>
                <option value="1024" selected>1024</option>
                <option value="2048">2048</option>
                <option value="4096">4096</option>
              </select>
            </div>
            <div class="format-group">
              <label for="output-format">Tipo</label>
              <select id="output-format">
                <option value="png">PNG</option>
                <option value="jpeg">JPEG</option>
                <option value="webp">WebP</option>
              </select>
            </div>
          </div>

          <!-- Fondo -->
          <div class="background-selector">
            <select id="background-option">
              <option value="solid">Fondo liso (todas las imágenes)</option>
              <option value="same-realistic">Fondo fotorrealista igual</option>
              <option value="different-realistic" selected>Fondo diferente por imagen</option>
            </select>
          </div>

          <div class="action-buttons">
            <button id="generate-btn" class="btn btn-primary btn-3d" disabled>
              <i class="fa-solid fa-wand-magic-sparkles"></i> Generar Imágenes
            </button>
            <button id="show-history-btn" class="btn btn-secondary btn-3d glass-hover" type="button">
              <i class="fa-solid fa-clock-rotate-left"></i> Ver historial guardado
            </button>
          </div>
        </div>
      </div>

      <!-- Resultados -->
      <div id="results-container" class="hidden">
        <div class="results-header">
          <h2 class="results-title">Resultados Generados</h2>
          <div class="action-buttons">
            <button id="clear-all-btn" class="btn btn-danger btn-3d">
              <i class="fa-solid fa-trash"></i> Limpiar Todo
            </button>
            <button id="download-all-btn" class="btn btn-primary btn-3d">
              <i class="fa-solid fa-file-zipper"></i> Descargar Todo
            </button>
          </div>
        </div>

        <section id="gallery-panel" class="full-bleed" aria-label="Galería de imágenes generadas">
          <div id="gallery-strip" class="gallery-strip" aria-live="polite"></div>
        </section>
        <div id="image-grid"></div>
      </div>

      <!-- Historial Persistente (servidor) -->
      <div id="history-container" class="hidden">
        <div class="history-header">
          <h2 class="history-title">
            <i class="fa-solid fa-clock-rotate-left"></i> Historial de Generaciones
          </h2>
          <button id="clear-history-btn" class="btn btn-danger btn-sm btn-3d">
            <i class="fa-solid fa-trash-can"></i> Limpiar Historial
          </button>
        </div>
        <section id="history-panel" class="full-bleed" aria-label="Historial de imágenes">
          <div id="history-strip" class="gallery-strip history-strip" aria-live="polite"></div>
        </section>
      </div>
    </main>
  </div>

  <!-- ===== LOADING OVERLAY CANÓNICO ===== -->
  <div class="loading-overlay hidden" id="loadingOverlay" role="status" aria-live="polite" aria-busy="false">
    <div class="loading-bg-image"></div>
    <div class="spinner-triple">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
    </div>
    <p class="loading-text">IA generando lo solicitado...</p>
  </div>

  <!-- ===== LIGHTBOX CANÓNICO ===== -->
  <div id="lightbox" class="lightbox hidden" aria-hidden="true">
    <img id="lightbox-img" src="" alt="Imagen ampliada">
  </div>

  <!-- JSZip para descarga ZIP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <!-- HistoryManager canónico (servidor) -->
  <script src="history-manager.js"></script>
  <!-- Lógica de la app -->
  <script src="app.js" defer></script>
</body>
</html>
