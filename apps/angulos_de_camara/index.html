<!-- Ángulos de Cámara — Estilo Hoola (FLUX + Historial servidor) -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="description" content="Generador de ángulos de cámara con IA FLUX. Arrastra una imagen y obtén perspectivas diferentes al instante."/>
  <title>Ángulos de Cámara</title>
  <link rel="icon" href="https://atnojs.es/imagenes/favicon_negro1.ico" type="image/x-icon">

  <!-- Fuente Electrolize (Hoola) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Electrolize&display=swap" rel="stylesheet">

  <!-- Iconos Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

  <!-- CSS Hoola -->
  <link rel="stylesheet" href="app.css?v=7">
</head>
<body>

  <div class="container">
    <header>
      <h1>Generador de Ángulos de Cámara</h1>
      <p>Arrastra una imagen y obtén 5 perspectivas de cámara diferentes al instante con IA FLUX.</p>
    </header>

    <main class="app-container glass-hover">
      <div class="main-content">
      <div id="upload-container">
        <!-- Drop zone -->
        <div id="drop-zone" class="drop-zone">
          <div id="drop-zone-content">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <p>Arrastra y suelta tu imagen aquí</p>
            <p class="muted-inline">o haz clic para seleccionarla</p>
          </div>
          <input type="file" id="file-input" class="hidden" accept="image/*">
        </div>

        <!-- Selector de planos + calidad + formato + fondo -->
        <div id="shot-selector" class="hidden">
          <div class="shot-options-container">
            <button class="shot-option glass-hover" data-shot="general">Plano General</button>
            <button class="shot-option glass-hover" data-shot="medium">Plano Medio</button>
            <button class="shot-option glass-hover" data-shot="close-up">Primer Plano</button>
            <button class="shot-option glass-hover" data-shot="side">Plano Lateral</button>
            <button class="shot-option glass-hover" data-shot="top-down">Plano Cenital</button>
          </div>

        <!-- Selector de modelo IA (patrón canónico toggles pill hoola, SKILL_MAESTRA) -->
        <div class="model-selector">
          <span class="model-selector-label">Modelo IA</span>
          <div class="model-toggle-group" role="group" aria-label="Seleccionar modelo">
            <button type="button" class="model-toggle" data-model="gemini-flash">3.1FLASH</button>
            <button type="button" class="model-toggle active" data-model="gemini-pro">3 PRO</button>
            <button type="button" class="model-toggle" data-model="flux-pro">FLUX PRO</button>
            <button type="button" class="model-toggle" data-model="flux-max">FLUX MAX</button>
          </div>
        </div>

          <!-- Selector de calidad PRO / MAX -->
          <div class="quality-selector">
            <button class="quality-btn active" data-quality="pro">PRO</button>
            <button class="quality-btn" data-quality="max">MAX</button>
          </div>

          <!-- Formato + Resolución + Tipo en fila única -->
          <div class="format-row">
            <!-- Formato (toggle buttons) -->
            <div class="format-group">
              <label>Formato</label>
              <div class="toggle-row" id="aspect-ratio-toggles">
                <button class="toggle-btn" data-value="1:1">1:1</button>
                <button class="toggle-btn" data-value="16:9">16:9</button>
                <button class="toggle-btn" data-value="9:16">9:16</button>
                <button class="toggle-btn" data-value="4:3">4:3</button>
                <button class="toggle-btn" data-value="3:4">3:4</button>
                <button class="toggle-btn" data-value="3:2">3:2</button>
                <button class="toggle-btn active" data-value="2:3">2:3</button>
              </div>
            </div>

            <!-- Resolución (toggle buttons, fila horizontal) -->
            <div class="format-group">
              <label>Resolución</label>
              <div class="toggle-row" id="resolution-toggles">
                <button class="toggle-btn" data-value="512">512</button>
                <button class="toggle-btn active" data-value="1024">1024</button>
                <button class="toggle-btn" data-value="2048">2048</button>
                <button class="toggle-btn" data-value="4096">4096</button>
              </div>
            </div>

            <!-- Tipo de archivo (toggle buttons) -->
            <div class="format-group">
              <label>Tipo</label>
              <div class="toggle-row" id="output-format-toggles">
                <button class="toggle-btn active" data-value="png">PNG</button>
                <button class="toggle-btn" data-value="jpeg">JPEG</button>
                <button class="toggle-btn" data-value="webp">WebP</button>
              </div>
            </div>
          </div>

          <!-- Fondo (toggle buttons) -->
          <div class="format-group" style="width:100%;max-width:500px;">
            <label>Fondo</label>
            <div class="toggle-row" id="background-toggles">
              <button class="toggle-btn" data-value="solid">Liso</button>
              <button class="toggle-btn" data-value="same-realistic">Igual</button>
              <button class="toggle-btn active" data-value="different-realistic">Aleatorio</button>
            </div>
          </div>

          <div class="action-buttons">
            <button id="generate-btn" class="btn btn-primary btn-3d" disabled>
              <i class="fa-solid fa-wand-magic-sparkles"></i> Generar Imágenes
            </button>
            <button id="show-history-btn" class="btn btn-secondary btn-3d glass-hover" type="button">
              <i class="fa-solid fa-clock-rotate-left"></i> Ver historial guardado
            </button>
          </div>
        </div>
      </div>

      <!-- Resultados -->
      <div id="results-container" class="hidden">
        <div class="results-header">
          <h2 class="results-title">Resultados Generados</h2>
          <div class="action-buttons">
            <button id="clear-all-btn" class="btn btn-danger btn-3d">
              <i class="fa-solid fa-trash"></i> Limpiar Todo
            </button>
            <button id="download-all-btn" class="btn btn-primary btn-3d">
              <i class="fa-solid fa-file-zipper"></i> Descargar Todo
            </button>
          </div>
        </div>

        <section id="gallery-panel" class="full-bleed" aria-label="Galería de imágenes generadas">
          <div id="gallery-strip" class="gallery-strip" aria-live="polite"></div>
        </section>
        <div id="image-grid"></div>
      </div>

      </div><!-- /main-content -->

      <!-- Historial Persistente (servidor) -->
      <div id="history-container" class="hidden">
        <div class="history-header">
          <h2 class="history-title">
            <i class="fa-solid fa-clock-rotate-left"></i> Historial de Generaciones
          </h2>
          <button id="clear-history-btn" class="btn btn-danger btn-sm btn-3d">
            <i class="fa-solid fa-trash-can"></i> Limpiar Historial
          </button>
        </div>
        <section id="history-panel" class="full-bleed" aria-label="Historial de imágenes">
          <div id="history-strip" class="gallery-strip history-strip" aria-live="polite"></div>
        </section>
      </div>
    </main>
  </div>

  <!-- ===== LOADING OVERLAY CANÓNICO (dibujo_lineas_copia) ===== -->
  <div class="loading-overlay hidden" id="loadingOverlay" role="status" aria-live="polite" aria-busy="false">
    <div class="spinner-triple">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
    </div>
    <p class="loading-text">IA generando lo solicitado...</p>
    <div class="progress-panel">
      <div class="progress-bar-track">
        <div id="overlay-progress-bar" class="progress-bar-fill" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div>
      </div>
      <p id="secondary-status" class="secondary-status"></p>
    </div>
  </div>

  <!-- ===== LIGHTBOX CANÓNICO ===== -->
  <div id="lightbox" class="lightbox hidden" aria-hidden="true">
    <img id="lightbox-img" src="" alt="Imagen ampliada">
  </div>

  <!-- JSZip para descarga ZIP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <!-- HistoryManager canónico (servidor) -->
  <script src="history-manager.js"></script>
  <!-- Lógica de la app -->
  <script src="app.js?v=6" defer></script>
</body>
</html>
