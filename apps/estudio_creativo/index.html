<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudio Creativo — Generación y Edición de Imágenes con IA</title>
  <link rel="icon" href="https://atnojs.es/iconos/favicon1.ico" type="image/x-icon">

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Electrolize&display=swap" rel="stylesheet">

  <!-- React 18 UMD -->
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>

  <!-- Babel standalone -->
  <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- CSS hoola canónico -->
  <link rel="stylesheet" href="base.css?v=1">
  <link rel="stylesheet" href="app.css?v=1">

  <script>
    window.onerror = function (msg, url, line, col, error) {
      document.body.innerHTML = '<div style="color:#2ee8ff; background:#041847; padding:20px; font-family:monospace; border: 2px solid #ff4ecd;">' +
        '<h1>Error Crítico en la Interfaz</h1>' +
        '<p>' + msg + '</p>' +
        '<p>Line: ' + line + ':' + col + '</p>' +
        '<pre>' + (error ? error.stack : 'No stacktrace') + '</pre>' +
        '</div>';
    };
  </script>
</head>
<body>
  <div id="root"></div>
  <script src="history-manager.js"></script>
  <script type="text/babel" src="app.js?v=1"></script>
</body>
</html>
